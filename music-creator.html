<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Creator · McCluster Music</title>
  <meta name="description" content="Listen to and license independent music on McCluster Music.">
  <link rel="icon" type="image/png" href="assets/img/m-mark.png">
  <link rel="stylesheet" href="css/style.css?v=__STAMP__">
  <link rel="stylesheet" href="css/music-creator.css?v=__STAMP__">
  <link rel="stylesheet" href="css/music-engine.css?v=__STAMP__">
  <script src="js/theme.js?v=__STAMP__"></script>
</head>
<body class="songpage">
  <main class="creator-shell">
    <section class="creator-hero" id="creatorHero">
      <div class="creator-hero__copy">
        <img class="creator-avatar" id="creatorAvatar" src="assets/img/m-mark.png" alt="">
        <div class="creator-kicker" id="creatorHandle">@creator</div>
        <h1 id="creatorArtist">Creator</h1>
        <p id="creatorBio">Opening profile…</p>
      </div>
    </section>

    <section class="creator-card wide" style="margin-top:18px">
      <h2>Releases</h2>
      <p>Play here. You do not need to leave this page to hear a track.</p>
      <div class="creator-tracks" id="creatorPublicTracks"><div class="creator-status">Loading releases…</div></div>
    </section>
  </main>

  <script src="js/analytics.js?v=__STAMP__"></script>
  <script src="js/mcc-auth.js?v=__STAMP__"></script>
  <script src="js/gated-audio.js?v=__STAMP__"></script>
  <script src="js/music-engine.js?v=__STAMP__"></script>

  <script src="js/music-creator-profile.js?v=__STAMP__"></script>
