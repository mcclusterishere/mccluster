<!doctype html>
<html lang="en" data-theme-lock="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Operator OS · McCluster</title>
  <meta name="description" content="The McCluster operator console: one authenticated shell over the control plane.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" type="image/png" href="assets/img/hm-mark-96.png">
  <link rel="stylesheet" href="css/operator.css?v=__STAMP__">
  <style>
    /* Component styles that belong to this shell rather than to the
       shared system: the comms workspace, media asset grid and the
       thread/queue lists have no second consumer. */
    .op-cols--comms { grid-template-columns: 190px 280px 1fr 320px; }
    @media (max-width: 1400px) { .op-cols--comms { grid-template-columns: 170px 250px 1fr; } }
    @media (max-width: 1100px) { .op-cols--comms { grid-template-columns: 1fr; } }

    .op-queue {
      display: flex; width: 100%; align-items: center; gap: .5rem;
      background: transparent; border: 0; border-radius: 6px; cursor: pointer;
      color: var(--op-dim); padding: .35rem .5rem; font: 500 .8rem var(--op-sans); text-align: left;
    }
    .op-queue:hover { background: var(--op-surface-2); color: var(--op-text); }
    .op-queue.is-on { background: var(--op-ruby-dim); color: var(--op-text); }
    .op-queue b { margin-left: auto; font-family: var(--op-mono); font-size: .72rem; }

    .op-threadlist { max-height: calc(100vh - 190px); overflow-y: auto; }
    .op-thread {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: transparent; border: 0; border-bottom: 1px solid var(--op-line-soft);
      padding: .5rem .7rem; color: var(--op-text);
    }
    .op-thread:hover { background: var(--op-surface-2); }
    .op-thread.is-on { background: var(--op-ruby-dim); }
    .op-thread__top { display: flex; align-items: baseline; gap: .5rem; }
    .op-thread__top b { font-size: .82rem; }
    .op-thread__top time { margin-left: auto; font: 500 .68rem var(--op-mono); color: var(--op-faint); }
    .op-thread__sub { display: flex; align-items: center; gap: .4rem; margin-top: .2rem; }
    .op-thread__sub em { font-style: normal; font-size: .73rem; color: var(--op-faint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .op-convo { display: flex; flex-direction: column; min-height: 420px; max-height: calc(100vh - 140px); }
    .op-convo__head { padding: .6rem .8rem; border-bottom: 1px solid var(--op-line-soft); background: var(--op-surface-2); }
    .op-convo__body { flex: 1; overflow-y: auto; padding: .7rem .8rem; }
    .op-convo__foot { padding: .6rem .8rem; border-top: 1px solid var(--op-line-soft); background: var(--op-surface-2); }
    .op-msgs { display: flex; flex-direction: column; gap: .6rem; }
    .op-msg { max-width: 82%; }
    .op-msg--out { margin-left: auto; text-align: right; }
    .op-msg__meta { margin: 0 0 .15rem; display: flex; align-items: center; gap: .35em;
      font: 500 .66rem var(--op-mono); color: var(--op-faint); }
    .op-msg--out .op-msg__meta { justify-content: flex-end; }
    .op-msg__body {
      margin: 0; padding: .45rem .6rem; border-radius: 8px; font-size: .82rem;
      background: var(--op-surface-3); border: 1px solid var(--op-line); white-space: pre-wrap;
    }
    .op-msg--out .op-msg__body { background: var(--op-ruby-dim); border-color: rgba(229,56,59,.3); }

    .op-assets { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .op-asset { width: 100%; border-radius: 6px; border: 1px solid var(--op-line); background: var(--op-bg); display: block; }
    .op-asset--none, .op-asset--file {
      padding: 1.2rem .5rem; text-align: center; color: var(--op-faint);
      font-size: .74rem; text-decoration: none;
    }
    .op-jobcard { padding: .5rem .6rem; border: 1px solid var(--op-line); border-radius: 6px;
      background: var(--op-surface-2); margin-bottom: .5rem; cursor: pointer; }
    .op-jobcard:hover { border-color: var(--op-faint); }
    .op-jobcard__head { display: flex; align-items: center; gap: .5rem; font-size: .78rem; }
    .op-jobcard__head time { margin-left: auto; font: 500 .68rem var(--op-mono); color: var(--op-faint); }

    .op-noscript { max-width: 30rem; margin: 20vh auto; text-align: center; color: #9aa2ab; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="op">
  <div id="op-root">
    <div class="op-state op-state--loading" style="margin:20vh auto;justify-content:center">
      <span class="op-spin"></span>Starting the console…
    </div>
  </div>

  <noscript>
    <div class="op-noscript">
      <h1>Operator OS</h1>
      <p>This console is a live view of the McCluster control plane and needs JavaScript.</p>
    </div>
  </noscript>

  <!-- The site's existing Supabase session owns auth; the console borrows it
       rather than starting a second auth story. -->
  <script src="js/mcc-auth.js?v=__STAMP__"></script>
  <script type="module" src="js/operator/app.js?v=__STAMP__"></script>
</body>
</html>
