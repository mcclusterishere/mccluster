<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A hands-on 3D server lab in the Equity Uprise building's B1 MDF: identify, rebuild, bring up and troubleshoot a rack server.">
  <title>Server Lab · Equity Uprise B1</title>
  <meta name="theme-color" content="#0d1114">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <link rel="stylesheet" href="css/server-lab.css?v=__STAMP__">
</head>
<body class="server-lab-page">
  <!-- Owner only (owner, 2026-11-03: "the whole learning management system is going to be on my private account").
       Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs:
       GET https://api.mccluster.org/v1/status with the session). The lab's markup and scripts live in the template. -->
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="labTpl" data-owner-load="js/server-lab/app.mjs?v=__STAMP__">
    <h1>Owner only</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="labTpl">
    <div class="sl-app" id="slApp">
      <div class="sl-stage" id="slStage" aria-label="3D view of MDF rack 01 in B1" role="img"></div>
      <header class="sl-top">
        <a class="sl-back" href="prim3.html" aria-label="Back to PRIM3">‹</a>
        <a class="sl-btn" href="screens/terminal.html?tab=hardware&amp;mode=TRAINING&amp;computer=B1-SRV-HYP-01-I001" style="padding:12px;font-size:16px">Computers</a>
        <div class="sl-title"><strong>Server Lab</strong><span id="slWhere">B1 · MDF rack 01 · sandbox</span></div>
        <span class="sl-timer" id="slTimer" hidden>0:00</span>
      </header>
      <nav class="sl-levels" id="slLevels" aria-label="Levels">
        <button type="button" data-level="EXPLORE" aria-pressed="true">Explore</button>
        <button type="button" data-level="L1">L1 Identify</button>
        <button type="button" data-level="L2">L2 Rebuild</button>
        <button type="button" data-level="L3">L3 Bring-up</button>
        <button type="button" data-level="L4">L4 Troubleshoot</button>
      </nav>
      <div class="sl-tools" id="slTools" role="toolbar" aria-label="View">
        <button type="button" data-tool="walk" title="Walk to the rack">Walk to rack</button>
        <button type="button" data-tool="slide" title="Slide the server out on its rails">Slide out</button>
        <button type="button" data-tool="lid" title="Open or close the lid">Lid</button>
        <button type="button" data-tool="explode" title="Exploded view" aria-pressed="false">Explode</button>
        <button type="button" data-tool="rear" title="Look at the rear">Rear</button>
      </div>
      <aside class="sl-sheet" id="slSheet" aria-label="Lab panel">
        <button type="button" class="sl-grip" id="slGrip" aria-label="Expand or collapse the panel" aria-expanded="true"></button>
        <div class="sl-sheet__body" id="slBody"><p class="sl-muted">Loading the rack…</p></div>
      </aside>
      <div class="sl-tip" id="slTip" hidden></div>
    </div>
  </template>
  <script type="module" src="js/owner-only.mjs?v=__STAMP__"></script>
</body>
</html>
