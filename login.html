  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f4efe6;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;min-height:100svh;padding:24px}.card{width:min(92vw,430px);border:1px solid var(--mcc-rule-strong);border-radius:24px;padding:28px;background:linear-gradient(160deg,var(--mcc-surface-2),var(--mcc-surface));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.35);animation:mcc-rise .5s var(--mcc-ease) both}.mark{font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#d9b96a;font-size:.72rem}.card h1{font-size:2.25rem;line-height:1;margin:.75rem 0}.card p{color:#b9b6ac;line-height:1.6}
    .go{display:block;margin-top:20px;padding:13px 16px;border-radius:13px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px #2d2b28;color:#f4efe6;text-decoration:none;text-align:center;font-weight:800;font-size:.95rem;transition:transform .22s var(--mcc-spring),background .2s}.go:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
    .back{display:inline-block;margin-top:18px;color:#d9b96a;text-decoration:none;font-weight:700}
  </style>

<body>
  <main class="card">
    <div class="mark">McCluster Platform</div>
    <h1>Sign in.</h1>
    <p>Sign-in is your M Account. Taking you there&hellip;</p>
    <a class="go" id="go" href="account.html">Continue to sign in</a>
    <a class="back" href="index.html">&larr; Back to HERE</a>
  </main>
<script>
/* THIN FORWARDER. Sign-in lives on account.html (js/mcc-auth.js, the M
   Account on Supabase). This page once rendered a Google button against a
   separate auth host that was never provisioned (no DNS record), so nobody
   could sign in here. Old links and bookmarks still arrive, so it forwards
   them on this origin and carries ?next= through under the same rule as
   MCC.safeNext: a path on THIS origin only. A scheme (https:, javascript:),
   a protocol-relative //host, a backslash or a control character is refused
   and the person lands on account.html with no destination. account.html
   refuses itself as a destination, so that is dropped here too. */
(function () {
  function safeNext() {
    var raw = '';
    try { raw = new URLSearchParams(location.search).get('next') || ''; } catch (_) {}
    raw = String(raw).trim();
    if (!raw || raw.length > 2000) return '';
    if (/[\u0000-\u001f\u007f\\]/.test(raw) || /^\/\//.test(raw) || /^[a-z][a-z0-9+.-]*:/i.test(raw)) return '';
    try {
      var target = new URL(raw, location.origin);
      if (target.origin !== location.origin || !/^https?:$/.test(target.protocol)) return '';
      return target.pathname + target.search + target.hash;
    } catch (_) { return ''; }
  }
  var next = safeNext();
  if (/(^|\/)account\.html$/.test(next.split(/[?#]/)[0])) next = '';
  var to = 'account.html' + (next ? '?next=' + encodeURIComponent(next) : '');
  var go = document.getElementById('go');
  if (go) go.href = to;
  location.replace(to);
})();
</script>
  <script src="js/tabbar.js?v=__STAMP__"></script>
</body>
</html>
