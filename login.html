<!doctype html>
<html lang="en" data-theme-lock="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sign in · McCluster</title>
  <meta name="robots" content="noindex,nofollow">
  <script>
    /* backend.js consumes the auth hash and clears it with replaceState, so
       the recovery flag has to be read before that runs. */
    window.__MCC_RECOVERY = /(^|[#&])type=recovery(&|$)/.test(location.hash);
  </script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f4efe6;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{display:grid;place-items:center;min-height:100svh;padding:24px}

    .card{width:min(100%,25rem);border:1px solid #2d2b28;border-radius:22px;padding:clamp(22px,5vw,30px);
      background:#131314;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .mark{font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#d9b96a;font-size:.68rem}
    h1{font-size:clamp(1.9rem,7vw,2.25rem);line-height:1.05;margin:.6rem 0 .4rem;letter-spacing:-.01em}
    .sub{color:#b9b6ac;line-height:1.55;margin:0 0 1.4rem;font-size:.94rem}

    label{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
      font-weight:800;color:#8f8b82;margin-top:1rem}
    input{width:100%;margin-top:.4rem;padding:.85rem 1rem;border:1px solid #33312d;border-radius:14px;
      background:#0d0d0e;color:#f4efe6;font:inherit;font-size:1rem;transition:border-color .15s,box-shadow .15s}
    input:focus-visible{outline:none;border-color:#d9b96a;box-shadow:0 0 0 3px rgba(217,185,106,.18)}

    button{font:inherit;cursor:pointer}
    .go{width:100%;margin-top:1.4rem;padding:.9rem 1rem;border:0;border-radius:999px;
      background:#d9b96a;color:#1a1408;font-weight:800;letter-spacing:.01em;font-size:1rem;
      transition:filter .15s,transform .06s}
    .go:hover{filter:brightness(1.07)}
    .go:active{transform:translateY(1px)}
    .go[disabled]{opacity:.55;cursor:default;filter:none;transform:none}

    .linkish{display:inline-block;margin-top:.9rem;background:none;border:0;padding:0;
      color:#d9b96a;font-size:.86rem;font-weight:700;text-decoration:underline;text-underline-offset:3px}
    .linkish[disabled]{opacity:.55;cursor:default}

    .rule{display:flex;align-items:center;gap:.8rem;margin:1.5rem 0 .2rem;color:#6f6c65;font-size:.72rem;
      letter-spacing:.14em;text-transform:uppercase;font-weight:800}
    .rule::before,.rule::after{content:"";flex:1;height:1px;background:#2d2b28}

    .google{margin-top:1rem;min-height:44px;display:flex;justify-content:center}
    .status{min-height:1.4em;margin-top:1rem;font-size:.88rem;line-height:1.5;color:#b9b6ac}
    .status.ok{color:#9ee5a8}
    .status.bad{color:#f2a49c}
    .back{display:inline-block;margin-top:1.4rem;color:#8f8b82;text-decoration:none;font-size:.86rem;font-weight:700}
    .back:hover{color:#d9b96a}
    [hidden]{display:none!important}
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="css/style.css?v=__STAMP__">
</head>
<body>
  <main class="card">
    <div class="mark">McCluster</div>

    <!-- SIGN IN -->
    <section id="signin">
      <h1>Sign in.</h1>
      <p class="sub">One account for your website, app, messaging, domains and console.</p>

      <form id="pwForm" autocomplete="on" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email"
               autocapitalize="off" spellcheck="false" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button class="go" id="submit" type="submit">Sign in</button>
      </form>

      <button class="linkish" id="forgot" type="button">Forgot your password?</button>

      <div class="rule">or</div>
      <div id="googleButton" class="google"></div>
    </section>

    <!-- SET A NEW PASSWORD (recovery link landing) -->
    <section id="reset" hidden>
      <h1>New password.</h1>
      <p class="sub">Choose a new password for your account. This replaces the old one everywhere.</p>

      <form id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>

        <button class="go" id="resetSubmit" type="submit">Save password</button>
      </form>
    </section>

    <p class="status" id="status" aria-live="polite" role="status"></p>
    <a class="back" href="index.html">&larr; Back to HERE</a>
  </main>

  <script src="js/backend.js?v=__STAMP__"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var status = $("status");
    var params = new URLSearchParams(location.search);
    var next = params.get("next") || "account.html";

    function say(text, kind) {
      status.textContent = text || "";
      status.className = "status" + (kind ? " " + kind : "");
    }

    // Only same-document relative targets: a `next` of
    // https://evil.test turns this page into an open redirect, and a
    // signed-in owner is exactly who you would aim one at.
    function safeNext(value) {
      if (!value || /^[a-z][a-z0-9+.-]*:/i.test(value) || value.indexOf("//") === 0) return "account.html";
      return value.replace(/^\/+/, "");
    }

    /* ---------- password sign-in ---------- */
    $("pwForm").addEventListener("submit", function (event) {
      event.preventDefault();
      var email = $("email").value.trim();
      var password = $("password").value;
      if (!email || !password) { say("Enter your email and password.", "bad"); return; }

      var button = $("submit");
      button.disabled = true; button.textContent = "Signing in…";
      say("");

      window.MCC_AUTH.signInPassword(email, password).then(function () {
        say("Signed in. Taking you through…", "ok");
        setTimeout(function () { location.assign(safeNext(next)); }, 300);
      }).catch(function () {
        button.disabled = false; button.textContent = "Sign in";
        // One message for a wrong password and an address with no account:
        // telling them apart is how an outsider finds out which address is
        // worth attacking.
        say("Email or password is incorrect.", "bad");
      });
    });

    /* ---------- recovery ---------- */
    $("forgot").addEventListener("click", function () {
      var email = $("email").value.trim();
      if (!email) { say("Enter your email first, then ask for a reset link.", "bad"); return; }

      var button = $("forgot");
      button.disabled = true;
      var redirect = location.origin + location.pathname;

      window.MCC_AUTH.recoverPassword(email, redirect).then(function () {
        button.textContent = "Reset link sent";
        // Deliberately the same sentence whether or not that address has an
        // account. See recoverPassword in js/backend.js.
        say("If that address has an account, a reset link is on its way. The link opens this page.", "ok");
      });
    });

    /* ---------- recovery landing ---------- */
    if (window.__MCC_RECOVERY) {
      $("signin").hidden = true;
      $("reset").hidden = false;
      say("");
    }

    $("resetForm").addEventListener("submit", function (event) {
      event.preventDefault();
      var password = $("newPassword").value;
      var confirm = $("confirmPassword").value;

      if (password.length < 10) { say("Use at least 10 characters.", "bad"); return; }
      if (password !== confirm) { say("Those two passwords are not the same.", "bad"); return; }

      var button = $("resetSubmit");
      button.disabled = true; button.textContent = "Saving…";
      say("");

      window.MCC_AUTH.setPassword(password).then(function () {
        say("Password saved. Taking you through…", "ok");
        setTimeout(function () { location.assign(safeNext(next)); }, 400);
      }).catch(function (error) {
        button.disabled = false; button.textContent = "Save password";
        say(String(error && error.message ? error.message : error), "bad");
      });
    });

    /* ---------- google ---------- */
    (async function () {
      var authOrigin = params.get("auth") || "https://auth.mccluster.org";
      var button = $("googleButton");
      try {
        var cfg = await fetch(authOrigin + "/v1/auth/config", { credentials: "include" })
          .then(function (r) { if (!r.ok) throw new Error("Google sign-in is unavailable"); return r.json(); });
        if (!cfg.googleClientId) throw new Error("Google sign-in is not configured");
        while (!window.google || !window.google.accounts || !window.google.accounts.id) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        google.accounts.id.initialize({
          client_id: cfg.googleClientId,
          callback: async function (response) {
            say("Signing you in…");
            try {
              var r = await fetch(authOrigin + "/v1/auth/google", {
                method: "POST", credentials: "include",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ credential: response.credential }),
              });
              var out = await r.json();
              if (!r.ok) throw new Error(out.error || "Sign-in failed");
              say("Signed in. Taking you through…", "ok");
              setTimeout(function () { location.assign(safeNext(next)); }, 300);
            } catch (e) { say(e.message, "bad"); }
          },
        });
        google.accounts.id.renderButton(button, {
          theme: "filled_black", size: "large", shape: "pill", text: "continue_with", width: 320,
        });
      } catch (e) {
        // Google being down must not take the password form with it.
        button.remove();
        document.querySelector(".rule").remove();
      }
    })();
  })();
  </script>
  <script src="js/tabbar.js?v=__STAMP__"></script>
  <script defer src="js/pip.js?v=__STAMP__"></script>
</body>
</html>
