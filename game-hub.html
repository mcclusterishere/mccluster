<!doctype html>
<html lang="en" data-theme="dark">
<head><script src="js/shell-boot.js?v=578e683088fd"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Hub · Course mini games</title>
  <meta name="description" content="The house owner's Game Hub.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0e12">
  <meta name="color-scheme" content="dark">
  <!-- the shared bottom bar's styles (every page carrying js/tabbar.js links it); the hub's own sheet follows and wins -->
  <link rel="stylesheet" href="css/style.css?v=578e683088fd">
  <link rel="stylesheet" href="css/game-hub.css?v=578e683088fd">
</head>
<body class="gh-body">
  <!-- Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the hub, its
       course list and every game load only after that yes (owner, 2026-11-03: "keep it on my private account"). -->
  <section class="owner-gate gh-gate" aria-live="polite" data-owner-gate data-owner-template="ghTpl" data-owner-load="js/game-hub/hub.mjs?v=578e683088fd">
    <h1>Owner only</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="ghTpl">
  <a class="gh-skip" href="#ghMain">Skip to the games</a>
  <main class="gh" id="ghMain" tabindex="-1">
    <header class="gh-top">
      <small>Matthew McCluster · Courses</small>
      <h1>Game Hub</h1>
      <p>All your training games, arcade levels and playable worlds in one place. Open Games in the floating controls to choose a course.</p>
      <nav class="gh-worlds" aria-label="Games and story worlds"><a class="gh-city-link" href="action-globe.html?explore=1&amp;games=1">World Games ↗</a><a class="gh-city-link" href="city-arcade.html">City Arcade ↗</a><a class="gh-city-link" href="fictional-city.html">Explore McCluster City ↗</a></nav>
    </header>
    <section class="gh-panel" id="ghPanel" aria-live="polite"><p class="gh-loading" role="status">Loading courses…</p></section>
    <section class="gh-play" id="ghPlay" hidden aria-label="Game"></section>
  </main>

  <div class="gh-dock" id="ghCapsule" role="region" aria-label="Game and music controls">
    <div class="gh-capsule-row">
    <button type="button" class="gh-capsule-button gh-capsule-drag" data-capsule-drag aria-label="Move controls. Use arrow keys; Home resets position." title="Drag to move; arrow keys also move">⠿</button>
    <div class="gh-music" id="ghMusic" aria-label="Course music" role="region">
      <button type="button" class="gh-music__btn" data-hub-music-play disabled aria-pressed="false" aria-label="Play music" data-state="paused">
        <svg class="gh-i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="gh-i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="gh-music__meta">
        <b data-music-title>—</b>
        <small data-music-role></small>
      </div>
      <button type="button" class="gh-music__btn" data-music-next disabled aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l9-7zM16 5h3v14h-3z"/></svg>
      </button>
      <span class="gh-music__progress" aria-hidden="true"><i data-music-progress></i></span>
    </div>
    <button type="button" class="gh-capsule-button" data-capsule-toggle aria-expanded="false" aria-controls="ghCapsulePanel">Games</button>
    </div>
    <div id="ghCapsulePanel" data-capsule-panel hidden>
      <nav class="gh-modules" id="ghModules" aria-label="Courses"></nav>
      <button type="button" class="gh-capsule-button" data-course-soundtrack disabled>Play course soundtrack</button>
      <p class="gh-capsule-status" data-music-status role="status"></p>
      <div class="gh-capsule-position" role="group" aria-label="Move controls">
        <button type="button" data-capsule-move="-24,0" aria-label="Move left">←</button>
        <button type="button" data-capsule-move="0,-24" aria-label="Move up">↑</button>
        <button type="button" data-capsule-move="0,24" aria-label="Move down">↓</button>
        <button type="button" data-capsule-move="24,0" aria-label="Move right">→</button>
        <button type="button" data-capsule-move="reset">Reset</button>
      </div>
    </div>
  </div>
  </template>

  <script type="module" src="js/owner-only.mjs?v=578e683088fd"></script>
  <script src="js/tabbar.js?v=578e683088fd"></script>
</body>
</html>
