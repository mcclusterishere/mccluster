<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equity Uprise — Floor 1 Deterministic 3D</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#161719;touch-action:none}
#hud{position:fixed;z-index:10;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));max-width:min(470px,calc(100vw - 24px));padding:13px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(10,10,10,.82);backdrop-filter:blur(10px)}
h1{font-size:14px;letter-spacing:.04em;margin:0 0 5px}
p{font-size:11px;line-height:1.4;color:#ccc;margin:0 0 10px}
.controls{display:flex;gap:6px;flex-wrap:wrap}
button{border:1px solid #555;border-radius:999px;padding:7px 10px;background:#252525;color:#fff;font-size:11px;font-weight:700}
button:active{background:#851a1d}
#info{position:fixed;z-index:10;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));padding:8px 10px;border-radius:10px;background:rgba(10,10,10,.8);border:1px solid rgba(255,255,255,.14);font-size:10px;color:#ddd}
#boot{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 16px;border-radius:12px;background:#111;border:1px solid #555;font-size:12px;text-align:center;max-width:calc(100vw - 30px)}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
<h1>EQUITY UPRISE · FLOOR 1 · DETERMINISTIC 3D</h1>
<p>Self-contained viewer — no external 3D library. Drag to orbit. Pinch to zoom. The two stairs are locked in the rear/north band.</p>
<div class="controls">
<button data-view="lobby">Lobby</button>
<button data-view="reception">Reception</button>
<button data-view="elevator">Elevator</button>
<button data-view="lounge">Lounge</button>
<button data-view="intake">Intake</button>
<button id="ceilBtn">Hide ceiling</button>
<button id="wireBtn">Wireframe</button>
</div>
</div>
<div id="info">NORTH ↑ · exact 72' × 72' plan</div>
<div id="boot">Starting self-contained 3D viewer…</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d",{alpha:false});
const boot=document.getElementById("boot");
if(!ctx){boot.textContent="This browser did not provide a 2D canvas.";return;}

const objects=[];
const C={
 floor:"#56595b", wall:"#2b2a29", core:"#303338", stone:"#343536",
 glass:"rgba(155,200,215,.38)", wood:"#6c523c", seat:"#474544",
 service:"#494a4a", red:"#851a1d", ceiling:"#242424"
};
function box(name,x1,y1,x2,y2,h,color,z0=0){
 objects.push({name,x1,y1,x2,y2,z0,z1:z0+h,color});
}
function wallH(name,x1,x2,y,t,h,gaps=[],color=C.wall){
 let cur=x1,i=0; const gs=gaps.slice().sort((a,b)=>a[0]-b[0]); gs.push([x2,x2]);
 for(const g of gs){if(g[0]>cur)box(name+"_"+(++i),cur,y-t/2,g[0],y+t/2,h,color);cur=Math.max(cur,g[1]);}
}
function wallV(name,x,y1,y2,t,h,gaps=[],color=C.wall){
 let cur=y1,i=0; const gs=gaps.slice().sort((a,b)=>a[0]-b[0]); gs.push([y2,y2]);
 for(const g of gs){if(g[0]>cur)box(name+"_"+(++i),x-t/2,cur,x+t/2,g[0],h,color);cur=Math.max(cur,g[1]);}
}
const H=11,EXT=.75,INT=.5,CORE=.75;

// Canonical 72 x 72 shell
box("floor",0,0,72,72,.5,C.floor,-.5);
box("ceiling",0,0,72,72,.35,C.ceiling,H);
box("south_left",0,0,29,EXT,H,C.wall);
box("south_right",43,0,72,EXT,H,C.wall);
box("north",0,72-EXT,72,72,H,C.wall);
box("west",0,0,EXT,72,H,C.wall);
box("east",72-EXT,0,72,72,H,C.wall);

// Vestibule / entrance
wallV("vest_w",29,0,9,.25,H,[],C.glass);
wallV("vest_e",43,0,9,.25,H,[],C.glass);
wallH("vest_inner",29,43,9,.25,H,[[32,40]],C.glass);
wallH("entry_left",29,32,.35,.2,H,[],C.glass);
wallH("entry_right",40,43,.35,.2,H,[],C.glass);

// Intake
wallH("intake_s",2,16,32,INT,H,[],C.wall);
wallH("intake_n",2,16,44,INT,H,[],C.wall);
wallV("intake_e",16,32,44,.25,H,[[33.5,37]],C.glass);

// Reception
wallH("reception_wall",28,44,52.5,.75,12,[],C.stone);
box("reception_desk",30,44,42,47,3.5,C.stone);
box("reception_accessible",30,44,33,47,2.85,C.stone);
box("reception_red",30,43.92,42,44.08,.22,C.red,.12);

// North support band
wallH("support_south",12,60,60,INT,H,[[14.5,17.5],[22.5,25.5],[31,34],[43,46],[51,53.5]],C.wall);
[
 [11.75,54,72,"stair_b_east"],[20,60,70,"restroom_1"],[28,60,72,"restroom_2"],
 [40,60,72,"support"],[50,60,72,"it"],[54,60,66,"janitor"],[60.25,54,72,"stair_a_west"]
].forEach(v=>wallV(v[3],v[0],v[1],v[2],INT,H,[],C.wall));

// rear stairs: exact locked envelopes B X0-12 / Y54-72; A X60-72 / Y54-72
wallH("stair_b_south",0,12,54+CORE/2,CORE,H,[[7.5,10.5]],C.core);
wallH("stair_a_south",60,72,54+CORE/2,CORE,H,[[61.5,64.5]],C.core);
function stairs(prefix,x1,y1,x2,y2){
 const count=9,run=(y2-y1-3)/count,rise=10.5;
 for(let i=0;i<count;i++){const ya=y1+1.5+i*run;box(prefix+"_"+i,x1+1.3,ya,x2-1.3,ya+run*.82,.45,C.service,i*(rise/count));}
}
stairs("stair_b",0,54,12,72);
stairs("stair_a",60,54,72,72);

// Elevator exact X54-62 / Y34-44
wallH("elev_s",54,62,34,CORE,H,[],C.core);
wallH("elev_n",54,62,44,CORE,H,[],C.core);
wallV("elev_e",62,34,44,CORE,H,[],C.core);
wallV("elev_w",54,34,44,CORE,H,[[37,41]],C.core);
box("elev_door_1",53.88,37,54.02,39,8,C.core);
box("elev_door_2",53.88,39,54.02,41,8,C.core);
box("mep",50,66,60,72,H,C.service);

// Furniture / directory
box("directory",49,24,51,29,6,C.core);
box("sofa",3,14,10,17,2.8,C.seat);
box("chair1",12,14,15,17,2.8,C.seat);
box("chair2",12,22,15,25,2.8,C.seat);
box("lounge_table",7.5,18,11.5,22,1.4,C.wood);
box("intake_table",6,36.5,12,39.5,2.5,C.wood);
[[4.2,37.1,5.8,38.9],[12.2,37.1,13.8,38.9],[7.1,34.2,8.9,35.8],[9.1,40.2,10.9,41.8]]
 .forEach((b,i)=>box("intake_chair_"+i,b[0],b[1],b[2],b[3],2.7,C.seat));

let showCeiling=true,wire=false;
let yaw=-.72,pitch=.42,dist=44;
let target={x:36,y:34,z:4.3};
const views={
 lobby:{yaw:-.72,pitch:.42,dist:44,t:[36,34,4.3]},
 reception:{yaw:0,pitch:.2,dist:25,t:[36,48,4]},
 elevator:{yaw:-1.0,pitch:.28,dist:23,t:[57,39,4]},
 lounge:{yaw:.85,pitch:.32,dist:24,t:[10,20,3.5]},
 intake:{yaw:.88,pitch:.28,dist:19,t:[9,38,3.8]}
};
function go(k){const v=views[k];yaw=v.yaw;pitch=v.pitch;dist=v.dist;target={x:v.t[0],y:v.t[1],z:v.t[2]};render();}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById("ceilBtn").onclick=e=>{showCeiling=!showCeiling;e.target.textContent=showCeiling?"Hide ceiling":"Show ceiling";render();};
document.getElementById("wireBtn").onclick=e=>{wire=!wire;e.target.textContent=wire?"Solid":"Wireframe";render();};

// software 3D renderer
function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0); render();
}
function vsub(a,b){return{x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
function cross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}}
function norm(a){const n=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/n,y:a.y/n,z:a.z/n}}
function cam(){
 const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw);
 const pos={x:target.x+dist*cp*sy,y:target.y-dist*cp*cy,z:target.z+dist*sp};
 const f=norm(vsub(target,pos)); let r=norm(cross(f,{x:0,y:0,z:1})); if(Math.hypot(r.x,r.y,r.z)<.1)r={x:1,y:0,z:0}; const u=norm(cross(r,f));
 return{pos,f,r,u};
}
function project(p,c){
 const q=vsub(p,c.pos),zx=dot(q,c.r),zy=dot(q,c.u),zz=dot(q,c.f);
 if(zz<=.2)return null;
 const f=0.5*Math.min(innerWidth,innerHeight)/Math.tan(58*Math.PI/360);
 return{x:innerWidth/2+zx*f/zz,y:innerHeight/2-zy*f/zz,z:zz};
}
const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
function verts(o){
 return[
  {x:o.x1,y:o.y1,z:o.z0},{x:o.x2,y:o.y1,z:o.z0},{x:o.x2,y:o.y2,z:o.z0},{x:o.x1,y:o.y2,z:o.z0},
  {x:o.x1,y:o.y1,z:o.z1},{x:o.x2,y:o.y1,z:o.z1},{x:o.x2,y:o.y2,z:o.z1},{x:o.x1,y:o.y2,z:o.z1}
 ];
}
function shade(color,factor){
 if(color.startsWith("rgba"))return color;
 const n=parseInt(color.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 return "rgb("+Math.round(r*factor)+","+Math.round(g*factor)+","+Math.round(b*factor)+")";
}
function render(){
 ctx.fillStyle="#17191c";ctx.fillRect(0,0,innerWidth,innerHeight);
 const c=cam(),polys=[];
 for(const o of objects){
  if(o.name==="ceiling"&&!showCeiling)continue;
  const vv=verts(o),pv=vv.map(p=>project(p,c));
  faces.forEach((fi,j)=>{
   const pts=fi.map(i=>pv[i]); if(pts.some(p=>!p))return;
   const a=vv[fi[0]],b=vv[fi[1]],d=vv[fi[2]];
   const n=norm(cross(vsub(b,a),vsub(d,a)));
   const center={x:(a.x+b.x+d.x)/3,y:(a.y+b.y+d.y)/3,z:(a.z+b.z+d.z)/3};
   if(dot(n,vsub(c.pos,center))<=0)return;
   const depth=pts.reduce((s,p)=>s+p.z,0)/pts.length;
   const light=.48+.45*Math.max(0,dot(n,norm({x:-.4,y:-.6,z:.7})));
   polys.push({pts,depth,color:shade(o.color,light),name:o.name});
  });
 }
 polys.sort((a,b)=>b.depth-a.depth);
 for(const p of polys){
  ctx.beginPath();ctx.moveTo(p.pts[0].x,p.pts[0].y);for(let i=1;i<p.pts.length;i++)ctx.lineTo(p.pts[i].x,p.pts[i].y);ctx.closePath();
  if(!wire){ctx.fillStyle=p.color;ctx.fill();}
  ctx.strokeStyle=wire?"rgba(255,255,255,.7)":"rgba(0,0,0,.28)";ctx.lineWidth=wire?1:.6;ctx.stroke();
 }
 // north marker on floor-space
 const p1=project({x:36,y:65,z:.1},c),p2=project({x:36,y:70,z:.1},c);
 if(p1&&p2){ctx.strokeStyle="#ff5158";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.fillStyle="#ff7378";ctx.font="bold 12px system-ui";ctx.fillText("N",p2.x+5,p2.y);}
 boot.style.display="none";
}

// drag + pinch
let active=new Map(),lastPinch=null;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});});
canvas.addEventListener("pointermove",e=>{
 if(!active.has(e.pointerId))return;
 const old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const pts=[...active.values()];
 if(pts.length===1){yaw-=(e.clientX-old.x)*.008;pitch=Math.max(-.05,Math.min(1.35,pitch+(e.clientY-old.y)*.006));}
 else if(pts.length>=2){const q=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastPinch!==null)dist*=lastPinch/q;lastPinch=q;dist=Math.max(6,Math.min(95,dist));}
 render();
});
function up(e){active.delete(e.pointerId);lastPinch=null}
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
canvas.addEventListener("wheel",e=>{e.preventDefault();dist*=Math.exp(e.deltaY*.001);dist=Math.max(6,Math.min(95,dist));render();},{passive:false});

window.addEventListener("resize",resize);
window.addEventListener("error",e=>{boot.style.display="block";boot.textContent="Viewer error: "+(e.message||"unknown");});
resize();go("lobby");
})();
</script>
</body>
</html>
