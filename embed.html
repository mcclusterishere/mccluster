<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>McCluster Sound</title>
  <!-- THE SYNDICATE PLAYER: this file is built to live inside other
       people's pages. Zero dependencies, no service worker, no
       analytics of theirs, no scripts of ours beyond what plays the
       record. Their site, our record, our credit. -->
  <meta name="theme-color" content="#0b0908">
  <style>
    @font-face { font-family: "Anton"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Manrope"; font-style: normal; font-weight: 700; font-display: swap;
      src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: transparent; font-family: "Manrope", system-ui, sans-serif; }
    .card { height: 100%; min-height: 108px; display: flex; align-items: center; gap: .85rem;
      background: linear-gradient(150deg, #171210, #0b0908 55%);
      border: 1px solid rgba(244,239,230,.14); border-radius: 18px;
      padding: .8rem .95rem; color: #f4efe6; overflow: hidden; position: relative; }
    .card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 12% 110%, rgba(229,56,59,.2), transparent 60%); }
    .art { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; flex: none;
      box-shadow: 0 10px 24px -12px rgba(0,0,0,.9); }
    .mid { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .k { font-size: .56rem; font-weight: 800; letter-spacing: .32em; text-transform: uppercase;
      color: rgba(244,239,230,.55); }
    .k a { color: inherit; text-decoration: none; }
    .k a:hover { color: #ff5a5c; }
    .t { font-family: "Anton", "Manrope", sans-serif; font-size: clamp(1.05rem, 5vw, 1.4rem);
      text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; margin: .18rem 0 .1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .by { font-size: .72rem; color: rgba(244,239,230,.65); }
    .seek { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 14px;
      background: transparent; border: 0; padding: 6px 0; cursor: pointer; margin-top: .35rem; }
    .seek i { display: block; height: 2px; background: rgba(244,239,230,.22); border-radius: 2px; }
    .seek b { display: block; height: 100%; width: 0; background: #e5383b; border-radius: 2px; }
    .time { font-size: .6rem; font-variant-numeric: tabular-nums; color: rgba(244,239,230,.5); }
    .play { -webkit-appearance: none; appearance: none; flex: none; width: 52px; height: 52px;
      border: 0; border-radius: 50%; cursor: pointer; position: relative; z-index: 1;
      background: linear-gradient(165deg, #ff5a5c, #b3121b); color: #fff;
      display: grid; place-items: center; box-shadow: 0 12px 26px -10px rgba(229,56,59,.7); }
    .play:active { transform: translateY(1px); }
    .play svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body data-no-appbar>
  <div class="card" id="card">
    <img class="art" id="art" src="assets/img/here-cover.jpg" alt="">
    <div class="mid">
      <p class="k"><a id="out" href="album.html" target="_blank" rel="noopener">McCluster Sound <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="vertical-align:-2px;display:inline-block"><path d="M7 17L17 7M9.5 7H17v7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></p>
      <h1 class="t" id="title">·</h1>
      <p class="by">Matthew McCluster <span class="time" id="time"></span></p>
      <button class="seek" id="seek" type="button" aria-label="Seek"><i><b id="fill"></b></i></button>
    </div>
    <button class="play" id="play" type="button" aria-label="Play or pause">
      <svg id="ic" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
    </button>
    <audio id="deck" preload="metadata"></audio>
  </div>
  <script>
  (function () {
    "use strict";
    var Q = new URLSearchParams(location.search);
    var ALBUM = (Q.get("album") || "here").toLowerCase();
    var T = Math.max(0, parseInt(Q.get("t") || "0", 10) || 0);
    var deck = document.getElementById("deck");
    var $ = function (id) { return document.getElementById(id); };
    function fmt(s) { s = Math.max(0, s | 0); return (s / 60 | 0) + ":" + ("0" + s % 60).slice(-2); }

    fetch("data/albums.json").then(function (r) { return r.json(); }).then(function (d) {
      var alb = null;
      (d.albums || []).forEach(function (a) { if (a.slug === ALBUM) alb = a; });
      if (!alb) alb = d.albums[0];
      var t = alb.tracks[Math.min(T, alb.tracks.length - 1)];
      $("title").textContent = t.title;
      $("art").src = t.art || alb.art;
      $("art").alt = alb.name;
      $("out").href = "album.html?album=" + encodeURIComponent(alb.slug);
      deck.src = t.src;
      document.title = t.title + " — Matthew McCluster";
    }).catch(function () { $("title").textContent = "McCluster Sound"; });

    $("play").addEventListener("click", function () {
      if (deck.paused) deck.play().catch(function () {}); else deck.pause();
    });
    function paint() {
      $("ic").innerHTML = deck.paused ? '<path d="M8 5l11 7-11 7z"/>'
        : '<path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/>';
      $("fill").style.width = deck.duration ? (deck.currentTime / deck.duration * 100) + "%" : "0";
      $("time").textContent = deck.duration
        ? " · " + fmt(deck.currentTime) + " / " + fmt(deck.duration) : "";
    }
    ["play", "pause", "timeupdate", "loadedmetadata", "ended"].forEach(function (ev) {
      deck.addEventListener(ev, paint);
    });
    $("seek").addEventListener("click", function (e) {
      if (!deck.duration) return;
      var r = this.getBoundingClientRect();
      deck.currentTime = ((e.clientX - r.left) / r.width) * deck.duration;
    });
  })();
  </script>
</body>
</html>
