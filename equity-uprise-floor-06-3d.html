<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store"><meta name="equity-uprise-build" content="__STAMP__">
<title>Equity Uprise — Floor 6 Penthouse Command</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:4;left:14px;top:14px;max-width:min(720px,calc(100vw - 28px));padding:13px;border:1px solid #444;border-radius:14px;background:#111d;backdrop-filter:blur(10px)}
.hud h1{font-size:14px;margin:0 0 4px}.hud p{font-size:11px;color:#ccc;margin:0 0 9px}.c{display:flex;flex-wrap:wrap;gap:6px}
button{border:1px solid #555;border-radius:999px;background:#252525;color:#fff;padding:7px 10px;font:700 11px system-ui}
.s{position:fixed;right:14px;bottom:14px;background:#111d;border:1px solid #444;border-radius:10px;padding:8px 10px;font-size:10px}
</style>  <script src="js/live-content.js?v=__STAMP__"></script>
</head><body>
<div id="app"></div>
<div class="hud"><h1>EQUITY UPRISE · FLOOR 6 · PENTHOUSE COMMAND</h1>
<p>Institutional overview, restrained Halo spatial intelligence, private strategy/partner briefing, and physical transition to Level 7. Drag to orbit; pinch/scroll to zoom.</p>
<div class="c">
<button data-v="command">Command Table</button>
<button data-v="wall">NOW / PAST / JOIN</button>
<button data-v="halo">Halo Globe</button>
<button data-v="salon">Institutional Salon</button>
<button data-v="strategy">Strategy Review</button>
<button data-v="briefing">Partner Briefing</button>
<button data-v="roof">Roof Transition</button>
<button data-v="elevator">Elevator</button>
<button id="frame">Full Floor</button>
<button id="ceil">Hide ceiling</button>
<button id="wire">Wireframe</button>
</div></div>
<div class="s" id="status">Loading Floor 6…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const FT=.3048,ft=v=>v*FT,app=document.getElementById('app'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111315);scene.fog=new THREE.Fog(0x111315,ft(50),ft(135));
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.02,ft(280));
const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.04;r.shadowMap.enabled=true;app.appendChild(r.domElement);
const ctl=new OrbitControls(camera,r.domElement);ctl.enableDamping=true;ctl.minDistance=ft(4);ctl.maxDistance=ft(125);ctl.maxPolarAngle=Math.PI/2-.01;
scene.add(new THREE.HemisphereLight(0xf3eee5,0x151719,1.7));
const d=new THREE.DirectionalLight(0xfff2dd,2.2);d.position.set(ft(15),ft(30),ft(-8));scene.add(d);
const commandLight=new THREE.PointLight(0xffdfb4,56,ft(34),2);commandLight.position.set(ft(36),ft(8.6),ft(-41));scene.add(commandLight);
const salonLight=new THREE.PointLight(0xffd8ab,30,ft(24),2);salonLight.position.set(ft(10),ft(7.5),ft(-29));scene.add(salonLight);
const haloLight=new THREE.PointLight(0xb9d7e3,28,ft(18),2);haloLight.position.set(ft(55),ft(8.4),ft(-12));scene.add(haloLight);

let model,ceil=[],wire=false;
function frameLoadedModel(){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3(),center=new THREE.Vector3();
  box.getSize(size);box.getCenter(center);
  const span=Math.max(size.x,size.z);
  camera.position.set(center.x,Math.max(center.y+size.y*.8,ft(18)),center.z+span*.72);
  ctl.target.copy(center);camera.near=.02;camera.far=Math.max(ft(300),span*8);camera.updateProjectionMatrix();ctl.update();
  return {size,center};
}
new GLTFLoader().load('/equity-uprise-preview/equity-uprise-floor-06-core-v2.glb?v=__STAMP__',g=>{
  model=g.scene;model.rotation.x=-Math.PI/2;model.updateMatrixWorld(true);scene.add(model);
  let n=0;model.traverse(o=>{if(o.isMesh){n++;o.castShadow=o.receiveShadow=true;o.frustumCulled=false;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.side=THREE.DoubleSide;m.needsUpdate=true});if((o.name||'').toLowerCase().includes('ceiling'))ceil.push(o)}});
  const f=frameLoadedModel();status.textContent=n+' meshes · 74 inventory records · '+(f.size.x/FT).toFixed(1)+"' × "+(f.size.z/FT).toFixed(1)+"'";
},undefined,e=>{console.error(e);status.textContent='Model load failed: '+(e?.message||e)});

const V={
 command:{p:[36,6.5,22],t:[36,4.0,41]},
 wall:{p:[36,5.8,35],t:[36,4.8,52]},
 halo:{p:[66,6.6,20.5],t:[55,8.0,12]},
 salon:{p:[25,5.8,29],t:[10,3.8,29]},
 strategy:{p:[9,5.4,23],t:[8,3.5,10]},
 briefing:{p:[24,5.4,23],t:[24.5,3.5,10]},
 roof:{p:[44,5.8,29],t:[55,5.0,56]},
 elevator:{p:[45,5.8,31],t:[56,4.3,39]}
};
function go(k){const v=V[k];camera.position.set(ft(v.p[0]),ft(v.p[1]),ft(-v.p[2]));ctl.target.set(ft(v.t[0]),ft(v.t[1]),ft(-v.t[2]));ctl.update()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.getElementById('frame').onclick=()=>{if(model)frameLoadedModel()};
document.getElementById('ceil').onclick=e=>{const hide=e.target.textContent.startsWith('Hide');ceil.forEach(x=>x.visible=!hide);e.target.textContent=hide?'Show ceiling':'Hide ceiling'};
document.getElementById('wire').onclick=e=>{wire=!wire;model?.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if('wireframe'in m){m.wireframe=wire;m.needsUpdate=true}})}});e.target.textContent=wire?'Solid':'Wireframe'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{ctl.update();r.render(scene,camera)});
</script>  <script src="js/site-editor.js?v=__STAMP__" defer></script>
</body></html>
