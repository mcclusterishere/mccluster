<!doctype html>
<html lang="en" data-theme="dark" class="hu-social-only">
<head><script src="js/shell-boot.js?v=__STAMP__"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The house owner's City Arcade: quick games from the storefronts of McCluster City.">
  <meta name="theme-color" content="#0b1017">
  <title>City Arcade · McCluster City</title>
  <link rel="stylesheet" href="css/style.css?v=__STAMP__">
  <link rel="stylesheet" href="css/city-arcade.css?v=__STAMP__">
</head>
<body>
  <!-- Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the arcade and
       its games load only after that yes (owner, 2026-11-03: private like the rest of the games until playtested). -->
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="arcadeTpl" data-owner-load="js/city-arcade/app.mjs?v=__STAMP__">
    <h1>City Arcade</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="arcadeTpl">
  <a class="skip" href="#arcade-play">Skip to game</a>
  <main class="arcade-shell">
    <header class="arcade-head">
      <div class="eyebrow">MCCLUSTER CITY / ARCADE</div>
      <h1>Your city.<br><em>Your arcade.</em></h1>
      <p>Explore Bridgeport on the globe, then play a storefront game.</p>
      <nav aria-label="Related destinations">
        <a href="fictional-city.html">Enter 3D City</a>
        <a href="game-hub.html">Course Game Hub</a>
      </nav>
    </header>
    <section class="arcade-map" aria-label="Game region globe">
      <iframe id="arcade-globe" title="Bridgeport on the World globe" src="action-globe.html?embedded=1&amp;missions=0&amp;surface=network&amp;arcade=1" loading="lazy"></iframe>
      <p id="arcade-map-status" role="status">Loading the globe. You can play the games below while it loads.</p>
      <div class="actions"><button class="action" id="arcade-bridgeport">Locate Bridgeport</button><button class="action" id="arcade-pick-location">Pick a game entrance on globe</button><a class="action" href="fictional-city.html?entry=bridgeport">Walk the Bridgeport story</a></div>
      <label>Globe height <input id="arcade-map-size" type="range" min="40" max="60" value="45" aria-label="Globe height as percent of screen"></label>
      <p class="hint">Sole Run follows the shared Bridgeport streets. Tea Rush uses an authored interior; entrance markers do not claim real shop tenancy.</p>
    </section>
    <p id="arcade-load-status" role="status">Markers only. Enter a block to load city geometry.</p><details class="tea-tuning" id="arcade-loading-controls"><summary>Region loading settings · this device</summary></details>
    <section id="arcade-location" class="arcade-catalog"></section>
    <div class="arcade-layout">
      <section class="arcade-catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Games on the block</h2>
        <p class="hint">Two games are playable now. Every other shop has its own game on the way.</p>
        <div id="arcade-list" class="game-list" aria-label="Available game list">
          <p role="status">Loading the arcade…</p>
        </div>
      </section>
      <section class="arcade-play" id="arcade-play" aria-labelledby="play-title">
        <h2 id="play-title">Select a game</h2>
        <p>The world is bigger than any single storefront.</p>
      </section>
    </div>
    <footer>
      <p>Arcade scores are saved on this device and stay separate from your city save, credits and story progress.</p>
    </footer>
  </main>
  </template>
  <script type="module" src="js/owner-only.mjs?v=__STAMP__"></script>
  <script src="js/mcc-auth.js?v=__STAMP__"></script>
  <script src="js/tabbar.js?v=__STAMP__"></script>
</body>
</html>
