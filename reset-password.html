<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password · McCluster</title>
  <link rel="icon" type="image/png" href="assets/img/m-mark.png">
  <link rel="stylesheet" href="css/style.css?v=b645d127bb8f">
  <script src="js/theme.js?v=b645d127bb8f"></script>
  <style>
    html,body{background:var(--ink)}
    .rp{max-width:27rem;margin:0 auto;padding:clamp(4.8rem,10vh,7rem) clamp(1.1rem,4vw,2rem) 9rem}
    .rp__k{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ruby-text);font-weight:800}
    .rp h1{font-family:var(--sig);text-transform:uppercase;line-height:.94;font-size:clamp(2.35rem,10vw,3.45rem);margin:.45rem 0 0}
    .rp__sub{color:var(--cream-dim);line-height:1.65;margin:.9rem 0 0}
    .rp__card{border:1px solid var(--edge);border-radius:16px;background:var(--glass-hi);padding:1.15rem;margin-top:1.45rem}
    .rp__lab{display:block;margin-top:.85rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ruby-text);font-weight:800}
    .rp__lab:first-child{margin-top:0}
    .rp__in{width:100%;margin-top:.5rem;padding:.9rem 1rem;border:0;border-radius:13px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--edge);color:var(--cream);font:1rem var(--body);box-sizing:border-box}
    .rp__in:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ruby-hot)}
    .rp__btn{display:block;width:100%;margin-top:1rem;padding:1rem;border:0;border-radius:13px;background:var(--ruby-hot);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
    .rp__btn:disabled{opacity:.55;cursor:default}
    .rp__note{min-height:1.2rem;margin:.75rem 0 0;color:var(--cream-dim);font-size:.8rem;line-height:1.45}
    .rp__note.is-error{color:#ff8e8e}.rp__note.is-ok{color:#9fdaa9}
    .rp__link{display:inline-block;margin-top:1rem;color:var(--cream-dim);font-size:.82rem}
    [hidden]{display:none!important}
  </style>
  <script src="js/live-content.js?v=b645d127bb8f"></script>
</head>
<body class="songpage">
  <main class="rp">
    <p class="rp__k">M Account</p>
    <h1>Reset<br>Password</h1>
    <p class="rp__sub">Choose a new password for your McCluster account.</p>

    <section class="rp__card" id="rpCard">
      <label class="rp__lab" for="rpPass">New password</label>
      <input class="rp__in" id="rpPass" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <label class="rp__lab" for="rpPass2">Confirm password</label>
      <input class="rp__in" id="rpPass2" type="password" autocomplete="new-password" minlength="8" placeholder="Type it again">
      <button class="rp__btn" id="rpGo" type="button">Update password</button>
      <p class="rp__note" id="rpNote" role="status"></p>
      <a class="rp__link" href="account.html">Back to sign in</a>
    </section>
  </main>

  <script src="js/mcc-auth.js?v=b645d127bb8f"></script>
  <script src="js/tabbar.js?v=b645d127bb8f"></script>
  <script>
  (function(){
    "use strict";
    var $=function(id){return document.getElementById(id);};
    function note(text,kind){
      var n=$("rpNote"); n.textContent=text||""; n.className="rp__note"+(kind?" is-"+kind:"");
    }
    function ready(){
      return window.MCC.acceptRecoveryFromUrl().then(function(session){
        return session || window.MCC.session();
      }).then(function(session){
        if(session&&session.access_token){ note("Reset link verified."); return true; }
        note("This reset link is invalid or expired. Request a new one from the sign-in page.","error");
        $("rpGo").disabled=true;
        return false;
      }).catch(function(e){
        note(e.message||"This reset link is invalid or expired.","error");
        $("rpGo").disabled=true;
        return false;
      });
    }
    $("rpGo").onclick=function(){
      var p=$("rpPass").value,p2=$("rpPass2").value,b=$("rpGo");
      if(p.length<8){note("Use at least 8 characters.","error");return;}
      if(p!==p2){note("Those passwords do not match.","error");return;}
      b.disabled=true;b.textContent="Updating…";note("");
      window.MCC.updatePassword(p).then(function(){
        /* This page is reached from every sign-in surface, not just Mnet, so
           it lands on the M Account home rather than dropping somebody into a
           product they were not trying to open. */
        note("Password updated. Use it to sign in from now on.","ok");
        b.textContent="Continue to your account";
        b.disabled=false;
        b.onclick=function(){location.href="account.html";};
      }).catch(function(e){
        note(e.message||"Could not update your password.","error");
        b.disabled=false;b.textContent="Update password";
      });
    };
    $("rpPass2").addEventListener("keydown",function(e){if(e.key==="Enter")$("rpGo").click();});
    ready();
  })();
  </script>
  <script src="js/site-editor.js?v=b645d127bb8f" defer></script>
</body>
</html>
