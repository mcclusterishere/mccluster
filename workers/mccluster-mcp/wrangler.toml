name = "mccluster-mcp"
main = "src/entry.js"
compatibility_date = "2026-09-02"
workers_dev = false
preview_urls = false
routes = [{ pattern = "mcp.mccluster.org", custom_domain = true }]

[vars]
CORE_BROKER_URL = "https://core.mccluster.org"
CORE_MCP_RESOURCE_METADATA = "https://mcp.mccluster.org/.well-known/oauth-protected-resource"
ALLOWED_ORIGINS = "https://matthew.mccluster.org,https://mccluster.org"

# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CORE_BROKER_TOKEN and
# CORE_EDGE_SIGNING_KEY are provisioned as secrets before activation.

[observability]
enabled = true

[triggers]
crons = []
