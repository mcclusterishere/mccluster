name = "mccluster"
main = "src/entry.js"
compatibility_date = "2026-09-02"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
# Client satellite origins are listed here because /v1/inquiries is called
# from the client's own site, not from a McCluster page. Esmer's canonical
# hostname is still unconfirmed (docs/control-plane/CLIENT-PAYMENTS.md); both
# forms are listed so the Book tab works whichever is chosen, and an unused
# allowed origin costs nothing.
ALLOWED_ORIGINS = "https://matthew.mccluster.org,https://mccluster.org,https://esmer.mccluster.org,https://www.esmermusic.com,https://esmermusic.com,http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8099,http://127.0.0.1:8099"
MCCLUSTER_SUPABASE_PROJECT_REF = "zmnhbrjyhxzhkxmhkexs"
PUBLIC_ORIGIN = "https://matthew.mccluster.org"
APEX_ORIGIN = "https://mccluster.org"
ALLOW_DEMO_IDENTITIES = "false"
PUBLIC_APP_URL = "https://matthew.mccluster.org"
META_GRAPH_API_VERSION = "v26.0"

# Secrets required in production (set with wrangler secret put, never commit values):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# FAL_KEY
# FAL_ADMIN_KEY  # Admin-scoped fal key required for exact billing-event reconciliation.
# META_APP_SECRET
# META_WEBHOOK_VERIFY_TOKEN
# Instagram access tokens are also Worker secrets. social_accounts.credential_ref
# stores only the binding name (for example SOCIAL_IG_PRIMARY_ACCESS_TOKEN), never the token itself.

# Batch unsettled fal jobs, attach completed social variants, process due Instagram
# publish jobs, and refresh recent Instagram insights every five minutes.
[triggers]
crons = ["*/5 * * * *"]

# Existing production Durable Objects on this Worker. Keep the class name.
# Do not add a new_classes / deleted_classes migration here.
[[durable_objects.bindings]]
name = "HereTenantAgent"
class_name = "HereTenantAgent"

[exports.HereTenantAgent]
type = "durable-object"
storage = "sqlite"
