name = "mccluster"
main = "src/entry-platform.js"
compatibility_date = "2026-09-02"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false

[build]
command = 'cd "$(git rev-parse --show-toplevel)/workers/mccluster" && node ../../scripts/worker-build-provenance.mjs'

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
ALLOWED_ORIGINS = "https://matthew.mccluster.org,https://mccluster.org,https://humanuprise.com,https://www.humanuprise.com,https://esmer.mccluster.org,https://mcclusterishere.github.io,https://www.esmermusic.com,https://esmermusic.com,http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8099,http://127.0.0.1:8099"
MCCLUSTER_SUPABASE_PROJECT_REF = "zmnhbrjyhxzhkxmhkexs"
PUBLIC_ORIGIN = "https://matthew.mccluster.org"
APEX_ORIGIN = "https://mccluster.org"
ALLOW_DEMO_IDENTITIES = "false"
PUBLIC_APP_URL = "https://matthew.mccluster.org"
# The World's GDELT news ingest (src/world-news.js) on the five-minute cron. "true" only once
# supabase/pending/world_gdelt_gkg_news_v1.sql is applied in production; until then nothing is fetched.
WORLD_NEWS_INGEST_ENABLED = "false"
META_GRAPH_API_VERSION = "v26.0"
# `wrangler deploy` uploads THIS [vars] block, so the fail-closed console access flag must stay here instead of dashboard-only configuration.
SEEK_FIRST_ACCESS_REQUIRED = "false"
# Intel USGS evidence collector (src/intel/usgs-collector.js). Off by default so a deploy
# starts no writes; set to "true" only after supabase/pending/20261015210000_intel_mission_canon_v1.sql
# is applied. wrangler deploy uploads this block, so the switch lives here.
INTEL_USGS_COLLECTOR_ENABLED = "false"
# Identity verification levels: the Persona government-ID check stays OFF until the
# owner approves the consent text, counsel review and Persona's terms. Secrets by name
# only (wrangler secret put): PERSONA_API_KEY, PERSONA_TEMPLATE_ID, PERSONA_WEBHOOK_SECRET.
PERSONA_ENABLED = "false"
# Owner's choice: keep the ID's name and birth YEAR for side-by-side review (default off).
PERSONA_STORE_VERIFIED_NAME = "false"
# File a public comment (src/public-comment.js): read-only listing of open federal comment periods.
# Off until the owner turns it on. The Regulations.gov half also needs the secret REGULATIONS_GOV_API_KEY (api.data.gov).
PUBLIC_COMMENT_LISTING_ENABLED = "false"
# Core remote MCP bridge origin (the Cloudflare Tunnel hostname). Not a secret:
# Core refuses any request lacking CORE_BROKER_TOKEN plus a valid
# CORE_EDGE_SIGNING_KEY signature, so the hostname alone grants nothing.
# Those two are `wrangler secret put` only. /v1/core/mcp fails closed (503)
# until both secrets exist, so deploying this ahead of the tunnel is safe.
CORE_BROKER_URL = "https://core.mccluster.org"

# MCP_EDGE service binding is intentionally absent.
# Activate only after workers/mccluster-mcp exists in the Cloudflare account
# and the public contract at mcp.mccluster.org passes:
#   [[services]]
#   binding = "MCP_EDGE"
#   service = "mccluster-mcp"
# Binding it earlier fails the API Worker deploy. That change is a second PR.

# Production secrets are managed with `wrangler secret put` and are never committed.
# Required core secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# Other feature secrets remain documented in repository architecture and service modules.

[triggers]
crons = ["*/5 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[r2_buckets]]
binding = "SEEK_FIRST_ARCHIVE"
bucket_name = "seek-first-archive"

[[durable_objects.bindings]]
name = "HereTenantAgent"
class_name = "HereTenantAgent"

[exports.HereTenantAgent]
type = "durable-object"
storage = "sqlite"
