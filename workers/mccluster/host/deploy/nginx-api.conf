# api.mccluster.org -> the Node host.
#
# nginx terminates TLS and is the only thing listening publicly; the host
# binds 127.0.0.1 so it cannot be reached except through here.

upstream mccluster_api {
  server 127.0.0.1:8788;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.mccluster.org;
  # ACME first, so renewal keeps working, then everything else upgrades.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.mccluster.org;

  ssl_certificate     /etc/letsencrypt/live/api.mccluster.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.mccluster.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # Cloudflare absorbed floods before they reached the Worker. Nothing
  # does that now, so the limits that were implicit have to be explicit.
  client_max_body_size 25m;
  client_body_timeout 30s;

  # CORS is the Worker's business -- it reads ALLOWED_ORIGINS and varies
  # per route. nginx must not add its own headers or the browser sees two
  # and refuses both.
  location / {
    proxy_pass http://mccluster_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The host trusts the LAST value here, which is the one we append.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
