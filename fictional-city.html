<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Walk McCluster City from the harbor to Bridgeport. Meet the neighbors, visit the Whip Equipped garage, and follow The Robbery 1s.">
  <title>McCluster City · Harbor &amp; Bridgeport</title>
  <script src="js/shell-boot.js?v=__STAMP__"></script>
  <link rel="stylesheet" href="css/style.css?v=__STAMP__">
  <link rel="stylesheet" href="css/fictional-city.css?v=__STAMP__">
  <script src="js/theme.js?v=__STAMP__"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body class="city-page">
  <a class="city-skip" href="#city-canvas">Skip to the street</a>
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="city-template" data-owner-load="js/fictional-city/app.mjs?v=__STAMP__">
    <h1>McCluster City</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="city-template">
    <main class="city-shell">
      <header class="city-heading">
        <div>
          <p class="city-eyebrow"><span class="city-live-dot"></span> YOUR CITY, YOUR CHARACTERS</p>
          <h1>McCluster <em>City.</em></h1>
          <p class="city-deck">From the harbor to Bridgeport. Every block has a story.</p>
        </div>
        <div class="city-heading-actions">
          <span class="city-access">Owner preview</span>
          <button type="button" id="city-map-open">District map <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <div class="city-layout">
        <section class="city-world" aria-label="Explore the commercial district">
          <div class="city-world-bar">
            <div><span class="city-eyebrow" id="city-area-label">COMMERCIAL DISTRICT</span><strong id="city-location">Harbor Boulevard</strong></div>
            <span class="city-wallet"><span aria-hidden="true">◈</span> <b id="city-balance">250</b> <span>credits</span></span>
          </div>
          <div class="city-view-controls" aria-label="Camera view">
            <button type="button" data-city-view="close" aria-pressed="true">Close view</button>
            <button type="button" data-city-view="overview" aria-pressed="false">Overview</button>
            <p>Drag to look around · Tap to walk</p>
          </div>
          <div class="city-stage">
            <canvas id="city-canvas" tabindex="0" aria-label="3D city. Use WASD or arrow keys to walk; E to interact. Drag left or right to turn, up or down to tilt. Tap the street to walk. The district map offers the same destinations."></canvas>
            <div class="city-scene-status" id="city-scene-status" role="status">Opening the district…</div>
            <div class="city-stage-tag"><b id="city-stage-area">HARBOR / 01</b></div>
            <button type="button" id="city-map-mini" class="city-map-mini" aria-label="Open city map">
              <span data-map-heading>Map ↗</span><svg viewBox="0 0 100 100" aria-hidden="true"></svg>
            </button>
            <div class="city-camera-controls" aria-label="Camera controls">
              <button type="button" id="city-zoom-in" aria-label="Zoom in">+</button>
              <button type="button" id="city-zoom-out" aria-label="Zoom out">−</button>
              <button type="button" id="city-reset-view" aria-label="Recenter camera behind you" title="Recenter behind you">↺</button>
            </div>
            <div class="city-controls">
              <div class="city-dpad" aria-label="Movement controls">
                <button type="button" data-move="north" aria-label="Walk forward relative to the view">↑</button>
                <button type="button" data-move="west" aria-label="Walk left relative to the view">←</button>
                <button type="button" data-move="south" aria-label="Walk back relative to the view">↓</button>
                <button type="button" data-move="east" aria-label="Walk right relative to the view">→</button>
              </div>
              <div class="city-interaction">
                <p id="city-prompt">Walk up to a door or a neighbor.</p>
                <button type="button" id="city-interact" disabled><span class="city-key">E</span> Interact</button>
              </div>
            </div>
          </div>
          <div class="city-world-footer">
            <p><kbd>W A S D</kbd> walk · <kbd>E</kbd> talk / enter · or tap the street</p>
            <button type="button" id="city-exit" hidden>Leave building ↗</button>
            <button type="button" id="city-pocket-open">Your pocket <span id="city-pocket-count">0</span></button>
            <p class="city-geo-credit">Bridgeport map data: <a href="https://maps.cteco.uconn.edu/data/flight2023/" target="_blank" rel="noopener">CT State GIS Office, 2023</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></p>
          </div>
        </section>

        <aside class="city-sidebar" aria-label="On the block">
          <section class="city-story-card">
            <p class="city-eyebrow">BRIDGEPORT · DESIGNER KICKS</p>
            <h2>The Robbery 1s</h2>
            <p>Some shoes come with a story. These come with somebody else's ending.</p>
            <p id="city-robbery-progress" class="city-bio-meta">Follow the amber markers.</p>
            <button type="button" id="city-robbery-open">Enter the story <span aria-hidden="true">↗</span></button>
          </section>
          <section class="city-garage-card">
            <p class="city-eyebrow">YOUR HOME BASE</p>
            <img class="city-garage-icon" src="assets/img/we-logo-dark.png" alt="Whip Equipped" width="422" height="155">
            <h2>Whip Equipped</h2>
            <p>Tools out. Bay open.<br>McCluster, Majid, and Gunny are at the shop.</p>
            <button type="button" id="city-garage-open">Head to the garage <span aria-hidden="true">↗</span></button>
          </section>
          <section class="city-bulletin">
            <p class="city-eyebrow">HEARD ON THE BLOCK</p>
            <blockquote id="city-ad">“We guarantee you’ll like it, or else fuck you.”</blockquote>
            <p id="city-ad-brand">GAURANFUCKING TEA</p>
          </section>
          <section class="city-neighbors">
            <div class="city-section-head"><h2>Meet the neighbors</h2><span id="city-met">0 / 27</span></div>
            <p>Everybody has a pitch. Some even have a point.</p>
            <div id="city-neighbor-list"></div>
            <button type="button" id="city-residents-open" class="city-text-button">Open the city directory →</button>
          </section>
          <div class="city-side-links">
            <button type="button" id="city-story-open">Whip Equipped story desk</button>
            <button type="button" id="city-travel-open">Transportation &amp; other worlds ↗</button>
          </div>
        </aside>
      </div>
      <footer class="city-note">
        <p>Purchases use city credits.</p>
        <p id="city-save-note" role="status">Your place and pocket save on this device.</p>
      </footer>
    </main>
    <dialog id="city-dialog" class="city-dialog" aria-labelledby="city-dialog-title">
      <header class="city-dialog-head">
        <div><p class="city-eyebrow" id="city-dialog-kicker"></p><h2 id="city-dialog-title"></h2></div>
        <button type="button" id="city-dialog-close" aria-label="Close panel">×</button>
      </header>
      <div id="city-dialog-body"></div>
    </dialog>
    <div id="city-toast" class="city-toast" role="status" aria-live="polite" hidden></div>
  </template>
  <script type="module" src="js/owner-only.mjs?v=__STAMP__"></script>
  <script src="js/mcc-auth.js?v=__STAMP__"></script>
  <script src="js/tabbar.js?v=__STAMP__"></script>
</body>
</html>
