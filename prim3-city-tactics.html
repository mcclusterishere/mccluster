<!doctype html>
<html lang="en"><head><script src="js/shell-boot.js?v=fc1986ec0f4c"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>PRIM3 · City tactics simulation</title><meta name="color-scheme" content="dark"><link rel="stylesheet" href="css/style.css?v=fc1986ec0f4c"></head>
<body>
<section data-owner-gate data-owner-template="cityTpl" data-owner-load="js/prim3-tactics/city-simulation-ui.mjs"><h1>PRIM3 City tactics</h1><p data-owner-msg>Checking owner access…</p></section>
<template id="cityTpl">
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf4fa;font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:20px 20px 120px}button,input,select{font:inherit;min-height:44px;max-width:100%;padding:8px;background:#192b38;color:inherit;border:1px solid #8198a8;border-radius:6px}button:disabled{opacity:.45}fieldset{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0;border:1px solid #8198a8;min-width:0}label{display:grid;gap:5px}nav{display:flex;flex-wrap:wrap;gap:8px}a{color:#8ddcff}svg{width:100%;display:block;background:#15232b;border:1px solid #8198a8}#status,#notice{min-height:24px;overflow-wrap:anywhere}.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:800px){.layout{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}.small{font-size:14px;color:#c3d3de}
</style>
<main><a href="prim3-world.html">Return to PRIM3 World</a><h1>City tactics simulation</h1>
<p>Move through the shared Bridgeport street graph, manage AP, face a simulated opponent, then reach the marked extraction cell. This is a fictional training encounter, not an event at this location.</p>
<details><summary>Owner setup · this browser only</summary><fieldset><legend>New simulation</legend><label>Topology<select id="topology"><option value="hex">Hex</option><option value="square">Square</option></select></label><label>Metres per MOVE<input id="range" type="number" min="3" max="12" step="1" value="6"></label><button id="start">Start new simulation</button><button id="resume">Resume saved simulation</button></fieldset><p class="small">Starting a new run backs up the previous browser save. These controls do not change shared administrative policy or City geometry.</p></details>
<p id="notice" role="alert"></p><h2 id="status" aria-live="polite">Choose a new simulation or resume.</h2>
<div class="layout"><div><svg id="map" viewBox="0 0 60 60" role="img" aria-label="Metric street map with operative, visible opponent and extraction"></svg><p class="small">Blue: 1 AP reach · orange: 2 AP reach · R: operative · H: visible simulated opponent · E: extraction. East is right; north is up. Footprints block sight in this simulation; heights, doors and interiors are not surveyed here.</p></div>
<div><label>Reachable destination<select id="destination"><option value="">Select a destination</option></select></label><p id="route">Select first; confirm to move.</p><nav><button id="confirm" disabled>Confirm move</button><button id="fire" disabled>Fire at visible opponent</button><button id="reload" disabled>Reload</button><button id="overwatch" disabled>Overwatch</button><button id="extract" disabled>Extract</button><button id="end" disabled>End turn</button></nav><p id="aftermath"></p><p class="small">AP, targeting, damage, reactions and hostile turns use the PRIM3 resolver. Saves stay in this browser. Square and hex runs use separate scenario configurations; existing PRIM3 saves are not imported.</p></div></div>
</main></template>
<script type="module" src="js/owner-only.mjs?v=fc1986ec0f4c"></script><script src="js/tabbar.js?v=fc1986ec0f4c"></script></body></html>
