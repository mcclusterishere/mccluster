<!doctype html><html lang="en" data-theme="dark"><head>
<script src="js/shell-boot.js?v=__STAMP__"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PRIM3 · Reviewed mission practice</title>
<link rel="stylesheet" href="css/style.css?v=__STAMP__"><link rel="stylesheet" href="css/prim3-mission.css?v=__STAMP__">
</head><body>
<section class="owner-gate" data-owner-gate data-owner-template="missionTpl" data-owner-load="js/prim3-mission/app.mjs?v=__STAMP__"><h1>PRIM3 mission practice</h1><p data-owner-msg>Checking access with the server…</p></section>
<template id="missionTpl"><main class="pm"><p class="pm-kicker">PRIM3 / MISSIONS</p><h1>Relay practice</h1><p>Review the mission, enter Transit / Relay, then test your coordinate skills and reflect on the result.</p>
<section id="pmOwner"><h2>Owner review</h2><p>Template: relay-distance-v1. Fictional training in the broad Connecticut region, United States. Offline practice, with no live news claim. Available for 24 hours after release.</p>
<label><input id="pmFiction" type="checkbox"> Fiction and moderation checked</label><label><input id="pmGeography" type="checkbox"> Broad-region context checked</label><button id="pmRelease" disabled>Release and open briefing</button><p id="pmConfig"></p></section>
<section id="pmBrief" hidden><h2>Mission brief</h2><p id="pmBriefText"></p><p>In Transit / Relay, use Entry, Recon and Tech to reach the relay. Return to this tab for coordinate practice. Tactical success and your checked math answers are recorded separately.</p><p>Worked example: from (−3, 2) to (4, 2), the distance is |4 − (−3)| = 7 grid units. This is straight-line distance on one row, not a movement or AP cost.</p><button id="pmBegin">Acknowledge briefing</button></section>
<section id="pmTactical" hidden><h2>Enter Transit / Relay</h2><p>The tactical level opens in another tab and keeps its existing save. Return here when you are ready to answer. This handoff does not reset your game or claim a tactical win.</p><button id="pmHandoff">Prepare tactical handoff</button><div id="pmLaunch" hidden><a id="pmTacticalLink" href="prim3-transit.html" target="_blank" rel="noopener">Open Transit / Relay ↗</a><button id="pmReturn">I’m back · continue practice</button></div></section>
<section id="pmPlay" hidden><h2>Coordinate checkpoint</h2><p id="pmLevel"></p><p id="pmQuestion"></p><form id="pmForm"><label>Distance in grid units <input id="pmAnswer" type="text" inputmode="numeric" maxlength="9" autocomplete="off" required></label><button>Check answer</button><button type="button" id="pmHint">Show scaffold</button></form><label>Tactical outcome (your report)<select id="pmOutcome"><option value="abandoned">Stopped / still unfinished</option><option value="completed">Completed</option></select></label><button id="pmFinish">Save debrief</button></section>
<section id="pmDebrief" hidden><h2>Debrief</h2><p id="pmSummary"></p><p id="pmNext"></p><a id="pmEvidence" href="prim3.html">Open PRIM3 Principles</a></section>
<p id="pmFeedback" class="pm-status" role="status">Connecting to the learning service…</p><button id="pmRetry" hidden>Retry pending request</button><p class="pm-note">Practice evidence is recorded in your existing learning account. This exercise does not award Principles credit, competency ratings or credentials.</p></main></template>
<script type="module" src="js/owner-only.mjs?v=__STAMP__"></script><script src="js/tabbar.js?v=__STAMP__"></script></body></html>
