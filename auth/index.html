<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Signing you in — McCluster</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0807;color:#f4efe6;
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#b8ada2;margin:0;max-width:38ch}
  a{color:#ff7a72}
  .err{color:#ff9a91}
</style>
</head>
<body>
<main>
  <h1 id="h">Signing you in…</h1>
  <p id="p">One moment.</p>
</main>
<script src="/js/mcc-auth.js"></script>
<script>
  /* The landing point for a redirect back from Google. Its only job is to
     spend the authorization code, then send the person where they were
     going. It renders no account data and reads nothing but the URL. */
  (function () {
    var h = document.getElementById('h'), p = document.getElementById('p');

    /* Where to return to. Same-origin only: an attacker-supplied absolute
       URL here would turn the sign-in flow into an open redirect that
       arrives carrying a fresh session. */
    function nextPath() {
      var raw = new URLSearchParams(location.search).get('next') || '/account.html';
      if (raw.charAt(0) !== '/' || raw.charAt(1) === '/') return '/account.html';
      return raw;
    }

    window.MCC.complete()
      .then(function (user) {
        if (!user) { h.textContent = 'Nothing to finish'; p.innerHTML = '<a href="/account.html">Go to your account</a>'; return; }
        location.replace(nextPath());
      })
      .catch(function (error) {
        h.textContent = 'That sign-in did not complete';
        p.className = 'err';
        p.textContent = error.message || 'Please try signing in again.';
        p.insertAdjacentHTML('afterend', '<p><a href="/account.html">Back to sign in</a></p>');
      });
  })();
</script>
</body>
</html>
