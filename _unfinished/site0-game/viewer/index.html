<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PRIM3 SITE 0 — World Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#050810;overflow:hidden;font-family:monospace;color:#e3e7ee}#c{position:fixed;inset:0;display:block;touch-action:none}.hud{position:fixed;z-index:5}.top{top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.tag{font-size:10px;letter-spacing:.2em;color:#22d3ee}h1{font-size:15px;margin-top:4px}.sub{font-size:10px;color:#8b96a8;margin-top:3px}.floors{display:flex;flex-direction:column;gap:6px;pointer-events:auto}.fbtn,.btn{background:#0c1220;border:1px solid #1a2540;color:#8b96a8;font:inherit;font-size:10px;padding:8px 12px;cursor:pointer}.fbtn.on,.btn.on{border-color:#22d3ee;color:#22d3ee}.stats{left:14px;bottom:14px;font-size:10px;color:#8b96a8}.bar{right:14px;bottom:14px;display:flex;gap:8px}.load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#050810;color:#22d3ee;letter-spacing:.2em;font-size:12px;transition:opacity .4s}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/","@sparkjsdev/spark":"../vendor/spark.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud top"><div><div class="tag">WORLD VIEWER — LIGHTWEIGHT GIT ASSETS</div><h1 id="ftitle">PRIM3 SITE 0</h1><div class="sub" id="fsub"></div></div><div class="floors" id="floors"></div></div>
<div class="hud stats" id="stats">—</div>
<div class="hud bar"><button class="btn on" id="splatBtn">500K</button><button class="btn" id="panoBtn">PANO</button><button class="btn" id="shotBtn">SHOT</button></div>
<div class="load" id="load">MATERIALIZING WORLD</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const FLOORS={
 l3:{title:'L3 FLIGHT DECK',sub:'exterior · lightweight 500K viewer asset',spz:'assets/l3/site0_l3_500k.spz',pano:'assets/l3/site0_l3_pano.jpg'},
 b3:{title:'B3 PRIME DEPLOYMENT HALL',sub:'interior · lightweight 500K viewer asset',spz:'assets/b3/site0_b3_500k.spz',pano:'assets/b3/site0_b3_pano.jpg'}
};
const params=new URLSearchParams(location.search);let current=FLOORS[params.get('floor')]?params.get('floor'):'l3';let mode='splat';
const canvas=document.getElementById('c'),load=document.getElementById('load'),stats=document.getElementById('stats');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050810);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,4000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
const spark=new SparkRenderer({renderer});scene.add(spark);let splat=null,pano=null;

for(const [id,f] of Object.entries(FLOORS)){const b=document.createElement('button');b.className='fbtn'+(id===current?' on':'');b.textContent=f.title;b.onclick=()=>switchFloor(id);b.id='floor-'+id;document.getElementById('floors').appendChild(b)}
function setLabels(){document.getElementById('ftitle').textContent=FLOORS[current].title;document.getElementById('fsub').textContent=FLOORS[current].sub}
async function loadSplat(){mode='splat';document.getElementById('splatBtn').classList.add('on');document.getElementById('panoBtn').classList.remove('on');if(pano)pano.visible=false;load.style.display='flex';load.style.opacity='1';if(splat){scene.remove(splat);splat.dispose?.()}splat=new SplatMesh({url:FLOORS[current].spz});await splat.initialized;scene.add(splat);const box=new THREE.Box3().setFromObject(splat),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()).length();controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s*.32,s*.2,s*.4));camera.far=Math.max(4000,s*4);camera.updateProjectionMatrix();stats.textContent=`${FLOORS[current].title} · 500K · span ${s.toFixed(0)}m`;load.style.opacity='0';setTimeout(()=>load.style.display='none',450)}
function showPano(){mode='pano';document.getElementById('panoBtn').classList.add('on');document.getElementById('splatBtn').classList.remove('on');if(splat)splat.visible=false;if(pano)scene.remove(pano);new THREE.TextureLoader().load(FLOORS[current].pano,t=>{t.colorSpace=THREE.SRGBColorSpace;pano=new THREE.Mesh(new THREE.SphereGeometry(500,60,40),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide}));scene.add(pano);camera.position.set(0,12,.01);controls.target.set(0,12,-1);stats.textContent=`${FLOORS[current].title} · PANO`})}
function switchFloor(id){current=id;history.replaceState(null,'','?floor='+id);document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));document.getElementById('floor-'+id).classList.add('on');setLabels();mode==='pano'?showPano():loadSplat()}
document.getElementById('splatBtn').onclick=()=>loadSplat();document.getElementById('panoBtn').onclick=()=>showPano();document.getElementById('shotBtn').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`prim3-${current}.png`;a.click()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}setLabels();loadSplat();loop();
</script>
</body>
</html>
