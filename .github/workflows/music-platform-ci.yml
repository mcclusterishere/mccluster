permissions:
  contents: read

jobs:
  music-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Parse music browser modules
        run: |
          node --check js/music-engine.js
          node --check js/music-community.js
          node --check js/music-creator-profile.js
          node --check js/music-admin.js
          node --check js/control-room/music-ops.js
      - name: Parse creator studio module
        run: node --check js/music-creator-studio.js
      - name: Parse the album room's light, waveform and Now Playing helper
        run: |
          node --check js/now-playing.js
          node --check js/installed-app-dock.js
          node --check js/peaks.js
          node --check js/chamber.js
          node --check js/filament.js
      - name: Run music platform contracts
        run: node --test scripts/test/music-platform.test.mjs
      - name: Creator release submission survives slow metadata, edits and a failed refresh
        run: node --test scripts/test/creator-release-submission.test.mjs
      - name: Native Control publishes the verified release and handles stale, denied and uncertain outcomes
        run: node --test scripts/test/control-music-review.test.mjs
      - name: Late access and gate replies cannot interrupt a newer song or undo Pause
        run: node --test scripts/test/music-playback-races.test.mjs
      - name: Background playback contracts (no Web Audio on the deck, the audio session, the lifecycle guard)
        run: node --test scripts/test/music-background.test.mjs
      - name: Songs play to the end (the gate's own answer, a finish counted before the next song starts, each file what its name says and quick to start)
        run: |
          node --test scripts/test/gated-audio.test.mjs scripts/test/listen-ledger.test.mjs
          node scripts/music-track-lengths.mjs --check
          node --test scripts/test/music-track-lengths.test.mjs
      - name: The music stream keeps Range, its one-play allowance and 410, and answers a read past the end as 416
        working-directory: workers/mccluster
        run: node --import ./test/support/offline-network.mjs --test test/music-gate.test.mjs
      - name: Every public catalogue track has fresh peaks
        run: |
          node scripts/music-peaks.mjs --check
          node --test scripts/test/music-peaks.test.mjs
      - name: The module knows who is listening (a token per call, sign-out, offers by state)
        run: node --test scripts/test/music-accounts.test.mjs
      - name: Parse the players bound to the one Now Playing owner
        run: |
          node --check js/label.js
          node --check js/pip.js
          node --check js/gateway.js
          node --check js/world-audio-continuity.js
          node --check scripts/music-artwork.mjs
      - name: One Now Playing everywhere (previous and next, no 15-second skips, every cover at its true size and type)
        run: |
          node scripts/music-artwork.mjs --check
          node --test scripts/test/now-playing-contract.test.mjs
      - name: The approved listening events go out once per dropped connection or failed song; no name waits for approval
        run: |
          node --check js/analytics.js
          node --test scripts/test/music-measurement.test.mjs
      - name: Offline, a kept copy of the same audio under its other name still plays (the vault)
        run: |
          node --check sw.js
          node --test scripts/test/music-offline-vault.test.mjs
      - name: One player across music pages (the route table and its one switch, the album contained, a card's play button left to the player, history, the live head, which frame is adopted, the engine in a view)
        run: |
          node --check js/music-shell.js
          node --check js/shell-boot.js
          node --test scripts/test/music-shell.test.mjs
      - name: Quick wins (one McCluster profile, albums and artists only, whole covers, a creator never asked to join, the held closing song, an album stops after its last song, the approved events)
        run: |
          node --check js/listen.js
          node --check js/gated-audio.js
          node --check js/member-desk-core.js
          node --check js/member-desk.js
          node --check js/creator-onboarding.js
          node --test scripts/test/music-quick-wins.test.mjs

  music-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check music edge functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/music-access/index.ts
          deno check --node-modules-dir=auto supabase/functions/music-checkout/index.ts
          deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
          deno check --node-modules-dir=auto supabase/functions/music-direct-checkout/index.ts
          deno check --node-modules-dir=auto supabase/functions/music-direct-access/index.ts

  browser:
    # The pinned Playwright browser dependencies require this supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare the browser outside the repository
        run: |
          npm install --prefix /tmp/music-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0
          /tmp/music-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: The album keeps playing with every AudioContext suspended, one request per play, the audio session, the in-app note; songs play to the end through slow reads, drops and expiry
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/music-background.e2e.mjs /tmp/music-proof/background
      - name: Music continues into World, with and without reduced motion
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/music-world-continuity.e2e.mjs /tmp/music-proof/world
      - name: Who is listening, in Chromium (personas, races, expiry, other tabs; 390px)
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/music-accounts.e2e.mjs /tmp/music-proof/accounts
      - name: One Now Playing on every player (title, artist, cover, playbackState, position, previous and next, AirPlay, resume; 390px)
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/now-playing.e2e.mjs /tmp/music-proof/now-playing
      - name: Native Control verifies the pinned audio before publication and reads back uncertain outcomes
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/control-music-review.e2e.mjs /tmp/music-proof/control-review
      - name: One player across music pages (a song plays on across Listen, an artist page and sign-in; a card's play button plays its song; the album a page of its own in Release 2; Back, Forward, deep links, the live head, the World; 320 to 1280 px)
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/music-shell.e2e.mjs /tmp/music-proof/shell
      - name: Quick wins in Chromium (one McCluster profile, albums and artists, whole covers, no join offer for a creator, the held closing song's pop-up, an album stops after its last song; 320 to 1280 px)
        env:
          PLAYWRIGHT_DIR: /tmp/music-qa/node_modules
        run: node scripts/e2e/music-quick-wins.e2e.mjs /tmp/music-proof/quick-wins
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: music-background-${{ github.run_id }}
          path: /tmp/music-proof
          retention-days: 7
