name: Music Platform CI

on:
  pull_request:
    paths:
      - 'listen.html'
      - 'album.html'
      - 'creator.html'
      - 'music-creator.html'
      - 'music-admin.html'
      - 'music-creator-terms.html'
      - 'data/albums.json'
      - 'js/music-*.js'
      - 'css/music-*.css'
      - 'supabase/functions/music-*/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/migrations/**'
      - 'scripts/test/music-platform.test.mjs'
      - '.github/workflows/music-platform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'listen.html'
      - 'album.html'
      - 'creator.html'
      - 'music-creator.html'
      - 'music-admin.html'
      - 'music-creator-terms.html'
      - 'data/albums.json'
      - 'js/music-*.js'
      - 'css/music-*.css'
      - 'supabase/functions/music-*/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/migrations/**'
      - 'scripts/test/music-platform.test.mjs'

permissions:
  contents: read

jobs:
  music-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse music browser modules
        run: |
          node --check js/music-engine.js
          node --check js/music-community.js
          node --check js/music-creator-profile.js
          node --check js/music-admin.js
      - name: Parse creator studio module
        run: node --check js/music-creator-studio.js
      - name: Run music platform contracts
        run: node --test scripts/test/music-platform.test.mjs

  music-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check music edge functions
        run: |
          deno check supabase/functions/music-access/index.ts
          deno check supabase/functions/music-checkout/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
