name: Ontology Graph v2 (isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/pending/20261125010000_ops_ontology_graph_v2*.sql'
      - 'supabase/tests/ops_ontology_graph_v2.*.sql'
      - 'supabase/migrations/20260919053445_operational_ontology_v1.sql'
      - 'core/ontology/graph-v2.json'
      - 'core/test/ontology-graph-v2.test.mjs'
      - '.github/workflows/ops-ontology-graph-v2-db.yml'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: ontology_fixture_only
          POSTGRES_DB: ontology_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ontology_fixture_only
      PGDATABASE: ontology_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --test core/test/ontology-graph-v2.test.mjs core/test/ontology-contract.test.mjs
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ops_ontology_graph_v2.stub.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260919053445_operational_ontology_v1.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/pending/20261125010000_ops_ontology_graph_v2.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/pending/20261125010000_ops_ontology_graph_v2.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ops_ontology_graph_v2.behaviour.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/pending/20261125010000_ops_ontology_graph_v2.rollback.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ops_ontology_graph_v2.after-rollback.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/pending/20261125010000_ops_ontology_graph_v2.sql
