name: Analytics business counters (isolated)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261021205801_analytics_business_event_counts_v1.sql'
      - 'supabase/tests/analytics_business_event_counts.behaviour.sql'
      - 'supabase/migrations/*_analytics_read_hotpaths_v2.sql'
      - 'supabase/migrations/*_analytics_region_covering_v3.sql'
      - 'supabase/pending/analytics_read_hotpaths_v2.sql'
      - 'supabase/pending/analytics_region_covering_v3.sql'
      - 'supabase/ops/*_v2_idx.sql'
      - 'supabase/ops/*_v3_idx.sql'
      - 'scripts/test-analytics-hotpaths-db.mjs'
      - 'scripts/test-analytics-long-range-db.mjs'
      - 'supabase/tests/analytics_summary_before_v4.sql'
      - 'supabase/migrations/*_analytics_long_range_v4.sql'
      - 'supabase/ops/*_v4_idx.sql'
      - 'supabase/ops/*_v5_idx.sql'
      - 'supabase/migrations/*_analytics_audience_index_width_v5.sql'
      - 'supabase/migrations/*_analytics_summary_parameter_plans_v6.sql'
      - 'workers/mccluster/src/analytics/paged-reads.js'
      - 'workers/mccluster/src/analytics/measurement.js'
      - 'workers/mccluster/test/analytics-paged-reads.test.mjs'
      - 'supabase/tests/analytics_region.behaviour.sql'
      - 'workers/mccluster/src/analytics/business-event-counts.js'
      - 'workers/mccluster/src/analytics/router.js'
      - 'workers/mccluster/src/analytics/coverage.js'
      - 'workers/mccluster/test/analytics-coverage.test.mjs'
      - 'js/control-room/analytics.js'
      - 'scripts/test/control-analytics-coverage-pages.test.mjs'
      - 'workers/mccluster/test/analytics-business-event-counts.test.mjs'
      - '.github/workflows/analytics-business-counts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Worker module
        run: |
          node --check workers/mccluster/src/analytics/business-event-counts.js
          node --check workers/mccluster/src/analytics/router.js
          node --test workers/mccluster/test/analytics-business-event-counts.test.mjs
          node --test workers/mccluster/test/analytics-coverage.test.mjs scripts/test/control-analytics-coverage-pages.test.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test semantics and browser-role denial in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/analytics_business_event_counts.behaviour.sql
      - name: Test regional parity and indexed analytics access paths
        run: |
          npm install --prefix "$RUNNER_TEMP/analytics-hotpaths" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.10
          PGLITE_MODULE_PATH="$RUNNER_TEMP/analytics-hotpaths/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-analytics-hotpaths-db.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/analytics-hotpaths/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-analytics-long-range-db.mjs
