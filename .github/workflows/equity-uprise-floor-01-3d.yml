name: Legacy Equity Uprise Floor 1 Core V1 3D

# Core V1 compatibility workflow.
# Core V2 uses .github/workflows/equity-uprise-building-v2.yml and the shared
# building-core-v2.json. Do not use this workflow as Core V2 authority.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/design/equity-uprise-building/production/floor-01/build_equity_uprise_floor_01.py'
      - 'docs/design/equity-uprise-building/production/floor-01/verify_floor_01_scene.py'
      - '.github/workflows/equity-uprise-floor-01-3d.yml'

jobs:
  legacy-core-v1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "This workflow is retained for Core V1/main compatibility only."
          echo "Core V2 authoritative build: .github/workflows/equity-uprise-building-v2.yml"
