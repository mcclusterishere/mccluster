name: Equity Uprise Floor 1 Deterministic 3D

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/design/equity-uprise-building/FLOOR-01-LOBBY-INTAKE-360-SPEC.md'
      - 'docs/design/equity-uprise-building/FLOOR-01-SCHEMATIC-PLAN-BASIS.md'
      - 'docs/design/equity-uprise-building/references/floor-01/**'
      - 'docs/design/equity-uprise-building/production/floor-01/**'
      - '.github/workflows/equity-uprise-floor-01-3d.yml'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic 3D dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh

      - name: Build Floor 1 GLB
        working-directory: docs/design/equity-uprise-building/production/floor-01
        run: python build_equity_uprise_floor_01.py

      - name: Verify canonical geometry
        working-directory: docs/design/equity-uprise-building/production/floor-01
        run: python verify_floor_01_scene.py

      - name: SHA-256 generated artifact
        working-directory: docs/design/equity-uprise-building/production/floor-01
        run: sha256sum generated/equity-uprise-floor-01-deterministic-v1.glb | tee generated/equity-uprise-floor-01-deterministic-v1.sha256

      - name: Upload deterministic GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-uprise-floor-01-deterministic-v1
          path: |
            docs/design/equity-uprise-building/production/floor-01/generated/equity-uprise-floor-01-deterministic-v1.glb
            docs/design/equity-uprise-building/production/floor-01/generated/equity-uprise-floor-01-deterministic-v1-report.json
            docs/design/equity-uprise-building/production/floor-01/generated/equity-uprise-floor-01-verification-v1.json
            docs/design/equity-uprise-building/production/floor-01/generated/equity-uprise-floor-01-deterministic-v1.sha256
          if-no-files-found: error
