name: Review and reconcile Worker triggers
on:
  workflow_dispatch:
    inputs:
      worker:
        type: choice
        options: [mccluster, mccluster-mcp]
        required: true
      apply:
        type: boolean
        default: false
      reviewed_digest:
        description: SHA-256 of the reviewed live plan (required for apply)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: worker-triggers-${{ inputs.worker }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ inputs.worker }}
      APPLY: ${{ inputs.apply }}
      REVIEWED_DIGEST: ${{ inputs.reviewed_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require reviewed source
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Capture every live route, domain and cron before planning
        run: python3 scripts/worker-triggers.py snapshot --config "workers/$WORKER/wrangler.toml" > trigger-inventory.json
      - name: Review or apply the exact plan
        shell: bash
        run: |
          set -euo pipefail
          mode=plan
          if [ "$APPLY" = true ]; then mode=apply; fi
          python3 scripts/worker-triggers.py "$mode" --config "workers/$WORKER/wrangler.toml" --expected-digest "$REVIEWED_DIGEST" | tee trigger-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trigger-review-${{ inputs.worker }}
          path: trigger-*.json
