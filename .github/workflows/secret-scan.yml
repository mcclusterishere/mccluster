name: Secret scan
# Always on for main (every pull request into it and every push to it,
# AGENTS.md rule 2: never a feature-branch push trigger), every path,
# every file type (Markdown included): a committed
# credential is a credential wherever it sits. Fail-closed: a scanner error
# is never a clean result (scripts/test/secret-scan-fail-closed.test.mjs
# runs this step's script against a synthetic repository and a broken git).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject committed production secrets
        shell: bash
        run: |
          set -euo pipefail
          # Anchored where a prefix is also a common suffix: network_live_*
          # is an identifier, not an rk_live_ key, so sk_/rk_ need a
          # non-word character or line start in front of them; a Twilio
          # account SID is 34 characters bounded on both sides.
          # sb_publishable_* is the public Supabase key and is allowed by
          # design (AGENTS.md hard rule 5: the anon key is public, RLS is
          # the wall); sb_secret_* and service-role JWTs are not.
          patterns=(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'gh[pousr]_[A-Za-z0-9_]{20,}'
            '(^|[^A-Za-z0-9_])(sk|rk)_(live|test)_[A-Za-z0-9]{16,}'
            'AKIA[0-9A-Z]{16}'
            'sb_secret_[A-Za-z0-9_-]{10,}'
            'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'
            'whsec_[A-Za-z0-9]{16,}'
            '(^|[^A-Za-z0-9])AC[0-9a-f]{32}([^A-Za-z0-9]|$)'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'AIza[0-9A-Za-z_-]{35}'
            'sk-ant-[A-Za-z0-9_-]{20,}'
          )
          for pattern in "${patterns[@]}"; do
            # -e is essential: private-key BEGIN markers start with hyphens.
            # Exit 1 means no match; every other nonzero status is a scanner
            # failure, NOT a clean result.
            if git grep -n -E -e "$pattern" -- ':!*.example' ':!*.example.*'; then
              echo "Potential committed production secret matched: $pattern" >&2
              exit 1
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                echo "Secret scanner failed (exit $result); refusing green CI." >&2
                exit "$result"
              fi
            fi
          done
          echo 'No committed production secret format found in tracked source.'
