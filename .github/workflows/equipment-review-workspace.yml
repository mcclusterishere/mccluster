name: Equipment review workspace
on:
  push:
    branches: ['astra/physical-computer-lab-20261103']
    paths: ['.github/workflows/equipment-review-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mandatory building context preflight
        run: python docs/design/equity-uprise-building/production/audit_building_context.py
      - name: Archive tracked source only
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/review-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/review-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equipment-review-source
          path: |
            ${{ runner.temp }}/review-source.tar.gz
            ${{ runner.temp }}/source-revision.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
