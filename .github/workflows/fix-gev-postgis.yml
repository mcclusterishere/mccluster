name: Repair GEV PostGIS migration

on:
  push:
    branches:
      - feature/gev-spatial-intelligence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gev-spatial-intelligence
          fetch-depth: 0

      - name: Qualify PostGIS bbox operator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260909034000_spatial_intelligence.sql')
          s = p.read_text()
          old = 'and e.location::extensions.geometry && extensions.st_makeenvelope('
          new = 'and e.location::extensions.geometry OPERATOR(extensions.&&) extensions.st_makeenvelope('
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected bbox expression not found')
          PY

      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            echo "PostGIS bbox operator already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260909034000_spatial_intelligence.sql
          git commit -m "Fix schema-qualified PostGIS bbox operator"
          git push origin HEAD:feature/gev-spatial-intelligence
