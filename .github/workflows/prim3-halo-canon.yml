name: PRIM3 Halo Canon CI

on:
  pull_request:
    paths:
      - 'PRIM3/game/halo/**'
      - 'docs/prim3/HITMANS-HALO-WORLD-CANON.md'
      - '.github/workflows/prim3-halo-canon.yml'
  push:
    branches: [main]
    paths:
      - 'PRIM3/game/halo/**'
      - 'docs/prim3/HITMANS-HALO-WORLD-CANON.md'

permissions:
  contents: read

jobs:
  halo-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate 66-mission campaign and isolation invariants
        working-directory: PRIM3/game/halo
        run: npm run validate
