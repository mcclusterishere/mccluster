name: Android SMS Relay CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/mccluster-sms-relay/**'
      - '.github/workflows/android-relay-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/mccluster-sms-relay/**'
      - '.github/workflows/android-relay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android relay APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f
      - name: Ensure Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        working-directory: android/mccluster-sms-relay
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/mccluster-sms-relay/app/build/outputs/apk/debug/app-debug.apk
