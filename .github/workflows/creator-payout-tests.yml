name: Creator payout safety
on:
  pull_request:
    paths:
      - 'workers/mccluster/src/creator-transfers.js'
      - 'workers/mccluster/src/index.js'
      - 'workers/mccluster/test/creator-transfers.test.js'
      - 'workers/mccluster/test/creator-payouts-staging.integration.test.js'
      - 'workers/mccluster/package.json'
      - 'supabase/migrations/*action_creator*'
      - '.github/workflows/creator-payout-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mccluster
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --test test/creator-payouts-staging.integration.test.js
