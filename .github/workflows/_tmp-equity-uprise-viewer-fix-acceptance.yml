name: TEMP Equity Uprise Viewer Fix Acceptance

on:
  push:
    branches:
      - fix/equity-uprise-viewer-interaction-performance

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Stage canonical preview assets
        run: |
          set -euo pipefail
          mkdir -p equity-uprise-preview/lab-runtime
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-building-core-v2.glb equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-facade-core-v2.glb equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-building-services-core-v2.glb equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-basement-b1-core-v2.glb equity-uprise-preview/
          for n in 01 02 03 04 05 06 07; do cp docs/design/equity-uprise-building/production/generated/equity-uprise-floor-${n}-core-v2.glb equity-uprise-preview/; done
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-fabric-v1.glb equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-manifest-v1.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-connections-v1.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-it-lab-catalog-v1.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/asset-registry/generated/equity-uprise-asset-registry-v1.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-digital-twin-program.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-simulation-objects.json equity-uprise-preview/
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-object-inventory.json equity-uprise-preview/
          cp docs/design/equity-uprise-development/competency-rubrics.json equity-uprise-preview/
          cp docs/design/equity-uprise-development/FEDERAL-TRAINING-BINDINGS.json equity-uprise-preview/federal-training-bindings.json
          cp docs/design/equity-uprise-building/production/lab-runtime/*.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/*-scenario-pack-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/difficulty-progression-policy-v1.json equity-uprise-preview/lab-runtime/
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser interaction acceptance
        run: node scripts/_tmp_equity_uprise_viewer_fix_acceptance.mjs
