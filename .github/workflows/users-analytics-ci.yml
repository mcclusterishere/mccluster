name: Users Analytics CI
on:
  pull_request:
    paths:
      - 'workers/mccluster/src/analytics/**'
      - 'workers/mccluster/test/analytics-*.test.mjs'
      - 'js/music-self-analytics.js'
      - 'js/mnet.js'
      - 'workers/mccluster/test/mnet-mission-flow.test.mjs'
      - '.github/workflows/users-analytics-ci.yml'
  push:
    branches: [feat/analytics-users-intelligence]
permissions:
  contents: read
jobs:
  users-analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mccluster
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test test/analytics-users.test.mjs test/analytics-users-integration.test.mjs test/analytics-self-service.test.mjs test/analytics-self-service-ui.test.mjs
      - run: node --test test/mnet-mission-flow.test.mjs
      - run: node --check ../../js/mnet.js
      - run: node --check src/analytics/router.js
      - run: node --check ../../js/analytics-users.js
      - run: node --check ../../js/music-self-analytics.js
