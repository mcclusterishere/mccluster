      - '.github/workflows/human-uprise-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-uprise-editorial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: browser (${{ matrix.suite }})
    # Keep the pinned Playwright browser dependencies on a supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [database, editorial-iphone-portrait, editorial-iphone-landscape, editorial-ipad-portrait, editorial-ipad-landscape, editorial-desktop, editorial-video-composer, travel-iphone-portrait, travel-iphone-landscape, travel-ipad-portrait, travel-ipad-landscape, travel-desktop, guest-travel, member-desk, music-world, news-guest, navigation, installed-app, creator-onboarding, mission-pins, world-missions-guest, world-first-visit, world-gate, sign-in, world-countries, world-globe-feed, world-transport, anti-social, human-uprise-door, owner-halo-globe, policy-mode, world-environment, environment-globe, environment-world, environment-unit, environment-plane, environment-store, environment-owner, environment-control, environment-ingest, connections-consent, mission-sources-store, mission-sources-owner, environment-timeline, environment-timeline-world, mission-sources-control, world-source-profile, carry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare browser dependencies outside the repository
        run: |
          npm install --prefix /tmp/hu-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0 @electric-sql/pglite@0.3.14
          /tmp/hu-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check ${{ matrix.suite }} independently
        env:
          PLAYWRIGHT_DIR: /tmp/hu-qa/node_modules
          CESIUM_DIR: /tmp/hu-qa/node_modules/cesium/Build/Cesium
          PGLITE_DIR: /tmp/hu-qa/node_modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hu-proof
          case "${{ matrix.suite }}" in
            database) node scripts/test/travel-journeys-db.mjs ;;
            editorial-iphone-portrait|editorial-iphone-landscape|editorial-ipad-portrait|editorial-ipad-landscape|editorial-desktop)
              device="${{ matrix.suite }}"
              EDITORIAL_DEVICE="${device#editorial-}" E2E_EXCLUDE=editorial-video-composer E2E_ONLY=editorial node scripts/e2e/world-screen.e2e.mjs "/tmp/hu-proof/${{ matrix.suite }}"
              ;;
            editorial-video-composer) E2E_ONLY=editorial-video-composer node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/editorial-video-composer ;;
            travel-iphone-portrait) E2E_ONLY=travel-iphone-portrait node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-iphone-portrait ;;
            travel-iphone-landscape) E2E_ONLY=travel-iphone-landscape node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-iphone-landscape ;;
            travel-ipad-portrait) E2E_ONLY=travel-ipad-portrait node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-ipad-portrait ;;
            travel-ipad-landscape) E2E_ONLY=travel-ipad-landscape node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-ipad-landscape ;;
            travel-desktop) E2E_ONLY=travel-desktop node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-desktop ;;
            guest-travel) node scripts/e2e/world-travel-guest.e2e.mjs /tmp/hu-proof/guest-travel ;;
            member-desk) node scripts/e2e/member-desk.e2e.mjs /tmp/hu-proof/member-desk ;;
            music-world) node scripts/e2e/music-world-continuity.e2e.mjs /tmp/hu-proof/music-world ;;
            news-guest) E2E_ONLY=news-guest node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/news-guest ;;
            navigation) node scripts/e2e/site-navigation.e2e.mjs /tmp/hu-proof/navigation ;;
            installed-app)
              node --test scripts/test/installed-app-shell.test.mjs
              node scripts/e2e/installed-app.e2e.mjs /tmp/hu-proof/installed-app
              ;;
            creator-onboarding) node scripts/e2e/creator-onboarding.e2e.mjs /tmp/hu-proof/creator-onboarding ;;
            mission-pins) node scripts/e2e/mission-pins.e2e.mjs /tmp/hu-proof/mission-pins ;;
            world-missions-guest) node scripts/e2e/world-missions-guest.e2e.mjs /tmp/hu-proof/world-missions-guest ;;
            world-first-visit) node scripts/e2e/world-first-visit.e2e.mjs /tmp/hu-proof/world-first-visit ;;
            world-gate) node scripts/e2e/world-gate.e2e.mjs /tmp/hu-proof/world-gate ;;
            sign-in) node scripts/e2e/sign-in.e2e.mjs /tmp/hu-proof/sign-in ;;
            world-countries) node scripts/e2e/world-countries.e2e.mjs /tmp/hu-proof/world-countries ;;
            world-globe-feed) node scripts/e2e/world-globe-feed.e2e.mjs /tmp/hu-proof/world-globe-feed ;;
            world-transport) node scripts/e2e/world-transport.e2e.mjs /tmp/hu-proof/world-transport ;;
            anti-social) node scripts/e2e/anti-social.e2e.mjs /tmp/hu-proof/anti-social ;;
            human-uprise-door) node scripts/e2e/human-uprise-door.e2e.mjs /tmp/hu-proof/human-uprise-door ;;
            policy-mode) node scripts/e2e/policy-mode.e2e.mjs /tmp/hu-proof/policy-mode ;;
            owner-halo-globe) node scripts/e2e/owner-halo-globe.e2e.mjs /tmp/hu-proof/owner-halo-globe ;;
            world-environment) node scripts/e2e/world-environment.mjs /tmp/hu-proof/world-environment ;;
            environment-globe) CESIUM_DIR=$CESIUM_DIR node scripts/e2e/environment-globe.e2e.mjs /tmp/hu-proof/environment-globe ;;
            environment-world) CESIUM_DIR=$CESIUM_DIR node scripts/e2e/environment-world.e2e.mjs /tmp/hu-proof/environment-world ;;
            environment-unit) node --test scripts/test/world-environment*.test.mjs scripts/test/environment-*.test.mjs scripts/test/globe-*.test.mjs ;;
            environment-plane) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/eup-environment-plane.integration.mjs ;;
            environment-store) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/eup-environment-events.integration.mjs ;;
            environment-owner) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/eup-environment-owner.integration.mjs ;;
            environment-control) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/e2e/control-eup-environment.e2e.mjs /tmp/hu-proof/environment-control ;;
            environment-ingest) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/eup-environment-ingest.integration.mjs ;;
            environment-timeline) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/eup-environment-timeline.integration.mjs ;;
            environment-timeline-world) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" CESIUM_DIR=$CESIUM_DIR node scripts/e2e/environment-timeline.e2e.mjs /tmp/hu-proof/environment-timeline-world ;;
            connections-consent) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/network-connections-consent.integration.mjs ;;
            mission-sources-store) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/mission-catalog-sources.integration.mjs ;;
            mission-sources-owner) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/test/mission-sources-owner.integration.mjs ;;
            mission-sources-control) PGLITE_MODULE="$PGLITE_DIR/@electric-sql/pglite/dist/index.js" node scripts/e2e/control-mission-sources.e2e.mjs /tmp/hu-proof/mission-sources-control ;;
            world-source-profile)
              node --test scripts/test/world-source-profile.test.mjs scripts/test/mission-areas.test.mjs
              node scripts/e2e/world-source-profile.e2e.mjs /tmp/hu-proof/world-source-profile
              ;;
            carry) node scripts/e2e/carry.e2e.mjs /tmp/hu-proof/carry ;;
            *) echo 'Unknown suite' >&2; exit 2 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: human-uprise-editorial-${{ github.run_id }}-${{ matrix.suite }}
          path: /tmp/hu-proof
          retention-days: 7
