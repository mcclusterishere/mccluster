name: Human Uprise responsive visual proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'mnet.html'
      - 'action-globe.html'
      - 'css/human-uprise-editorial.css'
      - 'css/globe-editorial.css'
      - 'css/world-travel.css'
      - 'css/member-desk.css'
      - 'css/world-audio-continuity.css'
      - 'js/travel/**'
      - 'data/travel/**'
      - 'js/analytics.js'
      - 'supabase/migrations/*travel_journeys*'
      - 'supabase/tests/travel_journeys.behaviour.sql'
      - 'scripts/test/travel-journeys-db.mjs'
      - 'js/mnet.js'
      - 'js/member-desk.js'
      - 'js/member-desk-core.js'
      - 'js/world-audio-continuity.js'
      - 'js/music-engine.js'
      - 'js/pip.js'
      - 'js/tabbar.js'
      - 'js/action-globe.js'
      - 'js/world-countries.js'
      - 'scripts/e2e/world-screen.e2e.mjs'
      - 'scripts/e2e/member-desk.e2e.mjs'
      - 'scripts/e2e/world-travel-guest.e2e.mjs'
      - 'scripts/e2e/music-world-continuity.e2e.mjs'
      - 'creator.html'
      - 'js/creator-onboarding.js'
      - 'scripts/e2e/creator-onboarding.e2e.mjs'
      - 'scripts/e2e/mission-pins.e2e.mjs'
      - 'css/action-globe.css'
      - 'css/world-countries.css'
      - 'css/halo.css'
      - 'js/world-space.js'
      - 'js/world-transport.js'
      - 'js/halo/**'
      - 'data/geo/**'
      - 'data/albums.json'
      - 'index.html'
      - 'listen.html'
      - 'music-creator.html'
      - 'account.html'
      - 'js/music-community.js'
      - 'js/music-creator-profile.js'
      - 'workers/mccluster/src/human-uprise/**'
      - 'workers/mccluster/src/company-site/**'
      - 'workers/mccluster/src/world-host.js'
      - 'scripts/e2e/world-switch.mjs'
      - 'scripts/e2e/world-countries.e2e.mjs'
      - 'scripts/e2e/world-globe-feed.e2e.mjs'
      - 'scripts/e2e/world-transport.e2e.mjs'
      - 'scripts/e2e/anti-social.e2e.mjs'
      - 'scripts/e2e/human-uprise-door.e2e.mjs'
      - 'scripts/e2e/owner-halo-globe.e2e.mjs'
      - '.github/workflows/human-uprise-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-uprise-editorial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [database, editorial, travel-iphone-portrait, travel-iphone-landscape, travel-ipad-portrait, travel-ipad-landscape, travel-desktop, guest-travel, member-desk, music-world, news-guest, navigation, creator-onboarding, mission-pins, world-countries, world-globe-feed, world-transport, anti-social, human-uprise-door, owner-halo-globe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare browser dependencies outside the repository
        run: |
          npm install --prefix /tmp/hu-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0 @electric-sql/pglite@0.3.14
          /tmp/hu-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check ${{ matrix.suite }} independently
        env:
          PLAYWRIGHT_DIR: /tmp/hu-qa/node_modules
          CESIUM_DIR: /tmp/hu-qa/node_modules/cesium/Build/Cesium
          PGLITE_DIR: /tmp/hu-qa/node_modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hu-proof
          case "${{ matrix.suite }}" in
            database) node scripts/test/travel-journeys-db.mjs ;;
            editorial) E2E_ONLY=editorial node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/world ;;
            travel-iphone-portrait) E2E_ONLY=travel-iphone-portrait node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-iphone-portrait ;;
            travel-iphone-landscape) E2E_ONLY=travel-iphone-landscape node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-iphone-landscape ;;
            travel-ipad-portrait) E2E_ONLY=travel-ipad-portrait node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-ipad-portrait ;;
            travel-ipad-landscape) E2E_ONLY=travel-ipad-landscape node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-ipad-landscape ;;
            travel-desktop) E2E_ONLY=travel-desktop node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel-desktop ;;
            guest-travel) node scripts/e2e/world-travel-guest.e2e.mjs /tmp/hu-proof/guest-travel ;;
            member-desk) node scripts/e2e/member-desk.e2e.mjs /tmp/hu-proof/member-desk ;;
            music-world) node scripts/e2e/music-world-continuity.e2e.mjs /tmp/hu-proof/music-world ;;
            news-guest) E2E_ONLY=news-guest node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/news-guest ;;
            navigation) node scripts/e2e/site-navigation.e2e.mjs /tmp/hu-proof/navigation ;;
            creator-onboarding) node scripts/e2e/creator-onboarding.e2e.mjs /tmp/hu-proof/creator-onboarding ;;
            mission-pins) node scripts/e2e/mission-pins.e2e.mjs /tmp/hu-proof/mission-pins ;;
            world-countries) node scripts/e2e/world-countries.e2e.mjs /tmp/hu-proof/world-countries ;;
            world-globe-feed) node scripts/e2e/world-globe-feed.e2e.mjs /tmp/hu-proof/world-globe-feed ;;
            world-transport) node scripts/e2e/world-transport.e2e.mjs /tmp/hu-proof/world-transport ;;
            anti-social) node scripts/e2e/anti-social.e2e.mjs /tmp/hu-proof/anti-social ;;
            human-uprise-door) node scripts/e2e/human-uprise-door.e2e.mjs /tmp/hu-proof/human-uprise-door ;;
            owner-halo-globe) node scripts/e2e/owner-halo-globe.e2e.mjs /tmp/hu-proof/owner-halo-globe ;;
            *) echo 'Unknown suite' >&2; exit 2 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: human-uprise-editorial-${{ github.run_id }}-${{ matrix.suite }}
          path: /tmp/hu-proof
          retention-days: 7
