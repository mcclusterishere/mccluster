name: Human Uprise responsive visual proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'mnet.html'
      - 'action-globe.html'
      - 'css/human-uprise-editorial.css'
      - 'css/globe-editorial.css'
      - 'css/world-travel.css'
      - 'css/member-desk.css'
      - 'css/world-audio-continuity.css'
      - 'js/travel/**'
      - 'data/travel/**'
      - 'js/analytics.js'
      - 'supabase/migrations/*travel_journeys*'
      - 'supabase/tests/travel_journeys.behaviour.sql'
      - 'scripts/test/travel-journeys-db.mjs'
      - 'js/mnet.js'
      - 'js/member-desk.js'
      - 'js/member-desk-core.js'
      - 'js/world-audio-continuity.js'
      - 'js/music-engine.js'
      - 'js/pip.js'
      - 'js/tabbar.js'
      - 'js/action-globe.js'
      - 'js/world-countries.js'
      - 'scripts/e2e/world-screen.e2e.mjs'
      - 'scripts/e2e/member-desk.e2e.mjs'
      - 'scripts/e2e/world-travel-guest.e2e.mjs'
      - 'scripts/e2e/music-world-continuity.e2e.mjs'
      - '.github/workflows/human-uprise-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-uprise-editorial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare browser dependencies outside the repository
        run: |
          npm install --prefix /tmp/hu-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0 @electric-sql/pglite@0.3.14
          /tmp/hu-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check phone, tablet, desktop and shared navigation
        env:
          PLAYWRIGHT_DIR: /tmp/hu-qa/node_modules
          CESIUM_DIR: /tmp/hu-qa/node_modules/cesium/Build/Cesium
          PGLITE_DIR: /tmp/hu-qa/node_modules
        run: |
          node scripts/test/travel-journeys-db.mjs
          E2E_ONLY=editorial node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/world
          E2E_ONLY=travel node scripts/e2e/world-screen.e2e.mjs /tmp/hu-proof/travel
          node scripts/e2e/world-travel-guest.e2e.mjs /tmp/hu-proof/guest-travel
          node scripts/e2e/member-desk.e2e.mjs /tmp/hu-proof/member-desk
          node scripts/e2e/music-world-continuity.e2e.mjs /tmp/hu-proof/music-world
          node scripts/e2e/site-navigation.e2e.mjs /tmp/hu-proof/navigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: human-uprise-editorial-${{ github.run_id }}
          path: /tmp/hu-proof
          retention-days: 7
