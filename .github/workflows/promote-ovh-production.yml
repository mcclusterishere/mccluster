name: Promote OVH Production Ref

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA already contained in main
        required: true
      expected_current:
        description: Exact SHA deploy/ovh-production holds now (the previous head this promotion replaces)
        required: true
      confirm:
        description: Type PROMOTE_OVH to authorize promotion
        required: true
      allow_rollback:
        description: Allow moving deployment ref backward to an older main commit
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

jobs:
  promote:
    if: ${{ inputs.confirm == 'PROMOTE_OVH' }}
    runs-on: ubuntu-latest
    # One ref move at a time. The lock is on this job, not on the workflow, so a
    # rollback is never queued behind the previous run's observation (up to 50 minutes).
    concurrency:
      group: promote-ovh-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate target commit
        env:
          TARGET_SHA: ${{ inputs.sha }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ && "${EXPECTED_CURRENT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "sha and expected_current must be exact 40-character lowercase commit SHAs" >&2
            exit 2
          }
          git fetch origin main deploy/ovh-production
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main || {
            echo "Target is not contained in main" >&2
            exit 2
          }
          CURRENT="$(git rev-parse origin/deploy/ovh-production)"
          # Exact previous-head check: the approval names the release it replaces.
          [[ "${CURRENT}" == "${EXPECTED_CURRENT}" ]] || {
            echo "deploy/ovh-production is ${CURRENT}, not the expected previous head ${EXPECTED_CURRENT}" >&2
            exit 4
          }
          if [[ "${ALLOW_ROLLBACK}" != "true" ]]; then
            git merge-base --is-ancestor "${CURRENT}" "${TARGET_SHA}" || {
              echo "Ref would move backward; set allow_rollback=true for an intentional rollback" >&2
              exit 3
            }
          fi

      - name: Validate Core at target
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${TARGET_SHA}"
          cd core
          npm run check
          npm test

      - name: Require every deploy-gate check green on the target commit
        env:
          TARGET_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs --sha "$TARGET_SHA"

      - name: Promote deployment ref
        env:
          TARGET_SHA: ${{ inputs.sha }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -euo pipefail
          # Forward only unless allow_rollback. Checked again here, next to the
          # push it protects, because the push below no longer relies on the
          # server refusing a non-fast-forward.
          if [[ "${ALLOW_ROLLBACK}" != "true" ]]; then
            git merge-base --is-ancestor "${EXPECTED_CURRENT}" "${TARGET_SHA}" || {
              echo "Ref would move backward; set allow_rollback=true for an intentional rollback" >&2
              exit 3
            }
          fi
          # The lease is the exact previous head, in both directions: if the ref
          # moved after validation, GitHub refuses the update.
          git push --force-with-lease="refs/heads/deploy/ovh-production:${EXPECTED_CURRENT}" \
            origin "${TARGET_SHA}:refs/heads/deploy/ovh-production"

      - name: Summary
        env:
          TARGET_SHA: ${{ inputs.sha }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
        run: |
          echo "### OVH promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- previous head: \`${EXPECTED_CURRENT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment ref: \`deploy/ovh-production\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- VPS outbound reconciler will pick this up automatically." >> "$GITHUB_STEP_SUMMARY"
          echo "- The observe job of this run watches https://core.mccluster.org/health serve the target for 20 minutes. A green run is not acceptance: runbook step 5 is." >> "$GITHUB_STEP_SUMMARY"

  # A ref moved with this workflow's GITHUB_TOKEN starts no other workflow, so
  # the push-triggered check in deploy-ovh-core.yml never runs for a promotion
  # made here. This job watches what the public broker serves after the move.
  # It is an observation, not acceptance: a release whose rollback was deferred
  # (producers did not drain) keeps serving the target, and no poll of /health
  # can tell that from a success. Acceptance is the runbook's step 5, from
  # host_health data (deployed_sha equal to the serving SHA, runtime_verification
  # verified). It holds no permission and no secret: it reads one public URL.
  observe:
    name: Observe the public serving SHA after promotion
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions: {}
    steps:
      - name: Wait for public /health to serve the exact commit, then keep serving it
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # deploy-ovh-core.sh writes the target's manifest and restarts the tool
          # broker BEFORE its health gate runs, so /health serves the target from
          # that restart even when the release then fails the gate and is rolled
          # back. One failing attempt can serve it for the gate's probes, a
          # producer drain of up to 660 s and the restore. So the target must be
          # served within converge_seconds and then stay served for hold_seconds,
          # longer than such an attempt. Any other commit served after the target
          # fails this step at once. An answer that names no commit is not counted.
          url=https://core.mccluster.org/health
          converge_seconds=1800
          hold_seconds=1200
          poll_seconds=10
          started=$SECONDS
          first_seen=""
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            body="$(curl --fail --silent --show-error --max-time 15 "$url" || true)"
            deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).deployment_sha||'')}catch{console.log('')}})")"
            if [[ "$deployed" == "$TARGET_SHA" ]]; then
              if [[ -z "$first_seen" ]]; then
                first_seen=$SECONDS
                echo "Attempt $attempt: public /health serves $TARGET_SHA; it must keep serving it for ${hold_seconds}s"
              elif (( SECONDS - first_seen >= hold_seconds )); then
                printf '%s\n' "$body"
                echo "Observed: public /health served $TARGET_SHA for $((SECONDS - first_seen))s and no other commit after it."
                echo "This is not acceptance. Runbook step 5 is: host_health deployed_sha equal to the serving SHA, and runtime_verification verified."
                exit 0
              fi
            elif [[ -n "$first_seen" && -n "$deployed" ]]; then
              echo "public /health served $deployed $((SECONDS - first_seen))s after it first served $TARGET_SHA: the release failed its deploy gate and was rolled back, or the ref moved again" >&2
              exit 1
            else
              echo "Attempt $attempt: expected $TARGET_SHA, got ${deployed:-<none>}"
            fi
            if [[ -z "$first_seen" ]] && (( SECONDS - started >= converge_seconds )); then
              echo "public /health did not serve $TARGET_SHA within ${converge_seconds}s" >&2
              exit 1
            fi
            if (( SECONDS - started >= converge_seconds + hold_seconds )); then
              echo "public /health served $TARGET_SHA but did not answer with it again after the ${hold_seconds}s hold" >&2
              exit 1
            fi
            sleep "$poll_seconds"
          done
