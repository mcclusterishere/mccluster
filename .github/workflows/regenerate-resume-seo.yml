name: Regenerate resume and SEO artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Regenerate canonical artifacts
        run: |
          node tools/build-profile-entity.mjs
          node tools/build-hire-schema.mjs
          node tools/build-newsroom.mjs
          node tools/build-sitemap.mjs
          node tools/build-resume.mjs
          node tools/build-it-resume.mjs
          node tools/build-digital-inclusion-resume.mjs
      - name: Verify generated artifacts
        run: |
          node tools/verify-resume.mjs
          node tools/verify-it-resume.mjs
          node tools/verify-digital-inclusion-resume.mjs
          node --test scripts/test/resume-docx-sync.test.mjs scripts/test/seo-authority.test.mjs
      - name: Upload generated artifacts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regenerated-resume-seo
          path: |
            matthew-mccluster.html
            data/seo/
            assets/resume/
          retention-days: 7
