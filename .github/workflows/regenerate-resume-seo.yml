name: Regenerate resume and SEO artifacts
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.head_ref == 'cleanup/resume-seo-artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Regenerate canonical artifacts
        run: |
          node tools/build-profile-entity.mjs
          node tools/build-hire-schema.mjs
          node tools/build-newsroom.mjs
          node tools/build-sitemap.mjs
          node tools/build-resume.mjs
          node tools/build-it-resume.mjs
      - name: Verify generated artifacts
        run: |
          node tools/verify-resume.mjs
          node tools/verify-it-resume.mjs
          node --test scripts/test/resume-docx-sync.test.mjs scripts/test/seo-authority.test.mjs
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matthew-mccluster.html data/seo assets/resume
          git commit -m "Regenerate resume and SEO artifacts"
          git push origin HEAD:${{ github.head_ref }}
