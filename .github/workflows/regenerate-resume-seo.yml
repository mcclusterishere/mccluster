name: Regenerate resume and SEO artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Regenerate canonical artifacts
        run: |
          node tools/build-profile-entity.mjs
          node tools/build-hire-schema.mjs
          node tools/build-newsroom.mjs
          node tools/build-sitemap.mjs
          node tools/build-resume.mjs
          node tools/build-it-resume.mjs
      - name: Verify generated artifacts
        run: |
          node tools/verify-resume.mjs
          node tools/verify-it-resume.mjs
          node --test scripts/test/resume-docx-sync.test.mjs scripts/test/seo-authority.test.mjs
      - name: Upload generated artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regenerated-resume-seo
          path: |
            matthew-mccluster.html
            data/seo/
            assets/resume/
          retention-days: 7
