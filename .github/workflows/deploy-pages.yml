name: Deploy live site from McCluster

# matthew.mccluster.org and mccluster.org ship from THIS repo.
# Do not publish those hosts from mcclusterishere/Here.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  checks: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: workers/mccluster/.node-version

      # Mandatory production gate, authorized in the 2026-10-31 release work.
      - name: Require every deploy-gate check green on this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs --sha "$GITHUB_SHA"

      # BEFORE the stamp step: stamping rewrites every page, after which each
      # file's last commit would be the stamp commit and every lastmod would
      # read "today". Here the dates are still each page's real last commit.
      # Non-fatal: if it cannot run, the committed map ships as it is.
      - name: Date the sitemap from each page's last commit
        continue-on-error: true
        run: node tools/build-sitemap.mjs

      - name: Stamp asset versions so every deploy busts browser caches
        run: |
          # Pages, scripts and stylesheets all carry ?v=__STAMP__ asset URLs:
          # js/tabbar.js alone loads five, js/travel/world-travel.mjs one, and
          # sw.js keys its cache on the stamp. vendor/ is third-party and is
          # never stamped. Directories stripped below are stamped too; that
          # is harmless, and keeps the rule one line.
          find . -path ./node_modules -prune -o -path ./apps -prune -o -path ./vendor -prune -o \
            \( -name '*.html' -o -name '*.js' -o -name '*.mjs' -o -name '*.css' \) -print0 \
            | xargs -0 sed -i "s/__STAMP__/${GITHUB_SHA::12}/g"
          if grep -rl --include='*.html' --include='*.js' --include='*.mjs' --include='*.css' \
               --exclude-dir=node_modules --exclude-dir=apps --exclude-dir=vendor --exclude-dir=.git \
               '__STAMP__' . ; then
            echo "::error::__STAMP__ survived the stamp step"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -am "Stamp asset versions for deploy" --allow-empty

      - name: Promote the Site 0 game into the web root
        env:
          STAMP: ${{ github.sha }}
        run: |
          if [ -x ./tools/publish-site0.sh ]; then
            ./tools/publish-site0.sh
            git add -f site0 || true
          fi

      - name: Build detailed Equity Uprise floors
        run: |
          python -m pip install --disable-pip-version-check numpy scipy trimesh
          python docs/design/equity-uprise-building/production/basement-b1/build_equity_uprise_basement_b1_v2.py
          python docs/design/equity-uprise-building/production/floor-01/build_equity_uprise_floor_01_v2.py
          python docs/design/equity-uprise-building/production/floor-02/build_equity_uprise_floor_02_v2.py
          python docs/design/equity-uprise-building/production/floor-03/build_equity_uprise_floor_03_v2.py
          python docs/design/equity-uprise-building/production/floor-04/build_equity_uprise_floor_04_v2.py
          python docs/design/equity-uprise-building/production/floor-05/build_equity_uprise_floor_05_v2.py
          python docs/design/equity-uprise-building/production/floor-06/build_equity_uprise_floor_06_v2.py
          python docs/design/equity-uprise-building/production/floor-07/build_equity_uprise_floor_07_v2.py
          python docs/design/equity-uprise-building/production/facade/build_equity_uprise_facade_v2.py
          python docs/design/equity-uprise-building/production/services/build_equity_uprise_services_v2.py
          python docs/design/equity-uprise-building/production/build_equity_uprise_building_v2.py
          python docs/design/equity-uprise-building/production/audit_vertical_circulation_walkability.py

      - name: Verify Equity Uprise Services Step 8 deploy contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/design/equity-uprise-building/production/generated/equity-uprise-building-services-core-v2-report.json")
          r=json.loads(p.read_text())
          assert r.get("status")=="services-step8-whole-building-verified", r.get("status")
          assert r.get("passed") is True
          assert r.get("checks_failed")==0
          assert r.get("b1_riser_connections")==9
          assert r.get("b1_distribution_segments",0)>0
          assert r.get("step4_levels")==[1,2,3]
          assert r.get("step5_levels")==[4,5,6,7]
          assert r.get("step4_floor_branch_segments",0)>0
          assert r.get("step5_floor_branch_segments",0)>0
          assert r.get("step5_floor_endpoints",0)>0
          assert r.get("step6_level")==7
          assert r.get("step6_mechanical_units_served")==3
          assert r.get("step6_roof_drains")==6
          assert r.get("step6_path_lights")==14
          assert r.get("step6_stair_sconces")==4
          assert r.get("step6_emergency_calls")==2
          assert r.get("step6_fire_support_points")==2
          assert r.get("step6_lightning_terminals")==4
          assert r.get("step6_lightning_conductor_segments")==4
          assert r.get("step6_service_screen_routes",0)>=2
          assert r.get("step6_roof_termination_devices",0)>0
          assert r.get("step7_levels")==[1,2,3,4,5,6]
          assert r.get("step7_device_meshes",0)>=220
          assert r.get("step7_electrical_panels")==6
          assert r.get("step7_data_racks")==6
          assert r.get("step7_cable_trays")==12
          assert r.get("step7_conduit_drops")==12
          assert r.get("step7_diffusers")==24
          assert r.get("step7_return_grilles")==12
          assert r.get("step7_detectors")==24
          assert r.get("step7_strobes")==12
          assert r.get("step7_extinguishers")==12
          assert r.get("step7_access_readers")==6
          assert r.get("step7_intercoms")==6
          assert r.get("step7_cameras")==12
          assert r.get("step7_receptacles")==24
          assert r.get("step7_floor_boxes")==12
          assert r.get("step7_valves")==12
          assert r.get("step7_access_panels")==18
          assert r.get("step7_plumbing_connections")==12
          assert r.get("step8_branch_records")==24
          assert r.get("step8_branch_segments",0)>0
          assert r.get("step8_endpoints")==24
          assert r.get("step8_traceability_systems_total")==14
          assert r.get("step8_traceability_systems_passing")==14
          assert r.get("step8_traceability_complete") is True
          assert r.get("step8_whole_route_core_clashes")==0
          assert r.get("step8_viewer_status_current") is True
          assert r.get("final_services_gate") is True
          print("Services Step 8 deploy contract verified", r["sha256"])
          PY

      - name: Verify Equity Uprise Lab Runtime Step 8 viewer integration
        run: node docs/design/equity-uprise-building/production/lab-runtime/verify_viewer_lab_integration_v1.mjs

      - name: Publish Equity Uprise preview assets
        run: |
          mkdir -p equity-uprise-preview
          cp docs/design/equity-uprise-building/production/building-core-v2.json equity-uprise-preview/building-core-v2.json
          cp docs/design/equity-uprise-building/production/core-v2-floor-programs.json equity-uprise-preview/core-v2-floor-programs.json
          cp docs/design/equity-uprise-building/production/basement-b1-program.json equity-uprise-preview/basement-b1-program.json
          cp docs/design/equity-uprise-building/production/facade-system-core-v2.json equity-uprise-preview/facade-system-core-v2.json
          cp docs/design/equity-uprise-building/production/facade/facade-module-inventory.json equity-uprise-preview/facade-module-inventory.json
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-facade-core-v2.glb equity-uprise-preview/equity-uprise-facade-core-v2.glb
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-facade-core-v2-report.json equity-uprise-preview/equity-uprise-facade-core-v2-report.json
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-building-services-core-v2.glb equity-uprise-preview/equity-uprise-building-services-core-v2.glb
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-building-services-core-v2-report.json equity-uprise-preview/equity-uprise-building-services-core-v2-report.json
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-basement-b1-core-v2.glb equity-uprise-preview/equity-uprise-basement-b1-core-v2.glb
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-basement-b1-core-v2-report.json equity-uprise-preview/equity-uprise-basement-b1-core-v2-report.json
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-building-core-v2.glb equity-uprise-preview/equity-uprise-building-core-v2.glb
          for n in 01 02 03 04 05 06 07; do
            cp docs/design/equity-uprise-building/production/generated/equity-uprise-floor-${n}-core-v2.glb equity-uprise-preview/equity-uprise-floor-${n}-core-v2.glb
            cp docs/design/equity-uprise-building/production/generated/equity-uprise-floor-${n}-core-v2-report.json equity-uprise-preview/equity-uprise-floor-${n}-core-v2-report.json
          done
          cp docs/design/equity-uprise-building/production/generated/equity-uprise-vertical-circulation-walkability-report.json equity-uprise-preview/equity-uprise-vertical-circulation-walkability-report.json
          cp docs/design/equity-uprise-building/references/floor-01/equity-uprise-floor-01-core-v2-schematic-v1.png equity-uprise-preview/floor-01-plan.png
          cp docs/design/equity-uprise-building/references/floor-01/equity-uprise-floor-01-core-v2-schematic-v1.svg equity-uprise-preview/floor-01-plan.svg
          cp docs/design/equity-uprise-building/references/floor-01-site/equity-uprise-floor-01-site-egress-core-v2-schematic-v1.png equity-uprise-preview/floor-01-site-egress.png
          cp docs/design/equity-uprise-building/references/floor-01-site/equity-uprise-floor-01-site-egress-core-v2-schematic-v1.svg equity-uprise-preview/floor-01-site-egress.svg
          mkdir -p equity-uprise-preview/lab-runtime equity-uprise-preview/electronics
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-fabric-v1.glb equity-uprise-preview/equity-uprise-electronics-fabric-v1.glb
          cp docs/design/equity-uprise-building/production/electronics/equity-uprise-electronics-spatial-bindings-v1.mjs equity-uprise-preview/electronics/
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-manifest-v1.json equity-uprise-preview/equity-uprise-electronics-manifest-v1.json
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-device-components-v1.json equity-uprise-preview/equity-uprise-device-components-v1.json
          cp docs/design/equity-uprise-building/production/electronics/device-archetypes-v1.json equity-uprise-preview/electronics/device-archetypes-v1.json
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-connections-v1.json equity-uprise-preview/equity-uprise-electronics-connections-v1.json
          cp docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-it-lab-catalog-v1.json equity-uprise-preview/equity-uprise-it-lab-catalog-v1.json
          cp docs/design/equity-uprise-building/production/asset-registry/generated/equity-uprise-asset-registry-v1.json equity-uprise-preview/equity-uprise-asset-registry-v1.json
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-digital-twin-program.json equity-uprise-preview/floor-01-digital-twin-program.json
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-simulation-objects.json equity-uprise-preview/floor-01-simulation-objects.json
          cp docs/design/equity-uprise-building/production/floor-01/floor-01-object-inventory.json equity-uprise-preview/floor-01-object-inventory.json
          cp docs/design/equity-uprise-development/competency-rubrics.json equity-uprise-preview/competency-rubrics.json
          cp docs/design/equity-uprise-development/FEDERAL-TRAINING-BINDINGS.json equity-uprise-preview/federal-training-bindings.json
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-lab-runtime.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-electronics-sandbox.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-guided-scenarios.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-building-ops-runtime.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-public-service-runtime.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-assessment-runtime.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-difficulty-runtime.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/equity-uprise-viewer-lab-integration.mjs equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/cisa-itot-scenario-pack-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/distributed-building-scenario-pack-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/fema-building-ops-scenario-pack-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/public-service-scenario-pack-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/difficulty-progression-policy-v1.json equity-uprise-preview/lab-runtime/
          cp docs/design/equity-uprise-building/production/lab-runtime/learner-experience-v1.json equity-uprise-preview/lab-runtime/

      - name: Strip the internals out of the published tree
        run: |
          # Everything on these two lines is source, infrastructure, tooling or
          # agent instruction that no published page loads. The directory line
          # must agree with the Cloudflare export allowlist in
          # scripts/stage-cloudflare-pages.mjs; scripts/test/publish-strip-parity.test.mjs
          # derives the expectation from that allowlist and fails when the two
          # drift. Keep each rm on ONE line: the test parses them. data/ stays
          # whole: control.html fetches data/analytics/application-schema-inventory.json
          # at runtime. assets/3d/prim3-site0 is Site 0 authoring geometry;
          # tools/publish-site0.sh promotes the runtime build into site0/ instead.
          rm -rf docs packages apps scripts supabase .github tests node_modules redirects tools _unfinished workers platform core native PRIM3 dns audit .cursor assets/3d/prim3-site0
          rm -f README.md wrangler.toml wrangler.jsonc package.json package-lock.json AGENTS.md CLAUDE.md CODEX.md GEMINI.md .cursorrules .mcp.json CITATION.cff
          git add -A
          git commit -m "Publish: web root only, internals stripped" --allow-empty

          fail=0
          if grep -rniE 'tapstitch|printful|printify|gelato|apliiq|teespring|gooten|customcat' \
               --exclude-dir=.git . ; then
            echo "::error::a maker is named in the published tree"
            fail=1
          fi
          if [ -d data ] && grep -rnE '"(blank|cost|markup|printMarkup|landed|handling|printCost)"[[:space:]]*:[[:space:]]*[0-9]' \
               data/ ; then
            echo "::error::a public ledger carries a cost"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1

      - name: Push to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force

  # Reports on the live site after the publish; it never gates the publish.
  # GitHub Pages builds gh-pages asynchronously and its CDN caches for ten
  # minutes, so the first step waits for this commit's stamp to go live.
  verify-live:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE: https://matthew.mccluster.org
    steps:
      - name: Wait for the live site to serve this deploy
        run: |
          stamp="${GITHUB_SHA::12}"
          for attempt in $(seq 1 40); do
            if curl -fsSL --max-time 30 "$SITE/index.html?verify=$stamp-$attempt" | grep -q "$stamp"; then
              echo "index.html serves stamp $stamp (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: stamp $stamp is not live yet"
            sleep 15
          done
          echo "::error::$SITE did not serve stamp $stamp within ten minutes"
          exit 1

      - name: Published JavaScript is stamped
        run: |
          stamp="${GITHUB_SHA::12}"
          body="$(curl -fsSL --max-time 30 "$SITE/js/tabbar.js?verify=$stamp")"
          if printf '%s' "$body" | grep -q '__STAMP__'; then
            echo "::error::js/tabbar.js still carries a literal __STAMP__"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q "$stamp"; then
            echo "::error::js/tabbar.js does not carry stamp $stamp"
            exit 1
          fi
          echo "js/tabbar.js is stamped $stamp"

      - name: Private paths answer 404
        run: |
          stamp="${GITHUB_SHA::12}"
          fail=0
          for path in \
            /platform/package.json \
            /core/package.json \
            /.mcp.json \
            /dns/mccluster.org.zone \
            /native/package.json \
            /PRIM3/game/halo/README.md \
            /.cursorrules \
            /.cursor/rules/mccluster.mdc \
            /apps/api/package.json \
            /docs/control-plane/ECOSYSTEM.md \
            /assets/3d/prim3-site0/PRIM3_Site0_CANONICAL_ARCHITECTURE_v03.json \
            /package.json \
            /CLAUDE.md
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE$path?verify=$stamp")"
            if [ "$code" = "404" ]; then
              echo "$path -> 404"
            else
              echo "::error::$path answered $code, expected 404"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
