name: Verify or manually deploy McCluster Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/mccluster/**'
      - 'workers/mccluster-mcp/src/**'
      - 'scripts/mcp-contract-check.mjs'
      - 'scripts/worker-deployment-state.mjs'
      - 'scripts/worker-build-provenance.mjs'
      - '.github/workflows/deploy-mccluster-worker.yml'
  workflow_dispatch: {}
  # The CI-gated production path (docs/control-plane/DEPLOYMENT-CONTROLS-PROPOSAL.md).
  # INERT until the owner sets the repository variable WORKER_DEPLOY_MODE to
  # 'github-gated', which they do only after disconnecting Cloudflare Workers
  # Builds auto-deploy for mccluster; otherwise both would deploy.
  workflow_run:
    workflows: ['MCP Continuity and Preview']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-mccluster-worker-main
  cancel-in-progress: false

jobs:
  verify-git-deploy:
    name: Verify Cloudflare Git deployment
    if: ${{ github.event_name == 'push' && vars.WORKER_DEPLOY_MODE != 'github-gated' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/mccluster/.node-version
      - name: Verify source contract before observing production
        run: |
          set -euo pipefail
          node --test workers/mccluster/test/core-mcp-continuity.test.mjs
          node --test workers/mccluster/test/core-bridge.test.mjs
          node --test workers/mccluster/test/core-oauth-resource.test.mjs
          node --test workers/mccluster-mcp/test/*.test.mjs scripts/test/*.test.mjs
      - name: Wait for Cloudflare Git to serve this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl --fail --silent --show-error --max-time 15 https://api.mccluster.org/v1/health || true)"
            deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).deployment_sha||'')}catch{console.log('')}})")"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              printf '%s\n' "$body"
              echo "Verified Cloudflare Git is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $GITHUB_SHA, got ${deployed:-<none>}"
            sleep 10
          done
          echo "Cloudflare Git deployment did not converge to $GITHUB_SHA" >&2
          exit 1
      - name: Verify remote MCP contract
        run: node scripts/mcp-contract-check.mjs --base https://api.mccluster.org --sha "$GITHUB_SHA"
      - name: Verify platform capability fingerprint
        shell: bash
        run: |
          curl --fail --silent --show-error https://api.mccluster.org/v1/health | node -e "
          let d='';
          process.stdin.on('data',c=>d+=c).on('end',()=>{
            const j=JSON.parse(d), c=j.capabilities||{};
            const required=['platform_api','compute_gateway','api_rate_limit','atomic_metering','provider_cogs_reconciliation','byok_fail_closed'];
            const missing=required.filter(k=>c[k]!==true);
            if(missing.length){ console.error('Missing capability flags:', missing.join(',')); process.exit(1); }
            console.log('Cloudflare Git deployment verified.');
          });
          "
      # Cloudflare Git deployed this commit without waiting for CI. This step
      # cannot stop that; it makes the gap visible: the run goes red when the
      # commit production is now serving did not pass the required checks.
      - name: Report whether production is serving a CI-green commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs --sha "$GITHUB_SHA"

  deploy:
    name: Staged deploy and verify api.mccluster.org
    # Manual dispatch, or the CI-gated path once the owner opts in.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           vars.WORKER_DEPLOY_MODE == 'github-gated' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The exact commit this run ships: the CI-passed commit for the gated
      # path, the dispatched main commit for a manual run.
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/mccluster/.node-version

      - name: Require production source branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF" = refs/heads/main

      # Never ship an older commit over a newer one: a CI run that finishes
      # after main has moved on is superseded, and the newer commit's own CI
      # completion deploys it.
      - name: Require the exact commit to still be the tip of main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          tip="$(git rev-parse origin/main)"
          if [ "$tip" != "$TARGET_SHA" ]; then
            echo "Refusing: $TARGET_SHA is no longer the tip of main ($tip). Its own CI completion deploys the newer commit." >&2
            exit 1
          fi

      - name: Require every deploy-gate check green on this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs --sha "$TARGET_SHA"

      - name: Install locked Worker dependencies
        working-directory: workers/mccluster
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      # The CLI comes from package-lock.json (exact devDependency), never from
      # a registry download at deploy time. --no-install fails instead of
      # fetching when the locked binary is absent.
      - name: Verify the locked Wrangler CLI
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').devDependencies.wrangler")"
          actual="$(npx --no-install wrangler --version | awk '{print $NF}')"
          test "$actual" = "$expected" || {
            echo "Wrangler version mismatch: expected $expected got $actual" >&2
            exit 1
          }

      # THE GUARD THAT MAKES THE REGRESSION IMPOSSIBLE.
      #
      # An earlier version of this workflow deployed on every push touching
      # workers/mccluster/**. That is exactly how a main without /v1/core/mcp replaced an
      # MCP-capable production Worker and turned a live connector into a 404.
      # The continuity suite fails on a source tree that has lost the MCP or
      # OAuth surface, and it runs here — before the deploy — so such a tree
      # can never reach Cloudflare.
      - name: Guard the remote MCP surface (pre-deploy)
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          node --test test/core-mcp-continuity.test.mjs
          node --test test/core-bridge.test.mjs
          node --test test/core-oauth-resource.test.mjs
          node --test ../mccluster-mcp/test/*.test.mjs ../../scripts/test/*.test.mjs

      # STAGED DEPLOY: upload, promote, verify, roll back on failure.
      #
      # `wrangler deploy` promotes in one step, so a post-deploy check can
      # only ever tell you production is already broken. The pinned CLI
      # (4.131.1) supports versioned deploys, so the upload and the traffic
      # switch are separated: the new version is built and stored without
      # serving anyone, the previously serving version is recorded as a
      # rollback target, and only then does traffic move.
      - name: Record the currently serving version (rollback target)
        id: rollback_target
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments list --json > /tmp/worker-before.json
          allocation="$(node ../../scripts/worker-deployment-state.mjs capture /tmp/worker-before.json /tmp/worker-rollback.json)"
          echo "allocation=$allocation" >> "$GITHUB_OUTPUT"
          echo "Recorded complete rollback traffic allocation."

      # Uploads and stamps provenance WITHOUT taking traffic. --tag lets the
      # promote step resolve this exact build by commit SHA instead of
      # scraping a version id out of stdout.
      - name: Upload new Worker version (not serving)
        working-directory: workers/mccluster
        run: >-
          npx --no-install wrangler versions upload
          --tag ${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          --message "GitHub Actions ${TARGET_SHA}"
          --var DEPLOY_SHA:${TARGET_SHA}
          --var DEPLOY_REF:main

      - name: Refuse a concurrent external deployment
        working-directory: workers/mccluster
        run: |
          npx --no-install wrangler deployments list --json > /tmp/worker-pre-promote.json
          node ../../scripts/worker-deployment-state.mjs verify /tmp/worker-pre-promote.json /tmp/worker-rollback.json

      - name: Promote the new version to 100% traffic
        id: promote
        working-directory: workers/mccluster
        run: >-
          npx --no-install wrangler versions deploy
          --version-tag ${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@100
          --message "Promote ${TARGET_SHA}"
          --yes

      - name: Verify deployed commit fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --max-time 15 https://api.mccluster.org/v1/health || true)"
            deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).deployment_sha||'')}catch{console.log('')}})")"
            if [ "$deployed" = "$TARGET_SHA" ]; then
              printf '%s\n' "$body"
              echo "Verified api.mccluster.org is serving $TARGET_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $TARGET_SHA, got ${deployed:-<none>}"
            sleep 10
          done
          echo 'Deployment fingerprint verification failed.'
          exit 1

      # Source tests prove the route was in the tree that was built. This
      # proves it is in the thing now answering the internet — including that
      # an unauthenticated tools/list challenges with OAuth instead of
      # returning the 404 that tells a client the server is gone.
      - name: Verify remote MCP contract (post-deploy)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mcp-contract-check.mjs \
            --base https://api.mccluster.org \
            --sha "$TARGET_SHA"

      - name: Verify core capability flags
        shell: bash
        run: |
          curl --fail --silent --show-error https://api.mccluster.org/v1/health | node -e "
          let d='';
          process.stdin.on('data',c=>d+=c).on('end',()=>{
            const j=JSON.parse(d);
            const c=j.capabilities||{};
            const required=['platform_api','compute_gateway','api_rate_limit','atomic_metering','provider_cogs_reconciliation','byok_fail_closed'];
            const missing=required.filter(k=>c[k]!==true);
            if(missing.length){ console.error('Missing capability flags:', missing.join(',')); process.exit(1); }
            console.log('Core capability fingerprint verified.');
          });
          "

      # ROLLBACK RUNS LAST, AFTER EVERY VERIFICATION.
      #
      # Placement is the whole correctness argument. GitHub Actions runs
      # steps in order, so a rollback sitting mid-list is evaluated before
      # the verifications below it have run: a failure in the LAST check
      # would find the rollback step already behind it and leave the bad
      # version serving. `if: failure()` is true for any earlier failure,
      # so placing this after every verification covers all of them —
      # fingerprint, MCP contract and capability flags alike.
      - name: Roll back to the last known-good version
        if: failure() && steps.promote.outcome != 'skipped' && steps.rollback_target.outputs.allocation != ''
        env:
          ROLLBACK_ALLOCATION: ${{ steps.rollback_target.outputs.allocation }}
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          read -r -a versions <<< "$ROLLBACK_ALLOCATION"
          npx --no-install wrangler versions deploy "${versions[@]}" \
            --message "Automatic rollback from ${TARGET_SHA}" --yes
          npx --no-install wrangler deployments list --json > /tmp/worker-restored.json
          node ../../scripts/worker-deployment-state.mjs verify /tmp/worker-restored.json /tmp/worker-rollback.json
          echo 'Previous traffic allocation restored and verified.'

      - name: Warn when no rollback target existed
        if: failure() && steps.promote.outcome != 'skipped' && steps.rollback_target.outputs.allocation == ''
        run: |
          echo '::error::Verification failed and no previous version was recorded — production may be serving a bad build. Roll back manually with: wrangler versions list && wrangler versions deploy <id>@100 --yes'
