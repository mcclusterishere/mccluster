name: Deploy McCluster Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/mccluster/**'
      - '.github/workflows/deploy-mccluster-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-mccluster-worker-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify api.mccluster.org
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.131.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Verify pinned Wrangler CLI
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          actual="$(npx --yes "wrangler@${WRANGLER_VERSION}" --version | awk '{print $NF}')"
          test "$actual" = "$WRANGLER_VERSION" || {
            echo "Wrangler version mismatch: expected $WRANGLER_VERSION got $actual" >&2
            exit 1
          }

      # THE GUARD THAT MAKES THE REGRESSION IMPOSSIBLE.
      #
      # This workflow deploys on every push touching workers/mccluster/**.
      # That is exactly how a main without /v1/core/mcp replaced an
      # MCP-capable production Worker and turned a live connector into a 404.
      # The continuity suite fails on a source tree that has lost the MCP or
      # OAuth surface, and it runs here — before the deploy — so such a tree
      # can never reach Cloudflare.
      - name: Guard the remote MCP surface (pre-deploy)
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          node --test test/core-mcp-continuity.test.mjs
          node --test test/core-bridge.test.mjs
          node --test test/core-oauth-resource.test.mjs

      # STAGED DEPLOY: upload, promote, verify, roll back on failure.
      #
      # `wrangler deploy` promotes in one step, so a post-deploy check can
      # only ever tell you production is already broken. The pinned CLI
      # (4.131.1) supports versioned deploys, so the upload and the traffic
      # switch are separated: the new version is built and stored without
      # serving anyone, the previously serving version is recorded as a
      # rollback target, and only then does traffic move.
      - name: Record the currently serving version (rollback target)
        id: rollback_target
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          current="$(npx --yes wrangler@4.131.1 deployments list --json 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try{
                  const list=JSON.parse(d);
                  const latest=Array.isArray(list)?list[0]:null;
                  const version=latest?.versions?.[0]?.version_id||latest?.version_id||'';
                  console.log(version);
                }catch{console.log('')}
              })" || true)"
          echo "version_id=${current}" >> "$GITHUB_OUTPUT"
          if [ -n "$current" ]; then
            echo "Rollback target: $current"
          else
            echo 'No previous version found — rollback will not be available for this run.'
          fi

      # Uploads and stamps provenance WITHOUT taking traffic. --tag lets the
      # promote step resolve this exact build by commit SHA instead of
      # scraping a version id out of stdout.
      - name: Upload new Worker version (not serving)
        working-directory: workers/mccluster
        run: >-
          npx --yes wrangler@4.131.1 versions upload
          --tag ${GITHUB_SHA}
          --message "GitHub Actions ${GITHUB_SHA}"
          --var DEPLOY_SHA:${GITHUB_SHA}
          --var DEPLOY_REF:${GITHUB_REF_NAME}

      - name: Promote the new version to 100% traffic
        working-directory: workers/mccluster
        run: >-
          npx --yes wrangler@4.131.1 versions deploy
          --version-tag ${GITHUB_SHA}@100
          --message "Promote ${GITHUB_SHA}"
          --yes

      - name: Verify deployed commit fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --max-time 15 https://api.mccluster.org/v1/health || true)"
            deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).deployment_sha||'')}catch{console.log('')}})")"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              printf '%s\n' "$body"
              echo "Verified api.mccluster.org is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $GITHUB_SHA, got ${deployed:-<none>}"
            sleep 10
          done
          echo 'Deployment fingerprint verification failed.'
          exit 1

      # Source tests prove the route was in the tree that was built. This
      # proves it is in the thing now answering the internet — including that
      # an unauthenticated tools/list challenges with OAuth instead of
      # returning the 404 that tells a client the server is gone.
      - name: Verify remote MCP contract (post-deploy)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mcp-contract-check.mjs \
            --base https://api.mccluster.org \
            --sha "$GITHUB_SHA"

      # If any verification above failed, production is serving a build that
      # does not meet its contract. Put the last known-good version back
      # before the job reports failure, so the outage lasts for the length of
      # one check rather than until a human wakes up.
      - name: Roll back to the last known-good version
        if: failure() && steps.rollback_target.outputs.version_id != ''
        working-directory: workers/mccluster
        shell: bash
        run: |
          set -euo pipefail
          echo "Verification failed. Rolling back to ${{ steps.rollback_target.outputs.version_id }}"
          npx --yes wrangler@4.131.1 versions deploy \
            "${{ steps.rollback_target.outputs.version_id }}@100" \
            --message "Automatic rollback from ${GITHUB_SHA}" \
            --yes
          echo 'Rolled back. The failing build was NOT left in production.'

      - name: Warn when no rollback target existed
        if: failure() && steps.rollback_target.outputs.version_id == ''
        run: |
          echo '::error::Verification failed and no previous version was recorded — production may be serving a bad build. Roll back manually with: wrangler versions list && wrangler versions deploy <id>@100 --yes'

      - name: Verify core capability flags
        shell: bash
        run: |
          curl --fail --silent --show-error https://api.mccluster.org/v1/health | node -e "
          let d='';
          process.stdin.on('data',c=>d+=c).on('end',()=>{
            const j=JSON.parse(d);
            const c=j.capabilities||{};
            const required=['platform_api','compute_gateway','api_rate_limit','atomic_metering','provider_cogs_reconciliation','byok_fail_closed'];
            const missing=required.filter(k=>c[k]!==true);
            if(missing.length){ console.error('Missing capability flags:', missing.join(',')); process.exit(1); }
            console.log('Core capability fingerprint verified.');
          });
          "
