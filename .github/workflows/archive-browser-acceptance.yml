name: Archive and mission browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'cohort-claim.html'
      - 'cohort-profile.html'
      - 'docket-516r-cohort.html'
      - 'css/cohort-account.css'
      - 'css/docket-cohort-showcase.css'
      - 'js/cohort-claim.js'
      - 'js/cohort-profile.js'
      - 'js/docket-cohort-showcase.js'
      - 'js/mission-swipe-deck.js'
      - 'scripts/e2e/cohort-claim.e2e.mjs'
      - 'scripts/e2e/docket-cohort-showcase.e2e.mjs'
      - 'scripts/e2e/mission-swipe.e2e.mjs'
      - 'live-mission.html'
      - 'js/live-mission-capture.js'
      - 'scripts/e2e/live-mission-capture.e2e.mjs'
      - 'workers/mccluster/src/preflight.js'
      - 'workers/mccluster/src/action-archive.js'
      - '.github/workflows/archive-browser-acceptance.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser runtime outside the repository
        run: |
          npm install --prefix /tmp/archive-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0
          /tmp/archive-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual browser claim, archive and mission interactions
        env:
          PLAYWRIGHT_DIR: /tmp/archive-qa/node_modules
        run: |
          set -euo pipefail
          node --test workers/mccluster/test/preflight.test.mjs workers/mccluster/test/action-archive.test.mjs
          node scripts/e2e/cohort-claim.e2e.mjs /tmp/archive-proof/claim
          node scripts/e2e/docket-cohort-showcase.e2e.mjs /tmp/archive-proof/showcase
          node scripts/e2e/mission-swipe.e2e.mjs /tmp/archive-proof/mission
          node scripts/e2e/live-mission-capture.e2e.mjs /tmp/archive-proof/live-mission
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: archive-browser-${{ github.run_id }}
          path: /tmp/archive-proof
          retention-days: 7
