name: Control Plane Drift Guard

on:
  pull_request:
    paths:
      - "core/**"
      - "supabase/migrations/**"
      - "supabase/replay_migrations/**"
      - "scripts/supabase-local-reset-with-replay.sh"
      - "supabase/production-ledger.json"
      - "scripts/deploy-ovh-core.sh"
      - "scripts/ovh-core-health.sh"
      - "scripts/mccluster-vps-reconcile.sh"
      - "scripts/control-plane-drift-contract-check.mjs"
      - ".github/workflows/control-plane-drift-guard.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "supabase/migrations/**"
      - "supabase/replay_migrations/**"
      - "scripts/supabase-local-reset-with-replay.sh"
      - "supabase/production-ledger.json"
      - "scripts/deploy-ovh-core.sh"
      - "scripts/ovh-core-health.sh"
      - "scripts/mccluster-vps-reconcile.sh"
      - "scripts/control-plane-drift-contract-check.mjs"

permissions:
  contents: read

jobs:
  drift-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source-of-truth contract
        run: node scripts/control-plane-drift-contract-check.mjs

      - name: Validate reconciler and deployer syntax
        run: |
          bash -n scripts/mccluster-vps-reconcile.sh
          bash -n scripts/deploy-ovh-core.sh
          bash -n scripts/ovh-core-health.sh

      - name: Validate Core syntax touched by drift controls
        run: |
          node --check core/src/supabase.mjs
          node --check core/src/reflection-policy.mjs
          node --check core/src/system-health.mjs
          node --check core/src/executors/host-health.mjs
          node --check core/src/compute/ollama-adapter.mjs
