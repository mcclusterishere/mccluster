name: Learning evidence
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_learning_evidence_v1.sql'
      - 'supabase/tests/learning_evidence.*.sql'
      - 'supabase/tests/supabase_api_roles.stub.sql'
      - 'supabase/tests/supabase_storage.stub.sql'
      - 'scripts/test-learning-evidence-db.sh'
      - '.github/workflows/learning-evidence-db.yml'
  workflow_dispatch:
jobs:
  learning-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Isolated PostgreSQL hash chain, ceilings, RLS and private bucket
        run: bash scripts/test-learning-evidence-db.sh
