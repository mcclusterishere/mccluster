name: Cloudflare Pages public-export security contract

on:
  pull_request:
    paths:
      - "scripts/stage-cloudflare-pages.mjs"
      - "scripts/deploy-cloudflare-pages.sh"
      - "scripts/smoke-cloudflare-pages.mjs"
      - "scripts/test/cloudflare-pages-stage.test.mjs"
      - "docs/control-plane/CLOUDFLARE-PAGES-DIRECT-UPLOAD.md"
      - ".github/workflows/cloudflare-pages-export-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  safe-static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate deploy script syntax and staging unit tests
        run: |
          bash -n scripts/deploy-cloudflare-pages.sh
          node --check scripts/stage-cloudflare-pages.mjs
          node --check scripts/smoke-cloudflare-pages.mjs
          node --test scripts/test/cloudflare-pages-stage.test.mjs
      - name: Stage the currently published GitHub Pages tree as a non-deploying canary
        run: |
          git fetch --force origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach "${RUNNER_TEMP}/mccluster-published-export" origin/gh-pages
          node scripts/stage-cloudflare-pages.mjs \
            --input "${RUNNER_TEMP}/mccluster-published-export" \
            --output "${RUNNER_TEMP}/mccluster-pages-audit" \
            --commit "${GITHUB_SHA}"
          node --input-type=module - <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.RUNNER_TEMP+'/mccluster-pages-audit';
          const m=JSON.parse(readFileSync(join(root,'mccluster-release.json'),'utf8'));
          if(m.asset_count<2000 || m.asset_count>20000)throw Error('Published asset count unexpected: '+m.asset_count);
          for(const path of [
            'core/src/broker-edge-auth.mjs',
            'platform/config/server-inventory.json',
            '.mcp.json',
            'dns/mccluster.org.zone',
            'data/analytics/application-schema-inventory.json',
            'assets/3d/prim3-site0/PRIM3_Site0_CANONICAL_ARCHITECTURE_v03.json'
          ])if(existsSync(join(root,path)))throw Error('Private path escaped sanitizer: '+path);
          if(!existsSync(join(root,'data/environments.json')))throw Error('Album presentation environment was incorrectly removed');
          const report=JSON.parse(readFileSync(root+'.excluded.json','utf8'));
          if(!report.excluded_paths.some(path=>path.startsWith('assets/3d/prim3-site0/')))throw Error('Authoring geometry missing from private exclusion report');
          console.log('Public-only artifact validated:',m.asset_count,'files, digest',m.manifest_sha256);
          NODE
