name: Game Hub capsule interactions
on:
  pull_request:
    paths:
      - 'game-hub.html'
      - 'css/game-hub.css'
      - 'js/game-hub/**'
      - 'js/music-engine.js'
      - 'js/gated-audio.js'
      - 'js/listen-ledger.js'
      - 'scripts/e2e/game-hub-capsule.e2e.mjs'
      - '.github/workflows/game-hub-capsule.yml'
permissions:
  contents: read
jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare pinned browser dependencies
        run: |
          npm install --prefix /tmp/capsule-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 axe-core@4.10.3
          /tmp/capsule-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify controls and answer hit targets
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/capsule-qa/node_modules
          AXE_PATH: /tmp/capsule-qa/node_modules/axe-core/axe.min.js
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('/tmp/capsule-qa/node_modules/playwright').chromium.executablePath())")"
          node scripts/e2e/game-hub-capsule.e2e.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-hub-capsule-proof-${{ github.run_id }}
          path: /tmp/game-hub-selector-evidence/*.png
          retention-days: 7
