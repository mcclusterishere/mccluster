name: PRIM3 adaptive PostgreSQL acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/mccluster/src/prim3/**'
      - 'PRIM3/game/halo/adaptive/**'
      - 'supabase/migrations/**'
      - 'supabase/pending/prim3_reviewed_releases_v1.sql'
      - 'js/prim3-mission/**'
      - 'js/prim3-tactics/**'
      - 'scripts/test/prim3-animation-clock.test.mjs'
      - 'scripts/test/prim3-operator-model-lifecycle.test.mjs'
      - 'prim3-released-mission.html'
      - 'scripts/e2e/prim3-reviewed-release.e2e.mjs'
      - 'supabase/tests/*learning*'
      - 'supabase/tests/supabase*.stub.sql'
      - 'scripts/test-prim3-adaptive-postgres.mjs'
      - '.github/workflows/prim3-adaptive-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'workers/mccluster/src/prim3/**'
      - 'PRIM3/game/halo/adaptive/**'
      - 'supabase/migrations/**'
      - 'supabase/pending/prim3_reviewed_releases_v1.sql'
      - 'js/prim3-mission/**'
      - 'js/prim3-tactics/**'
      - 'scripts/test/prim3-animation-clock.test.mjs'
      - 'scripts/test/prim3-operator-model-lifecycle.test.mjs'
      - 'prim3-released-mission.html'
      - 'scripts/e2e/prim3-reviewed-release.e2e.mjs'
      - 'scripts/test-prim3-adaptive-postgres.mjs'
      - '.github/workflows/prim3-adaptive-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prim3-adaptive-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: PRIM3 adaptive real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify finite animation clocks and delayed model ownership
        run: node --test scripts/test/prim3-animation-clock.test.mjs scripts/test/prim3-operator-model-lifecycle.test.mjs
      - name: Install isolated pinned browser dependencies
        run: |
          npm install --prefix /tmp/prim3-release-browser --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.57.0 three@0.180.0
          /tmp/prim3-release-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise isolated PostgreSQL, PostgREST and in-mission learning
        env:
          PRIM3_RELEASE_BROWSER: '1'
        run: node scripts/test-prim3-adaptive-postgres.mjs
