name: Production Security Contract

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'core/**'
      - 'workers/mccluster/**'
      - 'supabase/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'core/**'
      - 'workers/mccluster/**'
      - 'supabase/**'

permissions:
  contents: read

jobs:
  production-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject dangerous workflow trigger mode
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo 'pull_request_target is forbidden for this repository security model.' >&2
            exit 1
          fi

      - name: Require explicit workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$workflow" ] || continue
            if ! grep -q '^permissions:' "$workflow"; then
              echo "Missing top-level permissions block: $workflow" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Enforce immutable third-party action refs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r line; do
            ref="${line##*@}"
            ref="${ref%% *}"
            if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Mutable GitHub Action ref is forbidden: $line" >&2
              failed=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+@[^[:space:]#]+' .github/workflows | grep -vE 'uses:[[:space:]]+\./' || true)
          exit "$failed"

      - name: Reject mutable network-installed deploy CLIs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'npx[[:space:]]+--yes[[:space:]]+[^[:space:]]+@[0-9]+([[:space:]]|$)' .github/workflows scripts; then
            echo 'Major-only npx installs are forbidden in deployment/control-plane paths.' >&2
            exit 1
          fi

      - name: Enforce pinned OVH SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/deploy-ovh-core.yml
            .github/workflows/bootstrap-ovh-self-management.yml
            .github/workflows/bootstrap-ovh-game-workstation.yml
          )
          for workflow in "${files[@]}"; do
            grep -q 'OVH_KNOWN_HOSTS' "$workflow"
            grep -q 'StrictHostKeyChecking=yes' "$workflow"
            if grep -q 'ssh-keyscan' "$workflow"; then
              echo "TOFU ssh-keyscan is forbidden in $workflow" >&2
              exit 1
            fi
          done

      - name: Enforce production commit provenance
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/deploy-ovh-core.yml \
            .github/workflows/bootstrap-ovh-self-management.yml; do
            grep -q 'git merge-base --is-ancestor' "$workflow"
            grep -q 'origin/main' "$workflow"
            grep -q 'Exact commit SHA already contained in main' "$workflow"
          done

      - name: Enforce privileged bootstrap input validation
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/bootstrap-ovh-game-workstation.yml
          grep -q "SEMVER_RE='\^\[0-9\]" "$workflow"
          grep -q 'Invalid Godot version' "$workflow"
          grep -q 'Invalid Blender version' "$workflow"

      - name: Lint every workflow with pinned actionlint
        shell: bash
        # Release binary pinned by version and SHA-256, verified before it
        # runs. shellcheck/pyflakes integration is off: this gate is about
        # workflow syntax, expressions, action inputs and untrusted-input
        # use, not shell style. No ignores: a finding is fixed in the
        # workflow, not suppressed here.
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "$dir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  $dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -version
          "$dir/actionlint" -no-color -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: Pin the Core runner/agent split and the draft-only PR path
        run: node --test scripts/test/core-identity-contract.test.mjs

      - name: Validate Supabase function auth manifest
        run: node scripts/supabase-function-config-check.mjs

      - name: Security contract summary
        run: |
          echo 'Production security invariants verified:' >> "$GITHUB_STEP_SUMMARY"
          echo '- no pull_request_target workflows' >> "$GITHUB_STEP_SUMMARY"
          echo '- explicit workflow token permissions' >> "$GITHUB_STEP_SUMMARY"
          echo '- third-party GitHub Actions pinned to immutable commit SHAs' >> "$GITHUB_STEP_SUMMARY"
          echo '- mutable major-only network CLI installs rejected from deploy/control-plane paths' >> "$GITHUB_STEP_SUMMARY"
          echo '- pinned OVH SSH host identity; no live ssh-keyscan TOFU' >> "$GITHUB_STEP_SUMMARY"
          echo '- direct OVH mutations require an exact commit already in main' >> "$GITHUB_STEP_SUMMARY"
          echo '- privileged game bootstrap versions are validated before remote shell interpolation' >> "$GITHUB_STEP_SUMMARY"
          echo '- every workflow passes pinned actionlint' >> "$GITHUB_STEP_SUMMARY"
          echo '- Core runner/agent identity split and draft-only PR path pinned by test' >> "$GITHUB_STEP_SUMMARY"
          echo '- committed secret formats are rejected by the always-on Secret scan workflow (secret-scan.yml)' >> "$GITHUB_STEP_SUMMARY"
