name: Production Security Contract

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'core/**'
      - 'workers/mccluster/**'
      - 'supabase/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'core/**'
      - 'workers/mccluster/**'
      - 'supabase/**'

permissions:
  contents: read

jobs:
  production-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject dangerous workflow trigger mode
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo 'pull_request_target is forbidden for this repository security model.' >&2
            exit 1
          fi

      - name: Require explicit workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$workflow" ] || continue
            if ! grep -q '^permissions:' "$workflow"; then
              echo "Missing top-level permissions block: $workflow" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Enforce pinned OVH SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/deploy-ovh-core.yml
            .github/workflows/bootstrap-ovh-self-management.yml
            .github/workflows/bootstrap-ovh-game-workstation.yml
          )
          for workflow in "${files[@]}"; do
            grep -q 'OVH_KNOWN_HOSTS' "$workflow"
            grep -q 'StrictHostKeyChecking=yes' "$workflow"
            if grep -q 'ssh-keyscan' "$workflow"; then
              echo "TOFU ssh-keyscan is forbidden in $workflow" >&2
              exit 1
            fi
          done

      - name: Enforce production commit provenance
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/deploy-ovh-core.yml \
            .github/workflows/bootstrap-ovh-self-management.yml; do
            grep -q 'git merge-base --is-ancestor' "$workflow"
            grep -q 'origin/main' "$workflow"
            grep -q 'Exact commit SHA already contained in main' "$workflow"
          done

      - name: Enforce privileged bootstrap input validation
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/bootstrap-ovh-game-workstation.yml
          grep -q "SEMVER_RE='\^\[0-9\]" "$workflow"
          grep -q 'Invalid Godot version' "$workflow"
          grep -q 'Invalid Blender version' "$workflow"

      - name: Reject obvious committed production secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'gh[pousr]_[A-Za-z0-9_]{20,}'
            'sk_live_[A-Za-z0-9]{16,}'
            'AKIA[0-9A-Z]{16}'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -n -E "$pattern" -- ':!*.md' ':!*.example' ':!*.example.*'; then
              echo "Potential committed production secret matched: $pattern" >&2
              exit 1
            fi
          done

      - name: Security contract summary
        run: |
          echo 'Production security invariants verified:' >> "$GITHUB_STEP_SUMMARY"
          echo '- no pull_request_target workflows' >> "$GITHUB_STEP_SUMMARY"
          echo '- explicit workflow token permissions' >> "$GITHUB_STEP_SUMMARY"
          echo '- pinned OVH SSH host identity; no live ssh-keyscan TOFU' >> "$GITHUB_STEP_SUMMARY"
          echo '- direct OVH mutations require an exact commit already in main' >> "$GITHUB_STEP_SUMMARY"
          echo '- privileged game bootstrap versions are validated before remote shell interpolation' >> "$GITHUB_STEP_SUMMARY"
          echo '- obvious high-risk production secret formats are rejected from tracked source' >> "$GITHUB_STEP_SUMMARY"
