name: Social hardening tests

on:
  pull_request:
    paths:
      - 'workers/mccluster/**'
      - 'supabase/replay_migrations/20260907040300_social_hardening.sql'
      - '.github/workflows/social-hardening-test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mccluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run hardening regression tests
        run: npm test
      - name: Check changed Worker module syntax
        run: |
          node --check src/social/security.js
          node --check src/social/router.js
          node --check src/social/meta.js
          node --check src/media/router.js
          node --check src/entry.js
