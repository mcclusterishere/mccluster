name: Social hardening tests

on:
  pull_request:
    paths:
      - 'workers/mccluster/**'
      - 'supabase/migrations/20260907040300_social_hardening.sql'
      - '.github/workflows/social-hardening-test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mccluster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run hardening regression tests
        run: npm test
      - name: Check changed Worker module syntax
        run: |
          node --check src/social/security.js
          node --check src/social/router.js
          node --check src/social/meta.js
          node --check src/media/router.js
          node --check src/entry.js
