name: MCP Approval Scope (isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261017214808_mcp_approval_scope_v1.sql'
      - 'supabase/tests/mcp_approval_scope.*.sql'
      - 'supabase/functions/inbox/index.ts'
      - '.github/workflows/mcp-approval-scope.yml'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: audit_fixture_only
          POSTGRES_DB: mcp_scope
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: audit_fixture_only
      PGDATABASE: mcp_scope
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_approval_scope.stub.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017214808_mcp_approval_scope_v1.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp_approval_scope.behaviour.sql
