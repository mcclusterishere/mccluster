name: Analytics Platform CI

on:
  pull_request:
    paths:
      - 'analytics.html'
      - 'js/mc-analytics.js'
      - 'js/analytics-product.js'
      - 'js/analytics.js'
      - 'js/live-content.js'
      - 'js/name-integrity.js'
      - 'account.html'
      - 'privacy.html'
      - 'workers/mccluster/src/entry.js'
      - 'workers/mccluster/src/analytics/**'
      - 'supabase/functions/collect/**'
      - 'supabase/migrations/**'
      - 'supabase/pending/analytics_visitor_event_identity_v6.sql'
      - 'supabase/pending/analytics_session_evidence_v6.sql'
      - 'scripts/test/collect-gpc-sanitization.test.mjs'
      - 'scripts/test/collect-idempotency.test.mjs'
      - 'supabase/pending/analytics_tenant_history_restrict_v1.sql'
      - 'scripts/test-analytics-identity-db.mjs'
      - 'scripts/test/analytics-transport-privacy.test.mjs'
      - 'scripts/test/playback-measurement.test.mjs'
      - 'scripts/test/analytics-platform.test.mjs'
      - 'scripts/test/account-identity-gate.test.mjs'
      - '.github/workflows/analytics-platform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'analytics.html'
      - 'js/mc-analytics.js'
      - 'js/analytics-product.js'
      - 'js/analytics.js'
      - 'js/live-content.js'
      - 'js/name-integrity.js'
      - 'account.html'
      - 'privacy.html'
      - 'workers/mccluster/src/entry.js'
      - 'workers/mccluster/src/analytics/**'
      - 'supabase/functions/collect/**'
      - 'supabase/migrations/**'
      - 'scripts/test/analytics-platform.test.mjs'
      - 'scripts/test/account-identity-gate.test.mjs'

permissions:
  contents: read

jobs:
  measurement-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test event privacy, lifecycle, progress and account evidence
        run: node --test scripts/test/analytics-transport-privacy.test.mjs scripts/test/analytics-outbox.test.mjs scripts/test/playback-measurement.test.mjs workers/mccluster/test/audience-science.test.mjs workers/mccluster/test/analytics-identity-evidence.test.mjs workers/mccluster/test/analytics-forensics.test.mjs scripts/test/collect-gpc-sanitization.test.mjs scripts/test/collect-idempotency.test.mjs
      - name: Prepare isolated PostgreSQL engine
        run: npm install --prefix /tmp/analytics-db-qa --ignore-scripts --no-audit --no-fund --no-save @electric-sql/pglite@0.5.10
      - name: Validate dormant identity and tenant proposals with synthetic data
        env:
          PGLITE_MODULE_PATH: /tmp/analytics-db-qa/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/test-analytics-identity-db.mjs

  analytics-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse analytics client and edge router
        run: |
          node --check js/mc-analytics.js
          node --check js/analytics-product.js
          node --check js/analytics.js
          node --check js/live-content.js
          node --check js/name-integrity.js
          node --check workers/mccluster/src/analytics/router.js
          node --check workers/mccluster/src/entry.js
      - name: Run analytics product contracts
        run: node --test scripts/test/analytics-platform.test.mjs
      - name: Run account identity and privacy gate contracts
        run: node --test scripts/test/account-identity-gate.test.mjs

  collector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check collector
        run: deno check supabase/functions/collect/index.ts
