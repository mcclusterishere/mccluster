name: Compute Node CI

on:
  push:
    branches:
      - core/compute-node-v1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compute-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Compute protocol contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Core compute and inherited runtime
        working-directory: core
        run: npm run check
      - name: Run Core protocol and capability tests
        working-directory: core
        run: npm test
      - name: Assert compute security boundaries
        run: |
          grep -F "Compute gateway must bind to loopback" core/src/compute/gateway.mjs
          grep -F "MCCLUSTER_COMPUTE_URL must be an https:// URL" core/src/compute/node-agent.mjs
          grep -F "Node executors must be loopback services" core/src/compute/node-agent.mjs
          grep -F "SUPABASE_SERVICE_ROLE_KEY" core/src/compute/store.mjs
          if grep -F "SUPABASE_SERVICE_ROLE_KEY" core/compute-node.env.example core/compute-capabilities.example.json; then
            echo 'Compute-node configuration must never contain the Supabase service role.' >&2
            exit 1
          fi
          grep -F "ops_compute_nonces" supabase/migrations/20260912071000_compute_node_protocol.sql
          grep -F "for update skip locked" supabase/migrations/20260912071000_compute_node_protocol.sql
          grep -F "revoke all on public.ops_compute_nodes from anon, authenticated" supabase/migrations/20260912071000_compute_node_protocol.sql
          grep -F "hosting: 'self-hosted'" core/src/tools/compute.mjs
          grep -F "billing: 'compute'" core/src/tools/compute.mjs

  database:
    name: Compute schema reset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database including compute fabric
        run: supabase db reset
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
