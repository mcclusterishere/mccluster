name: Compute Node CI

on:
  push:
    branches:
      - core/compute-node-v1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compute-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Compute protocol contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Parse Core compute and inherited runtime
        working-directory: core
        run: npm run check
      - name: Run Core protocol and capability tests
        working-directory: core
        run: npm test
      - name: Assert compute security boundaries
        run: |
          grep -F "Compute gateway must bind to loopback" core/src/compute/gateway.mjs
          grep -F "MCCLUSTER_COMPUTE_URL must be an https:// URL" core/src/compute/node-agent.mjs
          grep -F "Node executors must be loopback services" core/src/compute/node-agent.mjs
          if grep -F "SUPABASE_SERVICE_ROLE_KEY" \
            core/src/compute/node-agent.mjs \
            core/compute-node.env.example \
            core/compute-capabilities.example.json; then
            echo 'Compute nodes must never receive the Supabase service role.' >&2
            exit 1
          fi
          grep -F "ops_compute_nonces" supabase/replay_migrations/20260912071000_compute_node_protocol.sql
          grep -F "for update skip locked" supabase/replay_migrations/20260912071000_compute_node_protocol.sql
          grep -F "revoke all on public.ops_compute_nodes from anon, authenticated" supabase/replay_migrations/20260912071000_compute_node_protocol.sql
          grep -F "hosting: 'self-hosted'" core/src/tools/compute.mjs
          grep -F "billing: 'compute'" core/src/tools/compute.mjs
      - name: Assert the Core never depends on Playwright
        run: |
          node -e "const p=require('./core/package.json'); for (const k of ['dependencies','devDependencies','optionalDependencies','peerDependencies']) { if (p[k] && p[k].playwright) { console.error('core/package.json must not list playwright: the laptop installs its own copy under its state root'); process.exit(1); } }"
          grep -F '"capability": "browser.act"' core/node-manifests/owner-windows-gpu.json
          grep -F 'http://127.0.0.1:4791/execute' core/node-manifests/owner-windows-gpu.json

  # The node's own browser (device-node slice N2, docs/control-plane/AGENT-NODE-BROWSER.md): the browser
  # executor's tests drive real Chromium against a loopback fixture. Playwright is installed OUTSIDE the
  # repository (core/package.json never lists it), the executor and the test harness find it through
  # MCCLUSTER_BROWSER_PLAYWRIGHT_DIR, and the sandbox is off only because this is a CI container.
  # MCCLUSTER_BROWSER_TESTS_REQUIRED makes the harness FAIL when Playwright or its Chromium is missing,
  # instead of skipping every real-Chromium test and reporting green (verification finding N2V-m1;
  # core/test/browser-executor-required.test.mjs proves the harness does that).
  browser-executor:
    name: Browser executor against real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MCCLUSTER_BROWSER_PLAYWRIGHT_DIR: /tmp/pw/node_modules/playwright
      MCCLUSTER_BROWSER_NO_SANDBOX: '1'
      MCCLUSTER_BROWSER_TESTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned Playwright outside the repository
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-audit --no-fund --no-save playwright@1.63.0
          node -e "const v=require('/tmp/pw/node_modules/playwright/package.json').version; if (v!=='1.63.0') { console.error('expected playwright 1.63.0, got '+v); process.exit(1); }"
      - name: Install Chromium through Playwright's own installer
        run: node /tmp/pw/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run the browser executor tests
        working-directory: core
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts['test:browser']) { console.error('core/package.json has no test:browser script'); process.exit(1); }"
          npm run test:browser

  database:
    name: Compute schema reset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: bash scripts/supabase-local-reset-with-replay.sh start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database including compute fabric
        run: bash scripts/supabase-local-reset-with-replay.sh
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
