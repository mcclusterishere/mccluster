name: Music release and payment integrity
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261030001000_music_release_payment_integrity_v1.sql'
      - 'supabase/pending/music_release_payment_integrity_v1.rollback.sql'
      - 'supabase/migrations/20260920041011_music_creator_platform_v1.sql'
      - 'supabase/migrations/20260920041250_music_commerce_v1.sql'
      - 'supabase/tests/music_release_payment_integrity.*.sql'
      - 'supabase/tests/music_release_integrity.stub.sql'
      - 'supabase/tests/music_creator_onboarding.stub.sql'
      - 'supabase/tests/supabase_api_roles.stub.sql'
      - 'supabase/functions/_shared/checkout-binding.ts'
      - 'supabase/functions/_shared/music-commission.ts'
      - 'supabase/functions/music-access/**'
      - 'supabase/functions/music-checkout/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/functions/shake-order/**'
      - 'supabase/functions/l3-download/**'
      - 'js/music-admin.js'
      - 'scripts/test-music-release-integrity-db.sh'
      - 'scripts/test/music-payment-integrity.test.mjs'
      - '.github/workflows/music-release-integrity-db.yml'
  workflow_dispatch:
jobs:
  music-release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Fulfilment, commission, ownership and review contracts
        run: node --test scripts/test/music-payment-integrity.test.mjs
      - name: Isolated PostgreSQL guards, storage policies and backfill
        run: bash scripts/test-music-release-integrity-db.sh
