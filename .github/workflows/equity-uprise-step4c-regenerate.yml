name: Equity Uprise Step 4C Regenerate

on:
  push:
    branches:
      - feat/equity-uprise-device-archetypes-camera-v1
    paths:
      - .github/workflows/equity-uprise-step4c-regenerate.yml
      - docs/design/equity-uprise-building/production/electronics/build_equity_uprise_electronics_v1.py
      - docs/design/equity-uprise-building/production/electronics/device-archetypes-v1.json
      - docs/design/equity-uprise-building/production/electronics/verify_equity_uprise_electronics_v1.py

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/equity-uprise-device-archetypes-camera-v1
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic model dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy trimesh pillow ezdxf

      - name: Regenerate Step 4B/4C physical plant
        run: |
          python docs/design/equity-uprise-building/production/electronics/build_equity_uprise_electronics_v1.py
          python docs/design/equity-uprise-building/production/electronics/verify_equity_uprise_electronics_v1.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-fabric-v1.glb             docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-manifest-v1.json             docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-electronics-step4a-report.json             docs/design/equity-uprise-building/production/electronics/generated/equity-uprise-device-components-v1.json             docs/design/equity-uprise-building/production/asset-registry/generated/equity-uprise-asset-registry-v1.json
          if git diff --cached --quiet; then
            echo "Generated Step 4C artifacts already current."
          else
            git commit -m "Regenerate Step 4C camera device artifacts"
            git push origin HEAD:feat/equity-uprise-device-archetypes-camera-v1
          fi
