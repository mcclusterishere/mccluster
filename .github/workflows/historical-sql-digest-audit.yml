name: Historical production SQL digest audit
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'scripts/audit-production-sql-digests.mjs'
      - 'docs/control-plane/production-sql-digests-20261021.json'
      - 'supabase/production-ledger.json'
      - '.github/workflows/historical-sql-digest-audit.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare applied SQL against committed sources
        run: node scripts/audit-production-sql-digests.mjs > production-sql-digest-report.json
      - name: Print summary
        run: node -e "const r=require('./production-sql-digest-report.json');console.log(JSON.stringify({live_count:r.live_count,ledger_count:r.ledger_count,counts:r.counts,exceptions:r.exceptions.length},null,2))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-sql-digest-report
          path: production-sql-digest-report.json
          retention-days: 14
