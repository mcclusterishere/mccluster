name: Private Course Studio rehearsal
on:
  pull_request:
    paths:
      - 'control.html'
      - 'css/control-course-studio.css'
      - 'js/control-room/nav.js'
      - 'js/control-room/course-studio.js'
      - 'workers/mccluster/src/prim3/course-studio.js'
      - 'workers/mccluster/src/prim3/learning.js'
      - 'core/src/course-studio/**'
      - 'core/src/executors/course-study-build.mjs'
      - 'core/src/runner.mjs'
      - 'core/src/completion-evidence.mjs'
      - 'core/src/notifier.mjs'
      - 'core/test/course-study-build.test.mjs'
      - 'supabase/pending/learning_studio_v1*.sql'
      - 'scripts/test-course-studio-db.mjs'
      - 'scripts/e2e/control-course-studio.e2e.mjs'
      - '.github/workflows/course-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    # Keep the runner supported by the pinned Playwright browser/dependency build.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/course-studio" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.10 playwright@1.57.0
      - name: Exercise private queue and database; test rounded numeric challenges
        run: |
          node --test core/test/course-study-build.test.mjs core/test/completion-evidence.test.mjs scripts/test/control-nav.test.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/course-studio/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-course-studio-db.mjs
      - name: Exercise phone and desktop owner entry (synthetic, no production credentials)
        run: |
          "$RUNNER_TEMP/course-studio/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_DIR="$RUNNER_TEMP/course-studio/node_modules" node scripts/e2e/control-course-studio.e2e.mjs
