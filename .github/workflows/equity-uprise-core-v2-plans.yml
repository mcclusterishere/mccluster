name: Equity Uprise Core V2 Plans

on:
  push:
    branches:
      - architecture/equity-uprise-core-v2
    paths:
      - 'docs/design/equity-uprise-building/production/building-core-v2.json'
      - 'docs/design/equity-uprise-building/production/core-v2-floor-programs.json'
      - 'docs/design/equity-uprise-building/production/generate_core_v2_plans.py'
      - '.github/workflows/equity-uprise-core-v2-plans.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: equity-uprise-core-v2-plans
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/equity-uprise-core-v2
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic plan dependencies
        run: python -m pip install --disable-pip-version-check pillow ezdxf

      - name: Generate Core V2 plans
        run: python docs/design/equity-uprise-building/production/generate_core_v2_plans.py

      - name: Commit generated plan references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/design/equity-uprise-building/references
          if git diff --cached --quiet; then
            echo "Core V2 plan references already current."
            exit 0
          fi
          git commit -m "Generate Equity Uprise Core V2 plan references"
          git push origin HEAD:architecture/equity-uprise-core-v2
