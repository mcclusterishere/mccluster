name: Unified World feed and discussions
on:
  pull_request:
    branches: [main]
    paths:
      - 'mnet.html'
      - 'js/mnet.js'
      - 'js/world-news-globe.js'
      - 'js/action-globe.js'
      - 'css/mnet.css'
      - 'css/world-news-globe.css'
      - 'workers/mccluster/src/platform-api.js'
      - 'supabase/migrations/20261021011443_royce_platform_actor.sql'
      - 'scripts/test/world-news-globe-source.test.mjs'
      - 'scripts/test/world-unified-feed.test.mjs'
      - 'scripts/test/world-news-comments.*.sql'
      - '.github/workflows/world-unified-feed-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax, release boundaries and news comment authorization
        run: |
          set -euo pipefail
          for file in js/mnet.js js/world-news-globe.js js/action-globe.js workers/mccluster/src/platform-api.js; do node --check "$file"; done
          node --test scripts/test/world-news-globe-source.test.mjs scripts/test/world-news-feed.test.mjs scripts/test/world-unified-feed.test.mjs scripts/test/mnet-real-network.test.mjs

  postgres-contract:
    name: Isolated PostgreSQL role and rate-limit verification
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: news_ci_only
          POSTGRES_DB: news_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify the applied news-discussion schema in disposable PostgreSQL only
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: news_ci_only
          PGDATABASE: news_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/test/world-news-comments.stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021011443_royce_platform_actor.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test/world-news-comments.behavior.sql
