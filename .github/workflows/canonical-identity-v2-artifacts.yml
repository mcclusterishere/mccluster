name: Canonical Identity V2 Artifact Closure

on:
  push:
    branches:
      - chatgpt/canonical-identity-v2
    paths:
      - .github/workflows/canonical-identity-v2-artifacts.yml
      - matthew-mccluster.html
      - resume-it-support.html
      - data/card.json
      - tools/build-resume.mjs
      - tools/build-it-resume.mjs
      - tools/resume-stamp.mjs
      - scripts/resume-docx.py

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[identity-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/canonical-identity-v2
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install artifact build dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install -r scripts/requirements-resume.txt

      - name: Rebuild full résumé
        run: node tools/build-resume.mjs

      - name: Rebuild IT résumé
        run: node tools/build-it-resume.mjs

      - name: Rebuild vCard
        run: node tools/vcard.mjs

      - name: Verify résumé artifacts
        run: |
          node tools/verify-resume.mjs
          node tools/verify-it-resume.mjs
          node --test scripts/test/resume-docx-sync.test.mjs

      - name: Commit generated identity artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume/matthew-mccluster-resume.pdf \
                  assets/resume/matthew-mccluster-resume.docx \
                  assets/resume/matthew-mccluster-resume.pdf.stamp \
                  assets/resume/matthew-mccluster-resume-it-support.pdf \
                  assets/resume/matthew-mccluster-resume-it-support.docx \
                  assets/resume/matthew-mccluster-resume-it-support.pdf.stamp \
                  mccluster.vcf
          if git diff --cached --quiet; then
            echo "Identity artifacts already current."
            exit 0
          fi
          git commit -m "Regenerate canonical identity artifacts [identity-artifacts]"
          git push origin HEAD:chatgpt/canonical-identity-v2
