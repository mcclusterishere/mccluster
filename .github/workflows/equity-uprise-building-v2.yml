name: Equity Uprise Core V2 Building

on:
  push:
    branches:
      - architecture/equity-uprise-core-v2
    paths:
      - 'docs/design/equity-uprise-building/production/building-core-v2.json'
      - 'docs/design/equity-uprise-building/production/core-v2-floor-programs.json'
      - 'docs/design/equity-uprise-building/production/build_equity_uprise_building_v2.py'
      - 'docs/design/equity-uprise-building/production/verify_equity_uprise_building_v2.py'
      - '.github/workflows/equity-uprise-building-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: equity-uprise-building-v2
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/equity-uprise-core-v2
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic 3D dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh

      - name: Build combined Core V2 GLB
        run: python docs/design/equity-uprise-building/production/build_equity_uprise_building_v2.py

      - name: Verify combined Core V2 GLB
        run: python docs/design/equity-uprise-building/production/verify_equity_uprise_building_v2.py

      - name: Commit generated building artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/design/equity-uprise-building/production/generated/equity-uprise-building-core-v2.glb
          git add docs/design/equity-uprise-building/production/generated/equity-uprise-building-core-v2-report.json
          if git diff --cached --quiet; then
            echo "Combined building artifact already current."
            exit 0
          fi
          git commit -m "Build Equity Uprise Core V2 combined building"
          git push origin HEAD:architecture/equity-uprise-core-v2
