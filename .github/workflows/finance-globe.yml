name: Halo Finance integration proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/halo/**'
      - 'js/action-globe.js'
      - 'workers/mccluster/src/finance/**'
      - 'workers/mccluster/src/intel/router.js'
      - 'workers/mccluster/test/finance-*.test.mjs'
      - 'docs/control-plane/sql/finance-*.sql'
      - 'scripts/finance-preview.mjs'
      - 'scripts/e2e/finance-*.mjs'
      - '.github/workflows/finance-globe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-globe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare pinned browser and isolated database
        run: |
          npm install --prefix /tmp/finance-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0
          /tmp/finance-qa/node_modules/.bin/playwright install --with-deps chromium
          docker pull postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          docker tag postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 postgres:17.6
      - name: Finance failure and isolation tests
        run: node --import ./workers/mccluster/test/support/offline-network.mjs --test workers/mccluster/test/finance-*.test.mjs
      - name: Actual globe to paper ledger and reload
        env:
          PLAYWRIGHT_DIR: /tmp/finance-qa/node_modules
          CESIUM_DIR: /tmp/finance-qa/node_modules/cesium/Build/Cesium
        run: node scripts/e2e/finance-ci.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: finance-globe-${{ github.run_id }}
          path: /tmp/finance-globe-proof
          retention-days: 7
