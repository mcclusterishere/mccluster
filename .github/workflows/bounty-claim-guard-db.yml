name: Bounty claim guard database contract
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'supabase/pending/action_bounty_claim_existing_row_guard_v1.sql'
      - 'supabase/tests/action_bounty_claim_guard.behaviour.sql'
      - 'supabase/tests/action_bounty_claim_guard.stub.sql'
      - 'supabase/tests/supabase_api_roles.stub.sql'
      - 'scripts/test-action-bounty-claim-db.sh'
      - '.github/workflows/bounty-claim-guard-db.yml'
  workflow_dispatch:
jobs:
  bounty-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Test funded, repeated, expired, cancelled and rejected claims
        run: bash scripts/test-action-bounty-claim-db.sh
