name: Versioned editor contracts
on:
  pull_request:
    paths:
      - 'supabase/pending/editor_versioned_contracts_v1.sql'
      - 'supabase/pending/project_tile_editor_v2.sql'
      - 'scripts/test/tile-editor-bridge-*'
      - 'workers/mccluster/src/project-tiles.js'
      - 'workers/mccluster/src/website-studio/**'
      - 'supabase/tests/editor-versioned/**'
      - 'scripts/test/editor-versioned-*'
      - 'scripts/test/editor-tools/**'
      - 'workers/mccluster/src/editor-versioned.js'
      - 'workers/mccluster/src/entry-platform.js'
      - 'packages/front-config/**'
      - '.github/workflows/editor-contracts-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/test/editor-tools --ignore-scripts --no-audit --no-fund
      - run: PGLITE_DIR="$PWD/scripts/test/editor-tools/node_modules" node scripts/test/editor-versioned-db.mjs
      - run: PGLITE_DIR="$PWD/scripts/test/editor-tools/node_modules" node scripts/test/prepared-foundation-db.mjs
      - run: PGLITE_DIR="$PWD/scripts/test/editor-tools/node_modules" node scripts/test/tile-editor-bridge-db.mjs
      - run: python3 scripts/test/tile-editor-bridge-native.py
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
