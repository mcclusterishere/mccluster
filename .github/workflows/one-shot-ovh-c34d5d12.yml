name: Smoke OVH resident AI inference gate c34d5d12

on:
  push:
    branches:
      - ops/deploy-ovh-c34d5d12-one-shot
    paths:
      - .github/workflows/one-shot-ovh-c34d5d12.yml

permissions:
  contents: read

concurrency:
  group: smoke-ovh-c34d5d12
  cancel-in-progress: false

jobs:
  smoke:
    name: Live OVH resident AI inference smoke
    runs-on: ubuntu-latest
    environment: ovh-production
    env:
      TARGET_SHA: c34d5d12debfba96e3a23272558a461b2272d177

    steps:
      - name: Checkout main for provenance validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate deployed target remains approved
        run: |
          set -euo pipefail
          git fetch origin main deploy/ovh-production
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          test "$(git rev-parse origin/deploy/ovh-production)" = "${TARGET_SHA}"

      - name: Configure pinned SSH trust
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_KNOWN_HOSTS"
          test -n "$OVH_HOST"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Run real inference through live serialized adapter
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$OVH_USER@$OVH_HOST" "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          grep -Fq "\"commit_sha\":\"$TARGET_SHA\"" /opt/mccluster/core/.mccluster-deploy.json
          systemctl is-active --quiet mccluster-core-runner.service
          systemctl is-active --quiet mccluster-core-tool-broker.service
          systemctl is-active --quiet mccluster-ollama-adapter.service
          systemctl is-active --quiet mccluster-compute-node.service

          BEFORE="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4790/health)"
          printf 'adapter_before=%s\n' "$BEFORE"

          REQUEST='{"capability":"ai.chat","implementation":"core-local-smoke","priority":100,"input":{"messages":[{"role":"system","content":"Return exactly MCCLUSTER_OVH_INFERENCE_OK and nothing else."},{"role":"user","content":"health check"}],"temperature":0,"num_ctx":2048},"metadata":{"source":"post-deploy-smoke"}}'

          RESPONSE="$(curl --fail --silent --show-error --max-time 600             -H 'content-type: application/json'             --data "$REQUEST"             http://127.0.0.1:4790/execute)"
          printf 'inference_response=%s\n' "$RESPONSE"

          printf '%s' "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c).on('end',()=>{
              const x=JSON.parse(d);
              const content=String(x.content||'').trim();
              if (!content.includes('MCCLUSTER_OVH_INFERENCE_OK')) {
                console.error('unexpected inference content:', content);
                process.exit(1);
              }
              if (!x.model) {
                console.error('model missing from inference response');
                process.exit(1);
              }
              console.log('live_inference_marker=MCCLUSTER_OVH_INFERENCE_OK');
              console.log('live_model='+x.model);
              console.log('queue_wait_ms='+String(x.queue_wait_ms ?? ''));
            });
          "

          AFTER="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4790/health)"
          printf 'adapter_after=%s\n' "$AFTER"
          printf '%s' "$AFTER" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c).on('end',()=>{
              const x=JSON.parse(d);
              if (!x.ok) process.exit(1);
              if (Number(x.queue_depth)!==0) process.exit(2);
              if (!x.last_started_at || !x.last_completed_at) process.exit(3);
              if (x.last_error) {
                console.error(x.last_error);
                process.exit(4);
              }
            });
          "
          REMOTE

      - name: Verify public Core still reports target SHA
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 15 https://core.mccluster.org/health)"
          printf '%s\n' "$body"
          deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const x=JSON.parse(d);console.log(x.deployment_sha||'')})")"
          test "$deployed" = "$TARGET_SHA"
