name: Equity Uprise Core V2 Production Packages

on:
  push:
    branches:
      - architecture/equity-uprise-core-v2
    paths:
      - 'docs/design/equity-uprise-building/production/building-core-v2.json'
      - 'docs/design/equity-uprise-building/production/core-v2-floor-programs.json'
      - 'docs/design/equity-uprise-building/production/equity-uprise-capability-map-v2.json'
      - 'docs/design/equity-uprise-building/production/verify_equity_uprise_program_coverage.py'
      - 'docs/design/equity-uprise-building/production/generate_core_v2_production_packages.py'
      - '.github/workflows/equity-uprise-core-v2-production.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: equity-uprise-core-v2-production
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/equity-uprise-core-v2
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Generate Core V2 production packages
        run: python docs/design/equity-uprise-building/production/generate_core_v2_production_packages.py

      - name: Validate repo-to-building program coverage
        run: python docs/design/equity-uprise-building/production/verify_equity_uprise_program_coverage.py

      - name: Commit generated production packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/design/equity-uprise-building/production/floor-01                   docs/design/equity-uprise-building/production/floor-02                   docs/design/equity-uprise-building/production/floor-03                   docs/design/equity-uprise-building/production/floor-04                   docs/design/equity-uprise-building/production/floor-05                   docs/design/equity-uprise-building/production/floor-06                   docs/design/equity-uprise-building/production/floor-07
          git add docs/design/equity-uprise-building/production/generated/equity-uprise-program-coverage-report.json
          if git diff --cached --quiet; then
            echo "Core V2 production packages already current."
            exit 0
          fi
          git commit -m "Generate Equity Uprise Core V2 production packages"
          git push origin HEAD:architecture/equity-uprise-core-v2
