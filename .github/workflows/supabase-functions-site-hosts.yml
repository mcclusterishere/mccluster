name: Supabase functions read the site hosts

# Every Supabase function that reads the generated site hosts
# (supabase/functions/_shared/site-hosts.ts, written by tools/build-site-hosts.mjs
# from data/seo/domain-architecture.json) is type-checked by Deno, the runtime it
# deploys on, and its return rule is driven as written under Node
# (scripts/test/supabase-function-returns.test.mjs: back to the request's Origin
# only when it is exactly an origin that serves pages, else today's default).
# The function list below is the set a change to the generated module redeploys
# (scripts/supabase-functions-deploy.mjs); that test fails when the two differ.
on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'data/seo/domain-architecture.json'
      - 'tools/build-site-hosts.mjs'
      - 'scripts/supabase-functions-deploy.mjs'
      - 'scripts/test/supabase-function-returns.test.mjs'
      - 'scripts/test/support/edge-function-handler.mjs'
      - 'scripts/test/stripe-return-urls.test.mjs'
      - 'scripts/test/music-direct-sales.test.mjs'
      - 'scripts/test/collect-*.test.mjs'
      - '.github/workflows/supabase-functions-site-hosts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    name: Deno type-check of the functions that read the site hosts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Type-check the generated module and every function that imports it
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/_shared/site-hosts.ts
          for fn in backend-sub checkout collect connect-onboard connect-org gev-proxy music-checkout music-direct-access music-direct-checkout org-connect-onboard pay-now shake-order stripe-webhook; do
            echo "::group::deno check $fn"
            deno check --node-modules-dir=auto "supabase/functions/$fn/index.ts"
            echo "::endgroup::"
          done

  returns:
    name: Each function's return rule, run as written
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: workers/mccluster/.node-version
      - name: The generated module matches the record
        run: node tools/build-site-hosts.mjs --check
      - name: Returns, CORS and host labels of the functions that read it
        run: |
          node --test scripts/test/supabase-function-returns.test.mjs scripts/test/stripe-return-urls.test.mjs \
            scripts/test/music-direct-sales.test.mjs scripts/test/collect-gpc-sanitization.test.mjs scripts/test/collect-idempotency.test.mjs
