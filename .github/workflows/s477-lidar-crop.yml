name: S477 LiDAR site crop

on:
  workflow_dispatch:
  push:
    branches:
      - feature/s477-smart-church
    paths:
      - .github/workflows/s477-lidar-crop.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDAL environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: s477-lidar
          create-args: >-
            python=3.11
            pdal
          cache-environment: true

      - name: Crop NOAA Connecticut EPT to S477 preliminary site buffer
        shell: bash -el {0}
        run: |
          mkdir -p data/s477/lidar/generated
          cat > /tmp/s477-crop.json <<'JSON'
          {
            "pipeline": [
              {
                "type": "readers.ept",
                "filename": "https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/entwine/geoid18/10296/ept.json",
                "bounds": "([651890,652150],[4559070,4559335])",
                "resolution": 0.35
              },
              {
                "type": "writers.copc",
                "filename": "data/s477/lidar/generated/s477-preliminary-site.copc.laz",
                "forward": "all"
              }
            ]
          }
          JSON
          pdal pipeline /tmp/s477-crop.json
          pdal info --summary data/s477/lidar/generated/s477-preliminary-site.copc.laz > data/s477/lidar/generated/s477-preliminary-site-summary.json

      - name: Build browser point derivative
        shell: bash -el {0}
        run: |
          cat > /tmp/s477-web.json <<'JSON'
          {
            "pipeline": [
              "data/s477/lidar/generated/s477-preliminary-site.copc.laz",
              {
                "type": "filters.decimation",
                "step": 10
              },
              {
                "type": "writers.text",
                "filename": "/tmp/s477-points.csv",
                "order": "X,Y,Z,Classification",
                "keep_unspecified": "false"
              }
            ]
          }
          JSON
          pdal pipeline /tmp/s477-web.json
          python - <<'PY'
          import csv, json, math, struct
          from pathlib import Path

          src = Path('/tmp/s477-points.csv')
          out = Path('data/s477/lidar/generated/s477-site-points.bin')
          meta = Path('data/s477/lidar/generated/s477-site-web.json')
          origin = (652020.3704419786, 4559201.911294786, 0.0)
          max_points = 120000
          rows = []
          with src.open(newline='') as f:
              reader = csv.DictReader(f)
              for r in reader:
                  try:
                      rows.append((float(r['X']), float(r['Y']), float(r['Z']), float(r.get('Classification', 0) or 0)))
                  except (KeyError, ValueError):
                      pass
          if len(rows) > max_points:
              step = len(rows) / max_points
              rows = [rows[min(len(rows)-1, int(i*step))] for i in range(max_points)]
          if not rows:
              raise SystemExit('No points produced by crop')
          z0 = min(r[2] for r in rows)
          with out.open('wb') as f:
              for x,y,z,c in rows:
                  f.write(struct.pack('<ffff', x-origin[0], y-origin[1], z-z0, c))
          payload = {
              'project': 'S477',
              'status': 'preliminary-geocoded-site-crop',
              'source': 'NOAA 2023 CT GIS Lidar dataset 10296 EPT',
              'sourceEpt': 'https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/entwine/geoid18/10296/ept.json',
              'crs': 'NAD83(2011) / UTM zone 18N',
              'cropBoundsMeters': {'minX':651890,'maxX':652150,'minY':4559070,'maxY':4559335},
              'cropSizeMeters': {'width':260,'height':265},
              'approxCenterWgs84': {'lat':41.1699104309082,'lon':-73.1877975463867},
              'originUtm': {'x':origin[0],'y':origin[1],'z':z0},
              'pointCount': len(rows),
              'strideBytes': 16,
              'layout': ['xOffsetMeters','yOffsetMeters','zOffsetMeters','classification'],
              'binary': 's477-site-points.bin',
              'note': 'This is a real point-cloud crop around the geocoded S477 site center using a 260 m x 265 m preliminary buffer. Replace the rectangular crop with the authoritative parcel polygon when City GIS/property geometry is confirmed.'
          }
          meta.write_text(json.dumps(payload, indent=2) + '\n')
          print(f'Wrote {len(rows):,} browser points')
          PY

      - name: Record provenance and checksums
        shell: bash -el {0}
        run: |
          sha256sum data/s477/lidar/generated/s477-preliminary-site.copc.laz data/s477/lidar/generated/s477-site-points.bin > data/s477/lidar/generated/SHA256SUMS.txt
          du -h data/s477/lidar/generated/*

      - name: Commit generated site crop
        shell: bash
        run: |
          git config user.name "S477 Data Pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/s477/lidar/generated
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate S477 preliminary LiDAR site crop"
          git push origin HEAD:feature/s477-smart-church
