name: Equity Uprise Repo-to-Building Audit

on:
  push:
    branches:
      - architecture/equity-uprise-core-v2
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: equity-uprise-repo-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: architecture/equity-uprise-core-v2
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify Equity Uprise repo-source coverage
        run: python docs/design/equity-uprise-building/production/verify_equity_uprise_repo_sources.py

      - name: Verify Equity Uprise building program coverage
        run: python docs/design/equity-uprise-building/production/verify_equity_uprise_program_coverage.py
