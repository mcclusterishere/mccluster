          # compute_lease_authority_v2 (20261020210718) and intel_decision_integrity_v2 (20261020211313)
          # were promoted; the reset above applies them from supabase/migrations/.
name: Reconciliation CI

on:
  push:
    branches:
      - reconcile/equity-uprise-20260908
  pull_request:
    branches:
      - main
      - feat/world-as-feed-globe
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: workers/mccluster
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Worker tests
        working-directory: workers/mccluster
        run: npm test
      - name: Parse routing surfaces
        run: |
          node --check workers/mccluster/src/entry.js
          node --check workers/mccluster/src/index.js
          node --check workers/mccluster/src/client.js
          node --check workers/mccluster/src/connect.js
          node --check workers/mccluster/src/ai/router.js
          node --check workers/mccluster/src/ai/objectives.js
          node --check workers/mccluster/src/media/router.js
          node --check workers/mccluster/src/social/router.js
          node --check workers/mccluster/src/prim3/index.js
          node --check js/prim3.js
          node --check js/prim3-sync.js
          node --check js/equity-uprise-institutional.js
          node --check js/equity-uprise-fellowship-live.js
      - name: Assert private conversation ingestion boundary
        run: |
          grep -F 'private_context_reference_only: true' workers/mccluster/src/ai/objectives.js
          grep -F 'conversation_id: conversationId' workers/mccluster/src/ai/objectives.js
          if grep -F 'messages:' workers/mccluster/src/ai/objectives.js; then
            echo 'Objective synthesis enqueue must not persist raw messages in public ops jobs.' >&2
            exit 1
          fi
      - name: Reject unresolved reconciliation markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'; then
            echo 'Unresolved merge marker found.' >&2
            exit 1
          fi

  core:
    name: McCluster Core contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Parse Core runner, broker, and executors
        working-directory: core
        run: npm run check
      - name: Parse VPS control-plane scripts
        run: |
          bash -n scripts/deploy-ovh-core.sh
          bash -n scripts/mccluster-vps-reconcile.sh
          bash -n scripts/bootstrap-vps-self-management.sh
      - name: Test Operator OS control spine
        run: |
          node --check js/control-room-v2.js
          node --test scripts/test/operator-control-spine.test.mjs
          node --test scripts/test/control-surface.test.mjs
      - name: Test Action mission camera loop
        run: |
          node --check js/mnet.js
          node --check js/action.js
          node --check js/gateway.js
          node --check workers/mccluster/src/platform-api.js
          node --test scripts/test/action-camera-loop.test.mjs
          node --test scripts/test/action-mission-funnel.test.mjs
      - name: Test provider-independent capability resolution
        working-directory: core
        run: npm run test:capabilities
      - name: Test compute leases and reviewed newsroom output
        working-directory: core
        run: node --test test/compute-*.test.mjs test/node-agent-runtime.test.mjs test/news-brief-validation.test.mjs
      - name: Test bounded objective reflection
        working-directory: core
        run: npm run test:reflection
      - name: Test private conversation objective synthesis
        working-directory: core
        run: npm run test:objective-synthesis
      - name: Test Initiative OS portfolio planning
        working-directory: core
        run: npm run test:initiative-os
      - name: Test proof-before-done completion evidence
        working-directory: core
        run: npm run test:evidence
      - name: Test canonical system health
        working-directory: core
        run: npm run test:system-health
      - name: Test autonomous game studio production loop
        working-directory: core
        run: npm run test:game-studio
      - name: Assert Core security and capability guardrails
        run: |
          grep -F "draft-only" core/src/executors/code-patch.mjs
          grep -F "git push *" core/opencode/opencode.json
          grep -F 'IPAddressDeny=any' core/systemd/mccluster-opencode.service
          grep -F 'IPAddressAllow=localhost' core/systemd/mccluster-opencode.service
          grep -F "127.0.0.1" core/src/tool-broker.mjs
          grep -F "MCP-Protocol-Version" core/src/tools/mcp-http.mjs
          grep -F "https://api.mccluster.org/v1/media/mcp" core/src/tools/registry.mjs
          grep -F 'ops_agent_jobs' core/src/supabase.mjs
          grep -F 'buildCompletionEvidence' core/src/runner.mjs
          grep -F 'assertCompletionEvidence(job, output);' core/src/supabase.mjs
          grep -F 'no completion evidence policy exists for job type' core/src/completion-evidence.mjs
          grep -F "SAFE_JOB_TYPES = new Set(['local_analysis', 'repo_health', 'code_patch'])" core/src/reflection-policy.mjs
          grep -F 'autonomous_draft_only: true' core/src/reflection-policy.mjs
          grep -F 'Never propose deploy, merge' core/src/executors/objective-reflection.mjs
          grep -F 'objective_reflection only' core/src/executors/portfolio-plan.mjs
          grep -F 'transcript_persisted_in_public_job: false' core/src/executors/objective-synthesis.mjs
          grep -F 'MCCLUSTER_CONTEXT_TOKEN' core/src/context-client.mjs
          grep -F 'mccluster-system-health/v1' core/src/system-health.mjs
          grep -F 'assertCompletionEvidence' core/src/system-health.mjs
          grep -F 'OnUnitActiveSec=5min' core/systemd/mccluster-core-system-health.timer
          grep -F '/v1/ai/system-health' workers/mccluster/src/ai/router.js
          grep -F '20260914191500' supabase/migrations/20260914191500_system_health_contract.sql
          grep -F 'OnCalendar=*-*-* 02:00:00 America/New_York' core/systemd/mccluster-core-portfolio-plan.timer
          grep -F 'OnUnitActiveSec=2h' core/systemd/mccluster-core-reflection.timer
          grep -F 'deploy/ovh-production' scripts/mccluster-vps-reconcile.sh
          grep -F 'merge-base --is-ancestor' scripts/mccluster-vps-reconcile.sh
          grep -F 'OWNER_JOB_TYPES' workers/mccluster/src/ai/router.js
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('core/capabilities/catalog.json', 'utf8'));
          const required = ['video.generate','model3d.generate','code.build','world.generate','research.web','game.build','deploy.preview'];
          const byId = new Map(catalog.capabilities.map((capability) => [capability.id, capability]));
          for (const id of required) {
            if (byId.get(id)?.lifecycle !== 'active') throw new Error(`${id} is not active`);
            if (!catalog.bindings.some((binding) => binding.capability === id && binding.status === 'active')) throw new Error(`${id} has no active binding`);
          }
          if (catalog.capabilities.some((capability) => capability.lifecycle === 'planned')) throw new Error('production catalog contains planned capabilities');
          NODE
          grep -F "CORE_CAPABILITY_BINDINGS_JSON" core/src/capabilities/registry.mjs
          if grep -R -nE 'SUPABASE_SERVICE_ROLE_KEY=[^[:space:]]+' core --exclude='*.example'; then
            echo 'A Supabase service-role value appears committed under core/.' >&2
            exit 1
          fi

  edge-functions:
    name: Equity Uprise Edge Function contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check publication and private context control paths
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/_shared/eu-policy-os.ts \
            supabase/functions/eu-publish/index.ts \
            supabase/functions/eu-worker/index.ts \
            supabase/functions/context-core/index.ts \
            supabase/functions/context-decision/index.ts
      - name: Assert publication and context safety invariants
        run: |
          grep -F 'form.set("login_passwd", pass)' supabase/functions/eu-worker/index.ts
          if grep -F 'form.set("passwd", pass)' supabase/functions/eu-worker/index.ts; then
            echo 'Legacy Crossref password field is still present.' >&2
            exit 1
          fi
          grep -F 'unknown_capability' supabase/functions/eu-worker/index.ts
          grep -F 'request_hash: requestHash' supabase/functions/eu-publish/index.ts
          grep -F 'publication content hash changed after approval' supabase/functions/eu-worker/index.ts
          grep -F 'x-mccluster-context-token' supabase/functions/context-core/index.ts
          grep -F 'where c.org_id = ${orgId}::uuid and c.id = ${conversationId}::uuid' supabase/functions/context-core/index.ts
          grep -F '[functions.context-core]' supabase/config.toml
          grep -A1 '\[functions.context-core\]' supabase/config.toml | grep -F 'verify_jwt = false'

  admin-evidence:
    name: Admin evidence and pending SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test measurement, funding and offline research contracts
        run: |
          node --test scripts/test/control-analytics*.test.mjs scripts/test/analytics-measurement-ui.test.mjs scripts/test/funding-register-ui.test.mjs scripts/test/news-brief-page.test.mjs scripts/test/evidence-evaluation.test.mjs
          node scripts/funding/render-register-seed.mjs --check
      - name: Install pinned disposable PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/admin-evidence-tools" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.10
      - name: Replay pending migrations in isolated databases
        run: |
          export PGLITE_ROOT="$RUNNER_TEMP/admin-evidence-tools/node_modules/@electric-sql/pglite"
          export PGLITE_MODULE_PATH="$PGLITE_ROOT/dist/index.js"
          export PGLITE_MODULE="$PGLITE_MODULE_PATH"
          node scripts/test-analytics-measurement-db.mjs
          node scripts/compute-lease-sql-check.mjs
          node scripts/test-intel-integrity-db.mjs
          node scripts/funding/validate-register-db.mjs

  equity-uprise-rls:
    name: Equity Uprise RLS wall and offline function contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install PostgreSQL 16 server binaries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-16
      - name: Stand up a throwaway cluster and try to break into the Equity Uprise tables
        # supabase/tests/run-eu-tests.sh creates its own cluster in a temp
        # directory from /usr/lib/postgresql/16/bin and destroys it on exit;
        # nothing here touches the live project.
        run: bash supabase/tests/run-eu-tests.sh
      - name: Run the offline Supabase function contracts
        # Pure unit suites over the edge-function sources (TypeScript via
        # --experimental-strip-types); no Supabase, no network. Suites that
        # need a live stack stay in the `database` job above.
        run: |
          for suite in brain desk-flows domain flows inbox-auth mcp platforms price; do
            echo "== supabase/tests/$suite.test.mjs"
            node --experimental-strip-types "supabase/tests/$suite.test.mjs"
          done

  database:
    name: Supabase migration reset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: bash scripts/supabase-local-reset-with-replay.sh start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: bash scripts/supabase-local-reset-with-replay.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare the rebuilt schema with supabase/schema-manifest.json
        # The manifest is what supabase/migrations/ + supabase/replay_migrations/ build:
        # tables, columns, RLS, policies, functions (SECURITY DEFINER, EXECUTE grants),
        # triggers, buckets and views' security_invoker, by the same read-only SQL
        # scripts/db/verify-production-schema.mjs runs against production. No production
        # credentials here: this is the disposable stack. When a migration changes the
        # schema on purpose, refresh the manifest from the uploaded artifact
        # (reset-schema/schema-manifest.json). Runs before the behaviour tests write rows.
        env:
          RESET_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          mkdir -p "$RUNNER_TEMP/reset-schema"
          node scripts/db/verify-production-schema.mjs --database-url-env RESET_DB_URL --mode reset \
            --snapshot-out "$RUNNER_TEMP/reset-schema/reset-schema-snapshot.json" \
            --write-manifest --manifest "$RUNNER_TEMP/reset-schema/schema-manifest.json" \
            --report-json "$RUNNER_TEMP/reset-schema/report.json" --no-fail
          node scripts/db/verify-production-schema.mjs --snapshot "$RUNNER_TEMP/reset-schema/reset-schema-snapshot.json" --mode reset \
            --report-json "$RUNNER_TEMP/reset-schema/manifest-diff.json"
      - name: Upload the rebuilt schema snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reset-schema
          path: ${{ runner.temp }}/reset-schema/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify analytics funnel exact-window boundaries
        env:
          PGPASSWORD: postgres
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/analytics_funnel_exact_window.behaviour.sql
      - name: Verify regional mission authorization against database roles
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/action_globe_join_authorization.behaviour.sql
      - name: Exercise withdrawn member rejoin with mission at capacity
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/action_globe_rejoin_capacity.integration.sql
      - name: Verify ingestion leases, unknown measurements and private spatial storage
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/analytics_ingestion_pipeline.behaviour.sql
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify native PostgreSQL evidence and lease races
        run: |
          npm install --prefix "$RUNNER_TEMP/native-admin-tools" --ignore-scripts --no-audit --no-fund --package-lock=false postgres@3.4.5
          export POSTGRES_MODULE_PATH="$RUNNER_TEMP/native-admin-tools/node_modules/postgres/src/index.js"
          export NATIVE_TEST_DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          # compute_lease_authority_v2 (20261020210718) and intel_decision_integrity_v2 (20261020211313)
          # were promoted; the reset above applies them from supabase/migrations/.
          node scripts/compute-lease-sql-check.mjs
          node scripts/test-intel-integrity-db.mjs
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
