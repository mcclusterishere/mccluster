name: Reconciliation CI

on:
  push:
    branches:
      - reconcile/equity-uprise-20260908
      - reconcile/autonomy-fabric-stack-v1
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: workers/mccluster
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Worker tests
        working-directory: workers/mccluster
        run: npm test
      - name: Parse routing surfaces
        run: |
          node --check workers/mccluster/src/entry.js
          node --check workers/mccluster/src/index.js
          node --check workers/mccluster/src/client.js
          node --check workers/mccluster/src/connect.js
          node --check workers/mccluster/src/ai/router.js
          node --check workers/mccluster/src/ai/objectives.js
          node --check workers/mccluster/src/fabric/router.js
          node --check workers/mccluster/src/media/router.js
          node --check workers/mccluster/src/social/router.js
          node --check workers/mccluster/src/prim3/index.js
          node --check js/prim3.js
          node --check js/prim3-sync.js
          node --check js/equity-uprise-institutional.js
          node --check js/equity-uprise-fellowship-live.js
      - name: Assert private objective synthesis and Fabric handoff
        run: |
          grep -F "queueObjectiveSynthesis" workers/mccluster/src/ai/router.js
          grep -F "job_type: 'objective_synthesis'" workers/mccluster/src/ai/objectives.js
          grep -F "private_context_reference_only: true" workers/mccluster/src/ai/objectives.js
          grep -F "synthesize_objectives === false" workers/mccluster/src/ai/objectives.js
          grep -F "resolution=ignore-duplicates" workers/mccluster/src/ai/objectives.js
          grep -F "raw conversation messages are forbidden in fabric events" workers/mccluster/src/fabric/router.js
          grep -F "fabric origin/source mismatch" workers/mccluster/src/fabric/router.js
          grep -F "role: 'eq.owner'" workers/mccluster/src/entry.js
          grep -F "receipt_id: receipt.id" workers/mccluster/src/ai/router.js
          if grep -nE 'messages[[:space:]]*:' workers/mccluster/src/ai/objectives.js; then
            echo 'Raw conversation messages must not be copied into public synthesis jobs.' >&2
            exit 1
          fi
          if grep -nE 'external_conversation_id:|idempotency_key:|source_url:' workers/mccluster/src/ai/router.js; then
            echo 'Fabric conversation events must remain reference-only.' >&2
            exit 1
          fi
      - name: Reject unresolved reconciliation markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'; then
            echo 'Unresolved merge marker found.' >&2
            exit 1
          fi

  core:
    name: McCluster Core contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Core runner, broker, executors, and Fabric
        working-directory: core
        run: npm run check
      - name: Test provider-independent capability resolution
        working-directory: core
        run: npm run test:capabilities
      - name: Test bounded objective reflection
        working-directory: core
        run: npm run test:reflection
      - name: Test Initiative OS portfolio planning
        working-directory: core
        run: npm run test:initiative-os
      - name: Test dependency-aware objective plans
        working-directory: core
        run: npm run test:plans
      - name: Test conversation objective synthesis
        working-directory: core
        run: npm run test:synthesis
      - name: Test three-node Fabric envelopes
        working-directory: core
        run: npm run test:fabric
      - name: Assert Core security, privacy, and autonomy guardrails
        run: |
          grep -F "draft-only" core/src/executors/code-patch.mjs
          grep -F "git push *" core/opencode/opencode.json
          grep -F 'IPAddressDeny=any' core/systemd/mccluster-opencode.service
          grep -F 'IPAddressAllow=localhost' core/systemd/mccluster-opencode.service
          grep -F "127.0.0.1" core/src/tool-broker.mjs
          grep -F "MCP-Protocol-Version" core/src/tools/mcp-http.mjs
          grep -F "https://api.mccluster.org/v1/media/mcp" core/src/tools/registry.mjs
          grep -F 'ops_agent_jobs' core/src/supabase.mjs
          grep -F "SAFE_JOB_TYPES = new Set(['local_analysis', 'repo_health', 'objective_plan'])" core/src/reflection-policy.mjs
          grep -F "SAFE_PLAN_JOB_TYPES = new Set(['local_analysis', 'repo_health'])" core/src/plan-policy.mjs
          grep -F 'plan_dependencies' core/src/supabase.mjs
          grep -F 'resolution=ignore-duplicates' core/src/supabase.mjs
          grep -F "['objective_synthesis', objectiveSynthesis]" core/src/runner.mjs
          grep -F 'MCCLUSTER_CONTEXT_TOKEN' core/src/context-client.mjs
          grep -F 'transcript_persisted_in_public_job: false' core/src/executors/objective-synthesis.mjs
          grep -F 'status: '\''active'\''' core/src/objective-store.mjs
          grep -F 'Never mark objectives completed or cancelled' core/src/executors/objective-synthesis.mjs
          grep -F 'Never propose code_patch' core/src/executors/objective-reflection.mjs
          grep -F 'objective_reflection only' core/src/executors/portfolio-plan.mjs
          grep -F 'raw conversation messages are forbidden in fabric events' core/src/fabric.mjs
          grep -F 'resolution=ignore-duplicates' core/src/fabric.mjs
          grep -F 'ExecStart=/usr/bin/node /opt/mccluster/core/src/fabric-daemon.mjs' core/systemd/mccluster-fabric.service
          grep -F 'ReadWritePaths=/var/lib/mccluster-core' core/systemd/mccluster-fabric.service
          grep -F 'OnCalendar=*-*-* 02:00:00 America/New_York' core/systemd/mccluster-core-portfolio-plan.timer
          grep -F 'OnCalendar=*-*-* 02:30:00 America/New_York' core/systemd/mccluster-core-reflection.timer
          grep -F '"id": "video.generate"' core/capabilities/catalog.json
          grep -F '"id": "model3d.generate"' core/capabilities/catalog.json
          grep -F '"id": "code.build"' core/capabilities/catalog.json
          grep -F "CORE_CAPABILITY_BINDINGS_JSON" core/src/capabilities/registry.mjs
          if grep -R -nE 'SUPABASE_SERVICE_ROLE_KEY=[^[:space:]]+' core --exclude='*.example'; then
            echo 'A Supabase service-role value appears committed under core/.' >&2
            exit 1
          fi
          if grep -R -nE 'MCCLUSTER_CONTEXT_TOKEN=[^[:space:]]+' core --exclude='*.example'; then
            echo 'A private context token appears committed under core/.' >&2
            exit 1
          fi
          if grep -R -nE 'MCCLUSTER_FABRIC_TOKEN=[^[:space:]]+' core --exclude='*.example'; then
            echo 'A Fabric token appears committed under core/.' >&2
            exit 1
          fi

  edge-functions:
    name: Edge Function contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check private context and publication paths
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/context-core/index.ts \
            supabase/functions/context-ingest/index.ts \
            supabase/functions/_shared/eu-policy-os.ts \
            supabase/functions/eu-publish/index.ts \
            supabase/functions/eu-worker/index.ts
      - name: Assert private Core context boundary
        run: |
          grep -F "x-mccluster-context-token" supabase/functions/context-core/index.ts
          grep -F "from ai_context.messages" supabase/functions/context-core/index.ts
          grep -F "[functions.context-core]" supabase/config.toml
          grep -A1 -F "[functions.context-core]" supabase/config.toml | grep -F "verify_jwt = false"
          grep -F 'created_at' supabase/functions/context-ingest/index.ts
          if grep -R -nE 'MCCLUSTER_CONTEXT_TOKEN[[:space:]]*=[[:space:]]*[^[:space:]]+' supabase/functions; then
            echo 'A private context token value appears committed.' >&2
            exit 1
          fi
      - name: Assert publication safety invariants
        run: |
          grep -F 'form.set("login_passwd", pass)' supabase/functions/eu-worker/index.ts
          if grep -F 'form.set("passwd", pass)' supabase/functions/eu-worker/index.ts; then
            echo 'Legacy Crossref password field is still present.' >&2
            exit 1
          fi
          grep -F 'unknown_capability' supabase/functions/eu-worker/index.ts
          grep -F 'request_hash: requestHash' supabase/functions/eu-publish/index.ts
          grep -F 'publication content hash changed after approval' supabase/functions/eu-worker/index.ts

  database:
    name: Supabase migration reset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
