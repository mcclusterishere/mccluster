name: AI Context Dispatch (isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261128094143_ai_context_dispatch_v1.sql'
      - 'supabase/pending/20261124235900_ai_context_dispatch_v1.rollback.sql'
      - 'supabase/tests/ai_context_dispatch.*.sql'
      - '.github/workflows/ai-context-dispatch-db.yml'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: dispatch_fixture_only
          POSTGRES_DB: dispatch_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: dispatch_fixture_only
      PGDATABASE: dispatch_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai_context_dispatch.stub.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128094143_ai_context_dispatch_v1.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128094143_ai_context_dispatch_v1.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai_context_dispatch.behaviour.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/pending/20261124235900_ai_context_dispatch_v1.rollback.sql
      - run: test "$(psql -tAc "select to_regclass('ai_context.dispatch_turns') is null")" = t
