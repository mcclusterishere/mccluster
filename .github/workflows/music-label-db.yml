name: Music label artists
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'supabase/pending/music_label_artists_v1*.sql'
      - 'supabase/migrations/20260920041011_music_creator_platform_v1.sql'
      - 'supabase/migrations/20260920041250_music_commerce_v1.sql'
      - 'supabase/migrations/20261030001000_music_release_payment_integrity_v1.sql'
      - 'supabase/tests/music_label_artists.*.sql'
      - 'supabase/tests/music_creator_onboarding.stub.sql'
      - 'supabase/tests/music_release_integrity.stub.sql'
      - 'supabase/tests/supabase_api_roles.stub.sql'
      - 'supabase/schema-manifest.json'
      - 'scripts/test-music-label-db.sh'
      - 'scripts/test/music-label.test.mjs'
      - 'js/control-room/music-label.js'
      - '.github/workflows/music-label-db.yml'
  workflow_dispatch:
jobs:
  music-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Label model contracts
        run: node --test scripts/test/music-label.test.mjs
      - name: Isolated PostgreSQL label behaviour, rollback to production's guards and policies
        run: bash scripts/test-music-label-db.sh
