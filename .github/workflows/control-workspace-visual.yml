name: Control workspace visual proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'control.html'
      - 'js/control-room/workspace*.js'
      - 'css/control-workspace.css'
      - 'scripts/e2e/control-workspace.e2e.mjs'
      - 'scripts/test/control-workspace.test.mjs'
      - '.github/workflows/control-workspace-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare pinned browser-test dependencies outside the repository
        run: |
          npm install --prefix /tmp/control-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0
          /tmp/control-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve a source-only QA bundle for restricted-network workspaces
        run: |
          mkdir -p /tmp/control-proof
          git rev-parse HEAD > /tmp/control-proof/source-commit.txt
          git archive --format=tar.gz -o /tmp/control-proof/control-source.tar.gz HEAD control.html js css data/geo assets/img scripts/test scripts/e2e docs/control-plane docs/PRODUCT-ARCHITECTURE-ROADMAP.md data/product-context.json AGENTS.md CODEX.md CLAUDE.md package.json package-lock.json workers/mccluster/src workers/mccluster/test tools core
          tar -czf /tmp/control-proof/cesium-1.131.0.tar.gz -C /tmp/control-qa/node_modules/cesium Build/Cesium
      - name: Exercise the actual Control page when the implementation lands
        env:
          PLAYWRIGHT_DIR: /tmp/control-qa/node_modules
          CESIUM_DIR: /tmp/control-qa/node_modules/cesium/Build/Cesium
          CONTROL_QA_OUTPUT: /tmp/control-proof/screenshots
        run: |
          if test -f scripts/e2e/control-workspace.e2e.mjs; then
            node --test scripts/test/control-workspace.test.mjs
            node scripts/e2e/control-workspace.e2e.mjs
          else
            echo 'QA bootstrap only. No interface implementation or browser acceptance claimed in this commit.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-workspace-proof-${{ github.run_id }}
          path: /tmp/control-proof
          retention-days: 7
