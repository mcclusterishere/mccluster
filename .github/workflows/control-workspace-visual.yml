name: Control workspace visual proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'control.html'
      - 'js/mnet-live.js'
      - 'css/mnet.css'
      - 'scripts/e2e/live-actors.e2e.mjs'
      - 'js/tabbar.js'
      - 'js/site-navigation.js'
      - 'css/site-navigation.css'
      - 'scripts/e2e/site-navigation.e2e.mjs'
      - 'js/control-room/workspace*.js'
      - 'js/control-room/analytics*.js'
      - 'js/control-room/forensics.js'
      - 'scripts/test/control-forensics.test.mjs'
      - 'js/control-room/news-context.js'
      - 'css/control-news-context.css'
      - 'scripts/e2e/news-context.e2e.mjs'
      - 'scripts/e2e/connections.e2e.mjs'
      - 'js/control-room/connections.js'
      - 'css/control-connections.css'
      - 'css/control-analytics*.css'
      - 'css/control-forensics.css'
      - 'scripts/e2e/site-health.e2e.mjs'
      - 'workers/mccluster/src/analytics/**'
      - 'workers/mccluster/test/analytics-camera-measurement.test.mjs'
      - 'scripts/e2e/analytics-unified.e2e.mjs'
      - 'scripts/e2e/analytics-tabs.e2e.mjs'
      - 'css/control-workspace.css'
      - 'scripts/e2e/control-workspace.e2e.mjs'
      - 'js/control-room/build-code.js'
      - 'scripts/e2e/control-build-code.e2e.mjs'
      - 'js/control-room/funding-intelligence.js'
      - 'scripts/e2e/funding-register.e2e.mjs'
      - 'scripts/e2e/analytics-measurement.e2e.mjs'
      - 'scripts/test/control-workspace.test.mjs'
      - 'js/control-room/desk-bot.js'
      - 'js/control-room-v2.js'
      - 'js/control-registry.js'
      - 'css/control-admin.css'
      - 'inbox.html'
      - 'supabase/functions/inbox/index.ts'
      - 'scripts/test/control-desk-bot.test.mjs'
      - 'scripts/e2e/control-desk-bot.e2e.mjs'
      - 'js/control-room/front-page.js'
      - 'index.html'
      - 'js/front-*.js'
      - 'scripts/e2e/control-front-page.e2e.mjs'
      - 'scripts/e2e/analytics-globe.e2e.mjs'
      - '.github/workflows/control-workspace-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare pinned browser-test dependencies outside the repository
        run: |
          npm install --prefix /tmp/control-qa --ignore-scripts --no-audit --no-fund --no-save playwright@1.57.0 cesium@1.131.0
          /tmp/control-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve a source-only QA bundle for restricted-network workspaces
        run: |
          mkdir -p /tmp/control-proof
          git rev-parse HEAD > /tmp/control-proof/source-commit.txt
          git archive --format=tar.gz -o /tmp/control-proof/control-source.tar.gz HEAD control.html inbox.html js css data/geo data/analytics assets/img scripts/test scripts/e2e supabase/functions/inbox docs/control-plane docs/PRODUCT-ARCHITECTURE-ROADMAP.md data/product-context.json AGENTS.md CODEX.md CLAUDE.md package.json workers/mccluster/src workers/mccluster/test tools core
          tar -czf /tmp/control-proof/cesium-1.131.0.tar.gz -C /tmp/control-qa/node_modules/cesium Build/Cesium
      - name: Exercise the actual Control page
        env:
          PLAYWRIGHT_DIR: /tmp/control-qa/node_modules
          CESIUM_DIR: /tmp/control-qa/node_modules/cesium/Build/Cesium
          CONTROL_QA_OUTPUT: /tmp/control-proof/screenshots
        run: |
          node --test scripts/test/control-workspace.test.mjs scripts/test/control-analytics*.test.mjs scripts/test/analytics-globe*.test.mjs scripts/test/control-forensics.test.mjs scripts/test/browser-diagnostics.test.mjs scripts/test/control-surface.test.mjs scripts/test/control-desk-bot.test.mjs
          node --test workers/mccluster/test/analytics-*.test.mjs
          node scripts/e2e/site-navigation.e2e.mjs /tmp/control-proof/navigation
          node scripts/e2e/control-workspace.e2e.mjs
          node scripts/e2e/analytics-unified.e2e.mjs /tmp/control-proof/analytics
          node scripts/e2e/analytics-tabs.e2e.mjs /tmp/control-proof/analytics-tabs
          node scripts/e2e/site-health.e2e.mjs /tmp/control-proof/site-health
          node scripts/e2e/news-context.e2e.mjs /tmp/control-proof/news-context
          node scripts/e2e/connections.e2e.mjs /tmp/control-proof/connections
          node scripts/e2e/live-actors.e2e.mjs
          node scripts/e2e/control-build-code.e2e.mjs /tmp/control-proof/build-code
          node scripts/e2e/funding-register.e2e.mjs /tmp/control-proof/funding
          node scripts/e2e/analytics-measurement.e2e.mjs /tmp/control-proof/analytics-measurement
          node scripts/e2e/control-desk-bot.e2e.mjs /tmp/control-proof/desk-bot
          node scripts/e2e/control-front-page.e2e.mjs /tmp/control-proof/front-page
          node scripts/e2e/analytics-globe.e2e.mjs /tmp/control-proof/analytics-globe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-workspace-proof-${{ github.run_id }}
          path: /tmp/control-proof
          retention-days: 7
