name: Deploy OVH Core

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact Git ref or commit to deploy
        required: true
        default: main
      confirm:
        description: Type DEPLOY_OVH to authorize server mutation
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-ovh-core
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_OVH' }}
    runs-on: ubuntu-latest
    environment: ovh-production
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve exact commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Core before transfer
        working-directory: core
        run: |
          npm run check
          npm test

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
        run: |
          test -n "$OVH_SSH_KEY"
          test -n "$OVH_HOST"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          PORT="${OVH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Transfer exact checkout to OVH staging
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          test -n "$OVH_HOST"
          test -n "$OVH_USER"
          PORT="${OVH_PORT:-22}"
          STAGE="/tmp/mccluster-deploy-${DEPLOY_SHA}"
          ssh -p "$PORT" "$OVH_USER@$OVH_HOST" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          rsync -az --delete -e "ssh -p $PORT" ./ "$OVH_USER@$OVH_HOST:$STAGE/"

      - name: Deploy and restart McCluster Core
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          PORT="${OVH_PORT:-22}"
          STAGE="/tmp/mccluster-deploy-${DEPLOY_SHA}"
          ssh -tt -p "$PORT" "$OVH_USER@$OVH_HOST" \
            "sudo bash '$STAGE/scripts/deploy-ovh-core.sh' '$STAGE' '$DEPLOY_SHA' && rm -rf '$STAGE'"

      - name: Verify exact deployed revision and services
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          PORT="${OVH_PORT:-22}"
          ssh -p "$PORT" "$OVH_USER@$OVH_HOST" \
            "systemctl is-active mccluster-core-runner.service && \
             systemctl is-active mccluster-core-tool-broker.service && \
             grep -Fq '\"commit_sha\":\"$DEPLOY_SHA\"' /opt/mccluster/core/.mccluster-deploy.json && \
             cat /opt/mccluster/core/.mccluster-deploy.json"

      - name: Deployment summary
        run: |
          echo "### OVH Core deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ inputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.commit.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: canonical /opt/mccluster/core" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime provenance: \`/opt/mccluster/core/.mccluster-deploy.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback snapshot created automatically before sync" >> "$GITHUB_STEP_SUMMARY"
