name: Verify or manually deploy OVH Core

on:
  push:
    branches: [deploy/ovh-production]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA already contained in main
        required: true
      confirm:
        description: Type DEPLOY_OVH to authorize break-glass SSH deployment
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-ovh-core
  cancel-in-progress: false

jobs:
  verify-self-reconcile:
    name: Verify OVH self-reconciliation
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate approved production revision
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main || {
            echo "Refusing verification: deploy ref is not contained in main" >&2
            exit 2
          }

      - name: Wait for OVH to self-reconcile to exact commit
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="$(curl --fail --silent --show-error --max-time 15 https://core.mccluster.org/health || true)"
            deployed="$(printf '%s' "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).deployment_sha||'')}catch{console.log('')}})")"
            if [[ "$deployed" = "$TARGET_SHA" ]]; then
              printf '%s\n' "$body"
              echo "Verified OVH self-reconciled to $TARGET_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $TARGET_SHA, got ${deployed:-<none>}"
            sleep 10
          done
          echo "OVH self-reconciliation did not converge to $TARGET_SHA" >&2
          exit 1

  deploy:
    name: Break-glass SSH deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_OVH' }}
    runs-on: ubuntu-latest
    environment: ovh-production
    steps:
      - name: Checkout main for provenance validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and checkout exact production commit
        id: commit
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main || {
            echo "Refusing deployment: target commit is not contained in main" >&2
            exit 2
          }
          git checkout --detach "${TARGET_SHA}"
          RESOLVED_SHA="$(git rev-parse HEAD)"
          test "$RESOLVED_SHA" = "$TARGET_SHA"
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Core before transfer
        working-directory: core
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Configure pinned SSH trust
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_KEY" || { echo 'Missing OVH_SSH_KEY' >&2; exit 1; }
          test -n "$OVH_KNOWN_HOSTS" || { echo 'Missing OVH_KNOWN_HOSTS' >&2; exit 1; }
          test -n "$OVH_HOST" || { echo 'Missing OVH_HOST' >&2; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Transfer exact checkout to OVH staging
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST"
          test -n "$OVH_USER"
          PORT="${OVH_PORT:-22}"
          STAGE="/tmp/mccluster-deploy-${DEPLOY_SHA}"
          SSH_OPTS="-p $PORT -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$OVH_USER@$OVH_HOST" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          rsync -az --delete -e "ssh $SSH_OPTS" ./ "$OVH_USER@$OVH_HOST:$STAGE/"

      - name: Deploy and restart McCluster Core
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          STAGE="/tmp/mccluster-deploy-${DEPLOY_SHA}"
          ssh -tt -p "$PORT" -o StrictHostKeyChecking=yes "$OVH_USER@$OVH_HOST" \
            "sudo bash '$STAGE/scripts/deploy-ovh-core.sh' '$STAGE' '$DEPLOY_SHA' && rm -rf '$STAGE'"

      - name: Verify exact deployed revision and services
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PORT: ${{ secrets.OVH_PORT }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${OVH_PORT:-22}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$OVH_USER@$OVH_HOST" \
            "systemctl is-active mccluster-core-runner.service && \
             systemctl is-active mccluster-core-tool-broker.service && \
             grep -Fq '\"commit_sha\":\"$DEPLOY_SHA\"' /opt/mccluster/core/.mccluster-deploy.json && \
             cat /opt/mccluster/core/.mccluster-deploy.json"
