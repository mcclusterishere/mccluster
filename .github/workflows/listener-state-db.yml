name: Listener state database contract
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'supabase/pending/listener_state_v1.sql'
      - 'supabase/tests/listener_state.behaviour.sql'
      - 'supabase/tests/supabase_api_roles.stub.sql'
      - 'scripts/test-listener-state-db.sh'
      - 'scripts/test/listener-state-contract.test.mjs'
      - 'js/pip.js'
      - '.github/workflows/listener-state-db.yml'
  workflow_dispatch:
jobs:
  listener-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Static Pocket contract
        run: node --test scripts/test/listener-state-contract.test.mjs
      - name: Isolated PostgreSQL RLS and upsert behavior
        run: bash scripts/test-listener-state-db.sh
