name: Regenerate CfAL resume artifacts
on:
  push:
    branches:
      - resume/digital-inclusion-cfal-20261011
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Regenerate resume artifacts
        run: |
          node tools/build-resume.mjs
          node tools/build-it-resume.mjs
          node tools/build-digital-inclusion-resume.mjs
      - name: Verify resume artifacts
        run: |
          node tools/verify-resume.mjs
          node tools/verify-it-resume.mjs
          node tools/verify-digital-inclusion-resume.mjs
          node --test scripts/test/resume-docx-sync.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate resume artifacts for digital inclusion cut"
          git push origin HEAD:resume/digital-inclusion-cfal-20261011
