name: API Economic Core CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/replay_migrations/**'
      - 'scripts/supabase-local-reset-with-replay.sh'
      - 'supabase/tests/api_compute_economics_regression.sql'
      - 'supabase/tests/api_rate_limit_regression.sql'
      - 'supabase/tests/compute_cogs_regression.sql'
      - 'workers/mccluster/src/compute-api.js'
      - 'workers/mccluster/src/platform-api*.js'
      - 'workers/mccluster/src/api-rate-limit.js'
      - 'workers/mccluster/src/entry-platform.js'
      - 'workers/mccluster/test/**'
      - '.github/workflows/api-economic-core-ci.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/replay_migrations/**'
      - 'scripts/supabase-local-reset-with-replay.sh'
      - 'supabase/tests/api_compute_economics_regression.sql'
      - 'supabase/tests/api_rate_limit_regression.sql'
      - 'supabase/tests/compute_cogs_regression.sql'
      - 'workers/mccluster/src/compute-api.js'
      - 'workers/mccluster/src/platform-api*.js'
      - 'workers/mccluster/src/api-rate-limit.js'
      - 'workers/mccluster/src/entry-platform.js'
      - 'workers/mccluster/test/**'
      - '.github/workflows/api-economic-core-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-economic-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundaries:
    name: Worker security boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run compute/provider security tests
        run: node --test workers/mccluster/test/compute-security.test.mjs
      - name: Assert rate limiter precedes API handlers
        run: |
          grep -F "enforceApiRateLimit" workers/mccluster/src/entry-platform.js
          grep -F "api_enforce_rate_limit" workers/mccluster/src/api-rate-limit.js
          grep -F "status: 429" workers/mccluster/src/api-rate-limit.js

  database-regression:
    name: Credits, billing, idempotency, rate-limit, and COGS regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: bash scripts/supabase-local-reset-with-replay.sh start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: bash scripts/supabase-local-reset-with-replay.sh
      - name: Run API and compute economic regression suite
        env:
          PGPASSWORD: postgres
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/api_compute_economics_regression.sql
      - name: Run API rate-limit regression suite
        env:
          PGPASSWORD: postgres
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/api_rate_limit_regression.sql
      - name: Run compute COGS regression suite
        env:
          PGPASSWORD: postgres
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/compute_cogs_regression.sql
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
