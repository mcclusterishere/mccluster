name: API Economic Core CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/api_compute_economics_regression.sql'
      - 'workers/mccluster/src/compute-api.js'
      - 'workers/mccluster/src/platform-api*.js'
      - 'workers/mccluster/test/**'
      - '.github/workflows/api-economic-core-ci.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/api_compute_economics_regression.sql'
      - 'workers/mccluster/src/compute-api.js'
      - 'workers/mccluster/src/platform-api*.js'
      - 'workers/mccluster/test/**'
      - '.github/workflows/api-economic-core-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-economic-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundaries:
    name: Worker security boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run compute/provider security tests
        run: node --test workers/mccluster/test/compute-security.test.mjs

  database-regression:
    name: Credits, billing, and idempotency regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run API and compute economic regression suite
        env:
          PGPASSWORD: postgres
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/api_compute_economics_regression.sql
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup || true
