# Weekly dependency audit. Dependabot opens pull requests only; nothing
# here merges or deploys, and the PRs run the same gates as any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /workers/mccluster
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
