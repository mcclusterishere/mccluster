<!doctype html><html lang="en" data-theme="dark"><head><script src="js/shell-boot.js?v=__STAMP__"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PRIM3 · Reviewed missions</title><link rel="stylesheet" href="css/style.css?v=__STAMP__"><link rel="stylesheet" href="css/prim3-mission.css?v=__STAMP__"><link rel="stylesheet" href="css/prim3-released-mission.css?v=__STAMP__"></head><body>
<section data-owner-gate data-owner-template="releaseTpl" data-owner-load="js/prim3-mission/released-app.mjs?v=__STAMP__"><h1>Reviewed missions</h1><p data-owner-msg>Checking access…</p></section>
<template id="releaseTpl"><main class="pm"><h1>Reviewed missions</h1><p>Fictional regional training with checkpoint math. News expires 24 hours after publication. Tactical results are browser-reported; math answers are checked separately.</p>
<section id="releaseReview"><h2>Review a release</h2><p>Choose an existing news source or clearly labeled offline practice. Review the publisher source before approving it.</p><label>Source<select id="releaseSource"><option value="">Offline practice · no news claim</option></select></label><a id="releaseSourceLink" target="_blank" rel="noopener noreferrer" hidden>Read publisher source</a>
<label>Country (ISO)<input id="releaseCountry" value="US" maxlength="2"></label><label>Regional label<input id="releasePlace" value="Bridgeport" maxlength="120"></label><label>Latitude<input id="releaseLat" type="number" value="41.18" step="any"></label><label>Longitude<input id="releaseLon" type="number" value="-73.19" step="any"></label><label>Public geography reference<input id="releaseGeo" type="url" value="https://www.bridgeportct.gov/"></label><label>Terrain<select id="releaseTerrain"><option>urban</option><option>coastal</option><option>woodland</option></select></label><label>Objective<select id="releaseObjective"><option value="restore">Tech: restore training network</option><option value="survey">Recon: survey safe route</option><option value="recover">Entry: recover training supplies</option></select></label><label>News theme<select id="releaseTheme"><option>comms</option><option>power</option><option>logistics</option><option>water</option><option>transport</option></select></label><label>Layout seed<input id="releaseSeed" type="number" min="0" max="4294967295" value="42"></label>
<label><input type="checkbox" id="releaseFiction"> Fiction and suitability reviewed</label><label><input type="checkbox" id="releaseGeography"> Regional geography reviewed; this is a synthetic layout</label><label><input type="checkbox" id="releaseNews"> Publisher source, date and event country reviewed (required for news)</label><button id="releasePublish" disabled>Approve immutable release</button></section>
<section><h2>Saved releases</h2><div id="releaseList"></div></section>
<section id="releaseBrief" hidden><h2 id="releaseTitle"></h2><p id="releaseBriefText"></p><p id="releaseExpiry"></p><label>Play variant<select id="learningVariant"><option value="generated">Generated side operation</option><option value="transit-relay">Transit / Relay</option><option value="equity-uprise-hq">Equity Uprise HQ</option><option value="equity-uprise-b1">B1 · Restore the Picture</option><option value="equity-uprise-b1-attack">B1 · Blind the Floor</option><option value="courtyard">Courtyard study</option><option value="city">City street simulation</option></select></label><label>Learning mode<select id="learningTopology"><option value="legacy">Existing row-distance practice</option><option value="square">Square cardinal steps</option><option value="hex">Hex axial steps (City only)</option></select></label><p id="learningFrame"></p><button id="releaseStart">Acknowledge brief and enter mission</button><button id="releaseRevoke">Revoke this release</button></section>
<section id="releasePlay" hidden><div class="released-layout"><iframe id="releaseGame" title="PRIM3 tactical mission" allow="fullscreen"></iframe><section><h2>Checkpoint math</h2><p id="releaseCheckpoint"></p><p id="releaseQuestion"></p><label>Your answer (whole steps)<input id="releaseAnswer" inputmode="numeric" maxlength="9"></label><button id="releaseSubmit">Check answer</button><button id="releaseHint">Show scaffold</button><label>Tactical outcome (your report)<select id="releaseOutcome"><option value="abandoned">Unfinished / stopped</option><option value="completed">Completed</option></select></label><button id="releaseFinish">Save debrief</button><p id="releaseSummary"></p></section></div></section>
<p id="releaseStatus" role="status">Connecting…</p><button id="releaseRetry" hidden>Retry pending learning request</button><button id="releaseLeave" hidden>Leave expired or revoked mission</button><p>No Principles credit, competency rating or credential is awarded.</p></main></template><script type="module" src="js/owner-only.mjs?v=__STAMP__"></script><script src="js/tabbar.js?v=__STAMP__"></script></body></html>
