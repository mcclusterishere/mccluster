<section data-owner-gate data-owner-template="hexTpl" data-owner-load="js/prim3-tactics/hex-ui.mjs"><h1>PRIM3 · Shared Fate</h1><p data-owner-msg>Checking access…</p></section>
<template id="hexTpl"><main><header><div><p class="eyebrow">PRIM3 / SHARED FATE · PROPOSED CLIENT EXERCISE</p><h1>Restore independent service.</h1></div><a href="prim3-transit.html">Return to Transit menu</a></header>
<p id="training-intro">A fictional client has two connections with one shared upstream. During an authorized continuity exercise it fails. Choose service priorities, configure independent fallback, test under failure, then independently verify and extract. Local simulation; no story or mastery write.</p>
<section id="shared-briefing" hidden><h2>HQ introductions → fictional client deployment</h2><p>This briefing introduces each character at their established workplace. It does not simulate walking through currently closed HQ floors.</p><ul><li>Sari Wulandari — F2 telecom/cohort desk (F2-DESK-SARI-WULANDARI). Cross-trained Field-E and telecom experience fit service leadership and access continuity.</li><li>Minh Tran — B1 hardware/firmware bench (B1-WORKSHOP-BENCH-01). Field-T prepares the bounded client device configuration.</li><li>Rafael Costa — F3 Field-R workstation (F3-DESK-RAFAEL-COSTA). Dependency mapping earns the route evidence.</li><li>Helen Clarke — F6 director office (F6-OFFICE-HELEN-CLARKE-DESK). Command-side resource authority; she is not a squad technician.</li></ul><p>F3 planning may assemble the team; B1 is Minh’s technical preparation, not everybody’s home. Both client links A/B share one upstream. The exercise removes it. Find an independent fallback and verify it under failure.</p><a id="shared-return" href="prim3-transit.html?level=equity-uprise-hq">Return to headquarters</a></section><div class="toolbar"><strong id="status"></strong><button id="end">End turn</button><button id="restart">Restart Shared Fate</button><button id="view">Switch to 3D</button><button id="focus">Focus squad</button></div>
<div class="layout"><section aria-label="Tactical battlefield"><div id="scene" hidden></div><div id="map"></div><p class="legend">Blue outline: one AP · Amber: dash, two AP · Red: squad · Blue figure: opposition · O: office telemetry · A: office service access · R: equipment bay backhaul · X: outdoor extraction</p><p id="graphics" role="status"></p></section>
<aside><div id="squad" aria-label="Select operative"></div><h2 id="actor"></h2><p id="stats"></p><p id="objective"></p><div id="actions" class="toolbar"><button data-action="overwatch">Overwatch</button><button data-action="hunker">Hunker</button><button data-action="reload">Reload</button><button data-action="extract">Extract</button></div><section id="network-lab" hidden><h2>Shared Fate · Client workbench</h2><p>Fictional client continuity exercise. No network traffic, hosted compute or competency credit. Configure the device, then independently verify its service.</p><pre id="lab-evidence"></pre><label>Subnet prefix <input id="lab-prefix" type="number" min="24" max="30" value="28"></label><label>Gateway <input id="lab-gateway" value="10.44.8.1" autocomplete="off"></label><label>Reserved Mbps <input id="lab-bandwidth" type="number" min="1" max="30" value="12"></label><section id="shared-controls" hidden><label>Uplink <select id="lab-uplink"><option>A</option><option>B</option><option value="fallback">Independent fallback</option></select></label><p>Helen’s approved choices, implemented by Sari for 1 AP. Headline: 22 Mbps broadcast + 6 essential on 24 Mbps fallback (some appointments missed). Reduced: 8 + 6. Cancelled: 0 + 6, preserving more next-operation capacity.</p><div id="shared-priority"><button data-policy="headline">Keep headline</button><button data-policy="reduced">Reduce quality</button><button data-policy="cancelled">Cancel broadcast</button></div><button id="shared-test">Minh: test upstream failure · 1 AP</button></section><button id="lab-prepare">Preview configuration</button><div id="lab-actions"><button data-lab-action="observe">Recon: inspect · 1 AP</button><button data-lab-action="hold">Entry: hold access · 1 AP</button><button data-lab-action="verify">Technical: verify · 1 AP</button><button data-lab-action="resetLab">Technical: restore device · 1 AP</button><button data-lab-action="hint">Hint · 1 AP</button></div><button id="lab-export">Export local evidence</button><details><summary>Device state, probes and separate results</summary><pre id="lab-result"></pre></details><p id="shared-service" aria-live="polite">Service not yet independently verified.</p><p>Completion requires independent fallback with at least 1 of 6 essential Mbps. Partial recovery may still miss appointments; inspect the measured result. Configuration and priorities lock once extraction begins.</p><p>Configured ≠ tested under failure ≠ independently verified. Consequences stay in this fictional drill’s debrief.</p></section><h2>Visible targets</h2><div id="targets"></div><section id="orders" aria-label="Current order"><strong id="order-unit"></strong><p id="preview" aria-live="polite">Select a hex to preview a route.</p><button id="confirm" disabled>Confirm order</button><button id="cancel">Cancel</button><p id="message" role="status"></p></section><details><summary>How to play · interiors v2</summary><p>Select an operative, then a reachable hex. Review metres and AP before confirming. Firing costs one AP under the current PRIM3 rules. Overwatch reacts to enemy movement; reload uses one AP. Low cover protects only from its facing direction. Opaque high obstacles block sight. Use Recon and Entry to protect Technical. Rafael enters office telemetry at O to inspect dependencies. Sari selects priorities in the office service room at A. Minh enters the equipment bay backhaul room at R to configure the client device, test upstream failure, and independently verify. Sari must enter the office service room and hold access at A on each working turn. Then move each operative to X and extract. Losing an operative or running out of time fails this drill.</p><p>Keyboard: Tab through controls and hexes, Enter to select; Escape cancels. The 2D map is fully playable. 3D: roofless tactical cutaway keeps interiors visible; walls still block movement and sight at full height. Drag to pan, wheel/pinch to zoom.</p></details><details><summary>Recent events</summary><ol id="events"></ol></details></aside></div></main></template>
