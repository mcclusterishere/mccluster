# Legacy optional Railway deployment descriptor.
# Canonical persistent production execution is OVH McCluster Core via systemd.
# Do not treat this file as the current architecture.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run db:migrate && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
