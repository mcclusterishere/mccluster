      <img src="assets/img/hm-mark-wide.webp" alt="">
      <h1>Admin Home</h1>
    </div>
    <p>Operator access to the canonical McCluster control plane. Sign in with the same account already used by the platform.</p>
    <label><span class="sr-only">Owner email</span><input class="cr-input" id="cpEmail" type="email" placeholder="Owner email" autocomplete="email"></label>

    <p class="cr-note" id="cpNote" role="status" aria-live="polite"></p>
  </section>

    <header class="cr-topbar">

      <button class="cr-command" id="crCommandOpen" type="button" aria-label="Search or ask McCluster"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search or ask McCluster…</span><kbd>⌘K</kbd></button>

    </header>

    <main class="cr-main" id="crMain"><div class="cr-surface" id="crSurface"></div></main>

    <aside class="cr-inspector" id="crInspector" aria-hidden="true" aria-label="Selected item details">

    </aside>

  </div>
