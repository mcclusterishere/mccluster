<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Not here · McCluster</title>
<script>
  /* GitHub Pages serves this for any address it has no file for. A
     campaign link can be written /action/<campaign> (the short form a
     Reel caption carries); the site has no routes, so it lands here and
     goes straight on to /action/?c=<campaign>, keeping the Reel and
     referral tags that came with it. */
  (function () {
    /* Recover the old relative mission handoff produced by campaign pages:
       /action/mnet.html?... -> /mnet.html?... . Keep this permanently so
       stale tabs, browser caches and shared broken URLs self-heal. */
    if (/^\/action\/mnet\.html\/?$/i.test(location.pathname)) {
      location.replace("/mnet.html" + location.search + location.hash);
      return;
    }
    var m = /^\/action\/([a-z0-9][a-z0-9-]{1,40})\/?$/i.exec(location.pathname);
    if (!m) return;
    var rest = location.search ? "&" + location.search.slice(1) : "";
    location.replace("/action/?c=" + m[1].toLowerCase() + rest + location.hash);
  })();
</script>
