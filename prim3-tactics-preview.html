<!doctype html>
<html lang="en" data-theme="dark">
<head><script src="js/shell-boot.js?v=__STAMP__"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRIM3 Tactical Preview</title>
  <meta name="description" content="Phone-first preview of PRIM3's tactical board on the real square-grid resolver, with optional learning-unlocked hints.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05080b">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/style.css?v=__STAMP__">
  <style>
    :root{
      --p3-bg:#05080b;--p3-bg2:#0b1218;--p3-tile:#121b22;--p3-tile2:#0e161c;--p3-line:rgba(255,255,255,.12);--p3-ink:#e8f1f3;--p3-dim:rgba(232,241,243,.68);
      --p3-cyan:#ececec;--p3-cyan-soft:rgba(236,236,236,.18);--p3-amber:#b4b8bb;--p3-amber-soft:rgba(180,184,187,.22);--p3-hostile:#3d8bff;--p3-team:#ff2a3a;
      --p3-wall:#2a3640;--p3-cover:#9fb3bf;--p3-r:12px
    }
    :root[data-theme="dark"]{--p3-bg:#05080b;--p3-ink:#e8f1f3}
    *{box-sizing:border-box}
    html,body{margin:0}
    html,body{background-color:#05080b}
    body{background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.06),transparent 60%),linear-gradient(180deg,var(--p3-bg2),var(--p3-bg));color:var(--p3-ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    .tac{max-width:1100px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom));display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
    .tac-hud{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--p3-line);border-radius:var(--p3-r);background:rgba(8,14,19,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .hud-unit{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hud-ap{color:var(--p3-cyan);letter-spacing:.06em}
    .hud-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--p3-dim);font-size:13px}
    .hud-meta b{color:var(--p3-amber);font-weight:700}
    .hud-btns{display:flex;gap:6px}
    .tbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--p3-line);background:rgba(255,255,255,.04);color:inherit;font:600 15px/1 system-ui,sans-serif;letter-spacing:0;text-transform:none;cursor:pointer}
    .tbtn--end{border-color:var(--p3-amber);color:var(--p3-amber)}
    .tbtn:disabled{opacity:.4}
    .tac-stage{position:relative;display:grid;gap:8px}
    .tac-viewport{position:relative;width:100%;max-width:620px;aspect-ratio:1;overflow:hidden;border-radius:var(--p3-r);border:1px solid var(--p3-line);
      background:linear-gradient(160deg,rgba(236,236,236,.06),transparent 40%),repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px),var(--p3-bg);
      box-shadow:0 20px 60px -20px rgba(0,0,0,.8),inset 0 0 0 1px rgba(236,236,236,.06);touch-action:none}
    .tac-board{display:grid;grid-template-columns:18px repeat(10,minmax(0,1fr));grid-template-rows:18px repeat(10,minmax(0,1fr));gap:2px;width:100%;height:100%;padding:4px;transform-origin:0 0}
    html:not(.reduce-motion) .tac-board{transition:transform .12s ease-out}
    .tb-corner{font:700 9px/18px ui-monospace,monospace;color:var(--p3-dim);text-align:center}
    .tac-display{border:1px solid var(--p3-line);border-radius:10px;padding:8px 12px;margin:8px 0;min-width:0}
    .tac-display summary{min-height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;cursor:pointer;font-weight:700}
    .tac-display summary small{font-size:13px;font-weight:500;line-height:1.4}
    .tac-display fieldset{border:0;margin:8px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
    .tac-display legend{font-weight:700;font-size:14px;margin-bottom:6px}
    .tac-display button{min-height:44px;white-space:normal}
    .tac-display button[aria-pressed="true"]{outline:2px solid var(--p3-cyan);outline-offset:-2px}
    .tac-display p{font-size:14px;line-height:1.4;margin:8px 0;overflow-wrap:anywhere}
    .tb-axis{display:grid;place-items:center;font:700 10px/1 ui-monospace,monospace;color:var(--p3-dim)}
    .tb-axis.is-key{color:var(--p3-amber)}
    .tb-cell{position:relative;min-width:0;padding:0;border:0;border-radius:5px;cursor:pointer;color:inherit;
      background:linear-gradient(145deg,var(--p3-tile),var(--p3-tile2));box-shadow:inset 0 0 0 1px var(--p3-line),0 1px 0 rgba(0,0,0,.35)}
    .tb-cell.is-wall{cursor:default;background:linear-gradient(160deg,#3a4955,var(--p3-wall) 55%,#1a232a);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.55)}
    .tb-cell.is-reach{background:linear-gradient(145deg,var(--p3-cyan-soft),transparent),linear-gradient(145deg,var(--p3-tile),var(--p3-tile2));box-shadow:inset 0 0 0 1px rgba(236,236,236,.45)}
    .tac-capabilities{font-size:13px;line-height:1.5;margin:6px 0;color:var(--p3-dim)}
    .tb-cell.is-walk{background:#123f62;box-shadow:inset 0 0 0 2px #329bff}
    .tb-cell.is-dash{background:#633a15;box-shadow:inset 0 0 0 2px #fa9838}
    .tb-cell.is-unreachable{box-shadow:inset 0 0 0 1px #59616a}
    .tb-cell.is-path{background:linear-gradient(145deg,var(--p3-amber-soft),transparent),linear-gradient(145deg,var(--p3-tile),var(--p3-tile2))}
    .tb-cell.is-dest{box-shadow:inset 0 0 0 2px var(--p3-amber),0 0 14px rgba(180,184,187,.45)}
    .tb-cell.is-hint{box-shadow:inset 0 0 0 2px var(--p3-amber);background:linear-gradient(145deg,var(--p3-amber-soft),transparent),linear-gradient(145deg,var(--p3-tile),var(--p3-tile2))}
    .tb-cell.is-origin{box-shadow:inset 0 0 0 2px var(--p3-cyan)}
    .tb-cell.is-target{box-shadow:inset 0 0 0 2px var(--p3-amber)}
    .tb-cell.run-x{background:linear-gradient(90deg,var(--p3-cyan-soft),transparent),linear-gradient(145deg,var(--p3-tile),var(--p3-tile2))}
    .tb-cell.run-y{background:linear-gradient(180deg,var(--p3-amber-soft),transparent),linear-gradient(145deg,var(--p3-tile),var(--p3-tile2))}
    .tb-step{position:absolute;right:2px;bottom:1px;font:700 9px/1 ui-monospace,monospace;font-style:normal;color:var(--p3-dim)}
    .tb-cover{position:absolute;background:var(--p3-cover);border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.5)}
    .tb-cover--high{opacity:1}.tb-cover--low{opacity:.75}
    .tb-cover--N{left:8%;right:8%;top:2px;height:4px}.tb-cover--S{left:8%;right:8%;bottom:2px;height:4px}
    .tb-cover--E{top:8%;bottom:8%;right:2px;width:4px}.tb-cover--W{top:8%;bottom:8%;left:2px;width:4px}
    .tb-cover--high.tb-cover--N,.tb-cover--high.tb-cover--S{height:6px}.tb-cover--high.tb-cover--E,.tb-cover--high.tb-cover--W{width:6px}
    .tb-obj{position:absolute;inset:26%;border:2px solid var(--p3-amber);transform:rotate(45deg);border-radius:3px;box-shadow:0 0 12px rgba(180,184,187,.55)}
    .tb-unit{position:absolute;inset:8%;border-radius:50%;display:grid;place-items:center;align-content:center;gap:0;background:radial-gradient(circle at 35% 30%,#2b3d49,#0d151b);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 0 0 2px var(--p3-cyan)}
    .tb-unit b{font:800 clamp(10px,3.4vw,16px)/1 system-ui,sans-serif}
    .tb-ap{font-size:7px;line-height:1;color:var(--p3-cyan);letter-spacing:.5px}
    .tb-unit--hostile{box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 0 0 2px var(--p3-hostile);color:var(--p3-hostile)}
    .tb-role-E b{color:#7fe3ee}.tb-role-R b{color:#b9e98a}.tb-role-T b{color:#ffcf7a}
    .tb-unit.is-sel{box-shadow:0 0 0 2px var(--p3-amber),0 0 16px rgba(180,184,187,.5),inset 0 0 0 2px var(--p3-cyan)}
    html:not(.reduce-motion) .tb-unit.is-sel{animation:sel 1.6s ease-in-out infinite}
    @keyframes sel{50%{box-shadow:0 0 0 3px var(--p3-amber),0 0 22px rgba(180,184,187,.65),inset 0 0 0 2px var(--p3-cyan)}}
    .tbtn--zoom{font-size:20px;padding:0}
    .tac-menu[hidden],.tac-sheet[hidden]{display:none}
    .tac-menu{position:relative;z-index:4;width:100%;max-width:620px;padding:6px;border-radius:12px;border:1px solid rgba(236,236,236,.35);background:rgba(8,14,19,.95);box-shadow:0 18px 40px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
    .tm-head{grid-column:1/-1;margin:2px 6px 2px;font:700 12px/1.2 inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--p3-dim)}
    .tm-btn{min-height:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:4px 10px;border-radius:9px;border:0;background:rgba(236,236,236,.08);color:inherit;font:600 14px/1.1 inherit;text-align:left;cursor:pointer;min-width:0}
    .tm-btn small{color:var(--p3-dim);font-weight:500;font-size:11px}
    .tm-btn--ghost{background:transparent;border:1px solid var(--p3-line)}
    .tac-sheet{border:1px solid var(--p3-line);border-radius:var(--p3-r);padding:12px;background:rgba(8,14,19,.88)}
    .ts-eye{margin:0 0 4px;font:700 12px/1.2 inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--p3-dim)}
    .ts-main{margin:0 0 4px;font-size:17px}.ts-main b{color:var(--p3-amber)}
    .ts-q{margin:0 0 6px;font-weight:600}
    .ts-sub{margin:4px 0 0;color:var(--p3-dim);overflow-wrap:anywhere}
    .k-origin{color:var(--p3-cyan);font-weight:700}.k-target{color:var(--p3-amber);font-weight:700}
    .ts-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .ts-btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--p3-line);background:rgba(255,255,255,.04);color:inherit;font:600 15px/1 inherit;cursor:pointer}
    .ts-btn--go{background:linear-gradient(180deg,#ffc061,#e09a2a);border-color:transparent;color:#1a1204}
    .ts-link{margin-top:8px;min-height:44px;padding:0;border:0;background:none;color:var(--p3-cyan);font:600 15px/1.2 inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    .ts-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:6px}
    .ts-form label{grid-column:1/-1;font-size:13px;color:var(--p3-dim)}
    .ts-form input{min-height:48px;border-radius:10px;border:1px solid rgba(236,236,236,.45);background:transparent;color:inherit;padding:0 12px;font-size:max(18px,1rem);min-width:0}
    .ts-why{margin:6px 0 0;padding-left:1.1rem;display:grid;gap:4px}
    .tac-about{color:var(--p3-dim);font-size:14px}
    .tac-about summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--p3-ink);font-weight:600}
    .tac-about p{margin:6px 0}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .owner-gate h1{position:static;width:auto;height:auto;overflow:visible;clip:auto}
    @media (min-width:900px){
      .tac{grid-template-columns:minmax(0,620px) minmax(0,1fr);align-items:start}
      .tac-hud{grid-column:1/-1}
      .tac-side{position:sticky;top:12px;display:grid;gap:10px}
    }
    .reduce-motion *{transition:none!important;animation:none!important}
    /* mockup layout: top turn bar, objective strip, 3D board, preview/challenge, unit dock */
    .tac{padding-top:calc(70px + env(safe-area-inset-top))}
    .p3-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;border:1px solid var(--p3-line);border-radius:var(--p3-r);background:linear-gradient(100deg,rgba(255,93,106,.10),transparent 30%),rgba(8,14,19,.85)}
    .p3-mark{width:44px;height:44px;object-fit:contain}
    .p3-turn{display:grid;justify-items:end;line-height:1.05}
    .p3-turn b{font:800 20px/1 system-ui,sans-serif;letter-spacing:.04em}
    .p3-turn span{color:var(--p3-cyan);font:700 14px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
    .p3-obj{margin:0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--p3-r);background:rgba(8,14,19,.7);border:1px solid var(--p3-line);font:700 14px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
    .p3-obj i{color:var(--p3-amber);font-style:normal;font-size:18px}
    .tac-3d{position:absolute;inset:0;display:none}
    .tac-viewport.is-3d .tac-3d{display:block}
    .tac-viewport.is-3d .tac-board{display:none}
    .tac-viewport.is-3d{aspect-ratio:3/4;max-width:640px}
    @media (min-width:900px){.tac-viewport.is-3d{aspect-ratio:4/3}}
    .b3-canvas{display:block;width:100%;height:100%}
    .b3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .b3-label{position:absolute;left:0;top:0;white-space:nowrap;font:700 12px/1 system-ui,sans-serif;padding:4px 7px;border-radius:7px;translate:-50% -100%;background:rgba(6,12,16,.86);border:1px solid var(--p3-line);color:var(--p3-ink)}
    .b3-label--ally{color:#fff;border-color:var(--p3-team);box-shadow:0 0 10px rgba(255,42,58,.55);min-width:22px;text-align:center}
    .b3-label--hostile{color:#fff;border-color:var(--p3-hostile);background:rgba(6,12,16,.86);box-shadow:0 0 10px rgba(61,139,255,.55)}
    .b3-label--origin{color:#fff;border-color:rgba(255,255,255,.7);translate:-50% 45%}
    .b3-label--target,.b3-label--obj{color:#fff;border-color:rgba(255,255,255,.45)}
    .b3-label--target{translate:-50% 45%}
    .b3-label--cover{font-weight:600;color:var(--p3-dim)}
    .b3-label--step{translate:-50% -150%;background:transparent;border:0;color:var(--p3-ink);font-size:11px}
    .b3-label--axis{translate:-50% -50%;background:transparent;border:0;color:#1b2226;font:800 12px/1 ui-monospace,monospace;padding:0;text-shadow:0 0 3px rgba(255,255,255,.9)}
    .tac-menu.is-float{position:absolute;width:min(210px,58vw);grid-template-columns:minmax(0,1fr);z-index:6;gap:3px;padding:5px;background:rgba(8,14,19,.9)}
    .tac-menu.is-float .tm-head{font-size:11px}
    .tac-menu.is-float .tm-btn small{display:none}
    .tac-menu.is-float .tm-btn--ghost{min-height:40px}
    .tac-menu.is-float .tm-btn{flex-direction:row;justify-content:space-between;align-items:center}
    .p3-dock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--p3-line);border-radius:var(--p3-r);background:rgba(8,14,19,.88)}
    .dock-unit{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
    .dock-token{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font:800 20px/1 system-ui,sans-serif;background:radial-gradient(circle at 35% 30%,#2b3d49,#0d151b);box-shadow:inset 0 0 0 2px var(--p3-cyan)}
    .dock-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dock-ap{justify-self:end;padding:6px 12px;border-radius:999px;border:1px solid var(--p3-cyan);color:var(--p3-cyan);font:800 15px/1 system-ui,sans-serif}
    .dock-tools{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
    .dock-tools .tbtn{flex:none;white-space:nowrap}
    .tbtn svg{width:20px;height:20px;display:block;margin:auto}
    .p3-dock .tbtn--end{min-height:52px;font-size:18px;color:#fff;border:0;background:linear-gradient(180deg,#d8323e,#9c1621);box-shadow:0 8px 20px -8px rgba(216,50,62,.7)}
    .tbtn--view{font-size:14px}
    /* main menu: the real battlefield in a slow cinematic orbit behind real buttons; the scene only decorates them */
    .p3-menu[hidden]{display:none}
    .tac.menu-open>:not(.p3-menu){display:none}
    .p3-menu{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
    .pm-head{display:flex;align-items:center;gap:12px}
    .pm-head img{width:56px;height:56px;object-fit:contain;flex:none}
    .pm-head h2{margin:0;font:800 28px/1.05 system-ui,sans-serif;letter-spacing:.01em}
    .pm-head p{margin:2px 0 0;color:var(--p3-dim,#9fb3c0);font-size:14px}
    .pm-stage{position:relative;aspect-ratio:4/5;max-height:62vh;width:100%;border-radius:var(--p3-r);overflow:hidden;border:1px solid var(--p3-line);background:radial-gradient(120% 90% at 50% 20%,#f4f5f6 0,#e2e4e6 60%,#cfd3d6 100%)}
    .pm-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .pm-stage .b3-labels{display:none}
    .pm-stage.no-3d::after{content:"";position:absolute;inset:0;background:url(assets/img/prim3-logo.png) center/40% no-repeat;opacity:.5}
    .pm-list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
    .pm-opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--p3-line);background:rgba(255,255,255,.04);color:inherit;text-align:left;cursor:pointer;font:700 17px/1.2 system-ui,sans-serif}
    .pm-opt small{font:500 13px/1.3 system-ui,sans-serif;color:var(--p3-dim,#9fb3c0)}
    .pm-opt[aria-pressed="true"]{border-color:var(--p3-cyan);background:linear-gradient(90deg,rgba(236,236,236,.16),rgba(236,236,236,.04));box-shadow:inset 3px 0 0 var(--p3-cyan)}
    .pm-go{min-height:56px;border:0;border-radius:14px;font:800 19px/1 system-ui,sans-serif;color:#061015;background:linear-gradient(180deg,#ffffff,#d9dcde);box-shadow:0 10px 24px -10px rgba(255,255,255,.45);cursor:pointer}
    .pm-note{margin:0;font-size:12px;color:var(--p3-dim,#9fb3c0)}
    .tbtn--menu{font-size:14px}
    @media (min-width:900px){
      .p3-menu{grid-column:1/-1;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto auto auto minmax(0,1fr);align-items:start;column-gap:20px}
      .pm-head{grid-column:1/-1}
      .pm-stage{grid-row:2/span 4;max-height:none}
    }

  </style>
</head>
<body>
  <!-- Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the board
       loads only after that yes (owner, 2026-11-03: "keep it on my private account"). -->
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="tacTpl" data-owner-load="js/prim3-tactics/preview.mjs">
    <h1>Owner only</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="tacTpl">
  <main class="tac">
    <h1>PRIM3 tactical preview</h1>
    <section class="p3-menu" id="p3Menu" aria-label="Main menu" hidden>
      <header class="pm-head"><img src="assets/img/prim3-logo.png" alt="PRIM3" width="56" height="56"><div><h2>Tactics</h2><p>Secure the relay · squad of three</p></div></header>
      <div class="pm-stage" id="menu3d"></div>
      <div class="pm-list" id="pmList"></div>
      <button type="button" class="pm-go" id="pmGo">Deploy</button>
      <p class="pm-note">Review-branch preview. Progress stays in this browser.</p>
    </section>
    <header class="p3-top" aria-label="Turn">
      <img class="p3-mark" src="assets/img/prim3-logo.png" alt="PRIM3" width="44" height="44">
      <button type="button" class="tbtn tbtn--menu" id="tacMenuOpen">Menu</button>
      <span class="p3-turn"><b id="hudRound"></b><span id="hudPhase"></span></span>
    </header>
    <p class="p3-obj"><i aria-hidden="true">◇</i><span id="hudObj"></span></p>
    <details class="tac-display" id="tacDisplay"><summary><span>Board display</span><small id="tacCoordinates" aria-live="polite"></small></summary>
      <fieldset><legend>Projection</legend><button type="button" class="tbtn" data-projection="perspective">3D perspective</button><button type="button" class="tbtn" data-projection="top">Top-down board</button></fieldset>
      <fieldset><legend>Coordinate origin</legend><button type="button" class="tbtn" data-origin="centre">Map centre</button><button type="button" class="tbtn" data-origin="objective">Relay objective</button></fieldset>
      <p class="tac-frame-legend">Metres · 1 m per cell. +X east/right, +Y north/up; zero at the chosen origin. Training cards use numbered columns and rows.</p>
    </details>
