<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Account · McCluster</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/img/m-mark.png">
  <link rel="stylesheet" href="css/style.css?v=75f15b5578aa">
  <script src="js/theme.js?v=75f15b5578aa"></script>
  <style>
    html, body { background: var(--ink); }
    .ac { max-width: 27rem; margin: 0 auto; padding: clamp(4.6rem, 10vh, 6.5rem) clamp(1.1rem, 4vw, 2rem) 9rem; }
    .ac__k { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color:var(--ruby-text); font-weight: 800; }
    .ac h1 { font-family: var(--sig); text-transform: uppercase; line-height: 0.92; font-size: clamp(2.4rem, 11vw, 3.6rem); margin-top: 0.4rem; }
    .ac__sub { color: var(--cream-dim); line-height: 1.7; margin-top: 0.9rem; font-size: 0.98rem; }
    .ac__card { border: 1px solid var(--edge); border-radius: 16px; background: var(--glass-hi); padding: 1.15rem; margin-top: 1.6rem; }
    .ac__lab { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color:var(--ruby-text); font-weight: 800; }
    .fan__row { display: flex; gap: 0.6rem; }
    .fan__row input { flex: 1; min-width: 0; }
    .fan__check { display: flex; gap: 0.6rem; align-items: flex-start; margin-top: 0.9rem;
      font-size: 0.86rem; line-height: 1.35; color: var(--cream); cursor: pointer; }
    .fan__check input { width: auto; margin: 0.15rem 0 0; flex: none; }
    .fan__check.is-off { opacity: 0.45; cursor: default; }
    .fan__fine { margin-top: 0.8rem; font-size: 0.74rem; line-height: 1.45; color: var(--cream-dim); }
    .fan__note { margin-top: 0.4rem; font-size: 0.74rem; color: var(--cream-dim); }
    .ac__or { position: relative; text-align: center; margin: 1.2rem 0 0.9rem; }
    .ac__or::before { content: ""; position: absolute; left: 0; right: 0; top: 50%;
      border-top: 1px solid rgba(244,239,230,0.16); }
    .ac__or span { position: relative; background: var(--ink-2); padding: 0 0.7rem;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); }
    .ac__prov { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      margin-top: 0.55rem; padding: 0.85rem 1rem; border-radius: 12px; cursor: pointer;
      font: 600 0.95rem var(--ui); color: var(--cream);
      background: rgba(244,239,230,0.06); border: 1px solid rgba(244,239,230,0.22); }
    .ac__prov:hover { background: rgba(244,239,230,0.1); }
    .ac__prov[disabled] { opacity: 0.55; cursor: default; }
    .ac__prov svg { width: 18px; height: 18px; flex: none; }
    .ac input { width: 100%; margin-top: 0.6rem; padding: 0.95rem 1rem; border-radius: 12px; border: 1px solid rgba(229,56,59,0.4); background: var(--ink-2); color: var(--cream); font-size: 1rem; }
    .ac__flip { background: none; border: 0; cursor: pointer; padding: 0; margin-top: 0.9rem; color: var(--cream-dim); font-size: 0.82rem; text-decoration: underline; }
    .ac__btn { appearance: none; border: 0; cursor: pointer; display: block; width: 100%; margin-top: 0.8rem; padding: 1rem; border-radius: 13px; background: var(--ruby-hot); color: #fff; font-weight: 800; font-size: 1.02rem; text-align: center; text-decoration: none; }
    .ac__ghost { display: block; text-align: center; text-decoration: none; margin-top: 0.7rem; padding: 0.95rem; border-radius: 13px; border: 1px solid rgba(229,56,59,0.5); color: var(--cream); font-weight: 700; }
    .ac__note { margin-top: 0.8rem; font-size: 0.8rem; color: var(--cream-dim); }
    .ac__who { color: var(--cream); font-weight: 700; word-break: break-all; }
    .ac__out { margin-top: 1rem; background: none; border: 0; color: var(--cream-dim); font-size: 0.82rem; text-decoration: underline; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="songpage">
  <main class="ac">
    <p class="ac__k">McCluster</p>
    <h1>Your<br>Account</h1>
    <div class="ac__card" id="acDoor">
      <p class="ac__lab">Sign in</p>
      <input type="email" id="acInEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="acInPass" placeholder="Password" autocomplete="current-password">
      <button class="ac__btn" id="acGo" type="button">Sign in</button>
      <button class="ac__flip" id="acSend" type="button">Email me a sign-in link</button>
      <p class="ac__note" id="acMsg"></p>

      <!-- SOCIAL SIGN-IN. Painted only for providers Supabase actually has
           switched on, read live from /auth/v1/settings — a button for a
           provider that is off sends people to a Google error page, which is
           worse than no button. js/mcc-auth.js owns the PKCE exchange and
           /auth/index.html finishes it. -->
      <div class="ac__social" id="acSocialRow" hidden>
        <p class="ac__or"><span>or</span></p>
        <div id="acProviders"></div>
      </div>
    </div>
    <div class="ac__card" id="acDesk" hidden>
      <p class="ac__lab">Signed in</p>
      <p class="ac__sub"><span class="ac__who" id="acWho"></span></p>
      <a class="ac__ghost" href="gallery.html">Shop the gallery</a>
      <a class="ac__ghost" href="console.html">Client console</a>
      <button class="ac__out" id="acOut" type="button">Sign out</button>
    </div>

    <!-- THE INTAKE. Writes to public.fan_profiles, which has no role, no org
         and no membership column: nothing typed here can make anybody an
         admin. The two consents are separate, optional, and gate nothing —
         the record is already unlocked by the time this form is on screen. -->
    <!-- data-private: everything painted below is the visitor's own record —
         legal name, street address, phone. The copy sensor in js/analytics.js
         reads this attribute and will record that a copy happened without
         ever banking the words. -->
    <div class="ac__card fan" id="fanCard" data-private hidden>
      <p class="ac__lab">Your details</p>
      <p class="ac__sub" id="fanWhy">Tell us where to send things. The music is already unlocked.</p>

      <input type="text" id="fnLegal" placeholder="Full legal name" autocomplete="name">
      <input type="text" id="fnAddr1" placeholder="Address" autocomplete="address-line1">
      <input type="text" id="fnAddr2" placeholder="Apt, suite (optional)" autocomplete="address-line2">
      <div class="fan__row">
        <input type="text" id="fnCity" placeholder="City" autocomplete="address-level2">
        <input type="text" id="fnRegion" placeholder="State" autocomplete="address-level1">
      </div>
      <div class="fan__row">
        <input type="text" id="fnPostal" placeholder="ZIP" autocomplete="postal-code" inputmode="numeric">
        <input type="text" id="fnCountry" placeholder="Country" autocomplete="country-name">
      </div>
      <input type="tel" id="fnPhone" placeholder="Phone" autocomplete="tel" inputmode="tel">
      <p class="fan__note" id="fnPhoneNote" hidden></p>
      <input type="number" id="fnBirth" placeholder="Year you were born" inputmode="numeric" min="1900" max="2100">

      <label class="fan__check">
        <input type="checkbox" id="fnMarketing">
        <span>Email me about new records, shows and drops.</span>
      </label>
      <label class="fan__check" id="fnShareWrap">
        <input type="checkbox" id="fnShare">
        <span id="fnShareLabel">Share my details with partners McCluster works with.</span>
      </label>
      <p class="fan__fine">Both are optional and neither unlocks anything. You can change them here any time.
        <a href="privacy.html">What we record, and how to have it deleted</a>.</p>

      <button class="ac__btn" id="fnSave" type="button">Save</button>
      <p class="ac__note" id="fnMsg"></p>
    </div>
  </main>
  <script src="js/backend.js?v=75f15b5578aa"></script>
  <!-- The social door. It shares mccdb_session with backend.js, so a Google
       sign-in lands in exactly the same session the email form produces. -->
  <script src="js/mcc-auth.js?v=75f15b5578aa"></script>
  <script src="js/fan-intake.js?v=75f15b5578aa"></script>
  <script src="js/tabbar.js?v=75f15b5578aa"></script>
  <script>
  (function () {
    var el = function (id) { return document.getElementById(id); };
    var HOUSE = "matthew@mccluster.org";

    function stayOnAccount() {
      return /(?:\?|&)stay=1(?:&|$)/.test(location.search);
    }

    function openPlane() {
      if (stayOnAccount()) return false;
      location.replace("studio.html");
      return true;
    }

    function houseOwner(user) {
      if (!user) return Promise.resolve(false);
      if ((user.email || "").toLowerCase() === HOUSE) return Promise.resolve(true);
      if (!window.MCC_SUPA || !MCC_SUPA.token) return Promise.resolve(false);
      var uid = MCC_SUPA.uid && MCC_SUPA.uid();
      if (!uid) return Promise.resolve(false);
      return MCC_SUPA.token().then(function (t) {
        if (!t) return false;
        var q = "org_members?select=role,orgs(slug)&profile_id=eq." + encodeURIComponent(uid);
        return fetch(MCC_SUPA.url + "/rest/v1/" + q, {
          headers: { apikey: MCC_SUPA.key, authorization: "Bearer " + t }
        }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
          return (rows || []).some(function (row) {
            var slug = row.orgs && row.orgs.slug;
            return row.role === "owner" && (!slug || slug === "mccluster");
          });
        }).catch(function () { return false; });
      });
    }

    function paint() {
      var u = window.MCC_AUTH && MCC_AUTH.user && MCC_AUTH.user();
      el("acDoor").hidden = !!u;
      el("acDesk").hidden = !u;
      if (!u) return;
      el("acWho").textContent = u.name || u.email || "signed in";
      houseOwner(u).then(function (yes) {
        if (yes) { openPlane(); return; }
        /* Everyone who is not the house owner is a listener, and a listener
           gets the intake rather than a desk. */
        openFan();
      });
    }

    el("acGo").onclick = function () {
      var em = el("acInEmail").value.trim(), pw = el("acInPass").value;
      if (!em || !pw) { el("acMsg").textContent = "Email and password."; return; }
      MCC_AUTH.signInPassword(em, pw).then(paint).catch(function (e) {
        el("acMsg").textContent = e.message || "That did not open.";
      });
    };
    el("acInPass").addEventListener("keydown", function (e) { if (e.key === "Enter") el("acGo").click(); });
    el("acSend").onclick = function () {
      var em = el("acInEmail").value.trim();
      if (!em) { el("acMsg").textContent = "Email first."; return; }
      MCC_AUTH.signIn(em).then(function () {
        el("acMsg").textContent = "Link sent. Open it on this device.";
      }).catch(function (e) { el("acMsg").textContent = e.message || "That did not send."; });
    };
    el("acOut").onclick = function () {
      MCC_AUTH.signOut().then(function () { location.reload(); });
    };

    /* ---------------------------------------------------------------
       THE INTAKE. Painted only for a signed-in listener, and never for
       the house owner, who is already being redirected to the studio.
       --------------------------------------------------------------- */
    var FAN = ["fnLegal","fnAddr1","fnAddr2","fnCity","fnRegion","fnPostal",
               "fnCountry","fnPhone","fnBirth"];
    var COL = { fnLegal:"legal_name", fnAddr1:"address_line1", fnAddr2:"address_line2",
                fnCity:"city", fnRegion:"region", fnPostal:"postal_code",
                fnCountry:"country", fnPhone:"phone_e164", fnBirth:"birth_year" };

    /* The unlock links carry ?from=<slug>. It is only a marketing segment —
       the database derives the tier from it and neither value grants a
       thing — so an edited URL buys nobody anything. */
    function source() {
      var m = /(?:\?|&)from=([a-z0-9-]{1,40})/i.exec(location.search);
      return m ? m[1].toLowerCase() : "";
    }

    /* Sharing a minor's details onward is a different question from sharing
       an adult's, and the database refuses it outright. Saying so here means
       the box does not sit there looking tickable when it is not. */
    function syncShareGate() {
      var ok = window.MCC_FAN.adult(el("fnBirth").value);
      var wrap = el("fnShareWrap"), box = el("fnShare");
      wrap.classList.toggle("is-off", !ok);
      box.disabled = !ok;
      if (!ok) box.checked = false;
      el("fnShareLabel").textContent = ok
        ? "Share my details with partners McCluster works with."
        : "Sharing with partners is only offered to listeners 18 or older.";
    }

    function paintFan(row) {
      FAN.forEach(function (id) {
        var v = row ? row[COL[id]] : "";
        el(id).value = (v === null || v === undefined) ? "" : v;
      });
      el("fnMarketing").checked = !!(row && row.marketing_consent);
      el("fnShare").checked = !!(row && row.share_consent);
      syncShareGate();
      if (row && row.phone_e164 && !row.phone_verified_at) {
        el("fnPhoneNote").hidden = false;
        el("fnPhoneNote").textContent = "Phone saved, not yet verified.";
      }
    }

    function openFan() {
      el("fanCard").hidden = false;
      if (source()) el("fanWhy").textContent =
        "The record is unlocked and downloading. Tell us where to send the rest.";
      window.MCC_FAN.load().then(paintFan).catch(function () { syncShareGate(); });
      /* Text messaging is off in this project, so the form does not pretend
         a code is coming. It still keeps the number. */
      window.MCC_FAN.phoneEnabled().then(function (on) {
        if (on) return;
        el("fnPhoneNote").hidden = false;
        el("fnPhoneNote").textContent =
          "We keep your number but cannot text a code yet — SMS is not switched on.";
      });
    }

    /* ---------------------------------------------------------------
       THE SOCIAL DOOR. Asks Supabase which providers are live and paints
       only those. Nothing here is hardcoded on: flipping Google on in the
       dashboard makes the button appear by itself, and flipping it off
       makes it vanish, with no deploy either way.
       --------------------------------------------------------------- */
    var PROVIDERS = [
      ['google', 'Continue with Google',
       '<svg viewBox="0 0 48 48" aria-hidden="true">' +
       '<path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8a12 12 0 1 1 7.9-21l5.7-5.7A20 20 0 1 0 24 44a20 20 0 0 0 19.6-23.9z"/>' +
       '<path fill="#FF3D00" d="m6.3 14.7 6.6 4.8A12 12 0 0 1 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7A20 20 0 0 0 6.3 14.7z"/>' +
       '<path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A11.9 11.9 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44z"/>' +
       '<path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2A19.9 19.9 0 0 0 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>'],
      ['apple', 'Continue with Apple', ''],
      ['facebook', 'Continue with Facebook', ''],
      ['x', 'Continue with X', ''],
    ];

    function mountProviders() {
      if (!window.MCC || !MCC.providers) return;
      MCC.providers().then(function (live) {
        var host = el("acProviders");
        var any = false;
        host.innerHTML = "";
        PROVIDERS.forEach(function (spec) {
          var key = spec[0];
          if (!live[key]) return;          /* off in Supabase → no button */
          any = true;
          var b = document.createElement("button");
          b.type = "button";
          b.className = "ac__prov";
          b.innerHTML = spec[2] + "<span>" + spec[1] + "</span>";
          b.addEventListener("click", function () {
            b.disabled = true;
            /* /auth/ finishes the PKCE exchange and then forwards here. */
            MCC.signInWithProvider(key, location.origin + "/auth/?next=/account.html")
              .catch(function (e) {
                b.disabled = false;
                el("acMsg").textContent = e.message || ("Could not start " + key + " sign-in.");
              });
          });
          host.appendChild(b);
        });
        el("acSocialRow").hidden = !any;
      }).catch(function () { /* the email form is always there */ });
    }
    mountProviders();

    el("fnBirth").addEventListener("input", syncShareGate);

    el("fnSave").onclick = function () {
      var values = { source: source() };
      FAN.forEach(function (id) { values[COL[id]] = el(id).value.trim(); });
      values.birth_year = values.birth_year ? Number(values.birth_year) : null;
      values.marketing_consent = el("fnMarketing").checked;
      values.share_consent = el("fnShare").checked && !el("fnShare").disabled;
      el("fnSave").disabled = true;
      el("fnMsg").textContent = "Saving…";
      window.MCC_FAN.save(values).then(function (row) {
        el("fnSave").disabled = false;
        el("fnMsg").textContent = "Saved.";
        /* Repaint from what the DATABASE returned, not from what was typed:
           the trigger may have refused a consent or cleared a verification,
           and the form must show what is actually stored. */
        paintFan(row);
      }).catch(function (e) {
        el("fnSave").disabled = false;
        el("fnMsg").textContent = e.message || "That did not save.";
      });
    };

    paint();
  })();
  </script>
  <script defer src="js/pip.js?v=75f15b5578aa"></script>
</body>
</html>
