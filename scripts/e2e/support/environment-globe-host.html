<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Environmental globe host (test harness)</title>
<style>html,body{margin:0;height:100%;background:#0c161c}#mnWorldFrame{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- A same-origin stand-in for the World page: it embeds the globe frame exactly as mnet.html does and plays the
     panel's part of the message spine (hu:environment-layers, then hu:environment-pins on hu:globe-ready).
     Query: ?layers=on|off  ?replay=quakes-24h  ?pins=0 (no pins message)  ?v=<stamp>. Test harness only. -->
<iframe id="mnWorldFrame" title="Environmental globe under test" src="/action-globe.html?embedded=1&amp;surface=network&amp;missions=0&amp;v=test"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var layersOn = q.get('layers') !== 'off';
  var replay = q.get('replay') === 'quakes-24h' ? 'quakes-24h' : null;
  var sendPins = q.get('pins') !== '0';
  var frame = document.getElementById('mnWorldFrame');
  window.__fromGlobe = [];
  window.__ready = false;
  window.__pinsFixture = null;
  window.__send = function (msg) { frame.contentWindow.postMessage(msg, location.origin); };
  function activation() {
    window.__send({ type: 'hu:environment-layers', on: layersOn, selected: '', replay: replay, layers: { fires: true, perimeters: true, alerts: true, eonet: true, tides: true } });
    if (sendPins && window.__pinsFixture) window.__send({ type: 'hu:environment-pins', on: true, selected: '', items: window.__pinsFixture });
    window.__activated = (window.__activated || 0) + 1;
  }
  var pinsLoaded = fetch('/scripts/e2e/fixtures/environment/pins.json').then(function (r) { return r.json(); }).then(function (items) { window.__pinsFixture = items; return items; }).catch(function () { window.__pinsFixture = []; return []; });
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data || typeof e.data.type !== 'string') return;
    window.__fromGlobe.push(e.data);
    if (e.data.type === 'hu:globe-ready' && !window.__ready) { window.__ready = true; pinsLoaded.then(activation); }
    else if (e.data.type === 'hu:globe-ready') pinsLoaded.then(activation);
  });
  frame.addEventListener('load', function () { try { frame.contentWindow.postMessage({ type: 'hu:hello' }, location.origin); } catch (e) {} });
})();
</script>
</body>
</html>
