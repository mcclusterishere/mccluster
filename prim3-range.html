<!doctype html>
<html lang="en">
<head><script src="js/shell-boot.js?v=578e683088fd"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PRIM3 · Training Range 01</title>
  <meta name="description" content="PRIM3 Training Range 01. Owner only.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/prim3-mark-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/img/prim3-mark-512.png">
  <link rel="apple-touch-icon" href="assets/img/prim3-mark-180.png">
  <meta name="theme-color" content="#030303">
  <link rel="stylesheet" href="css/style.css?v=578e683088fd">
  <link rel="stylesheet" href="css/prim3-range.css?v=578e683088fd">
  <script src="js/theme.js?v=578e683088fd"></script>
  <script src="js/live-content.js?v=578e683088fd"></script>
</head>
<body class="prim3-range-page">
  <!-- OWNER ONLY (owner, 2026-11-03: "the whole learning management system is going to be on my private account").
       Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the course
       markup below stays inert and the lesson scripts load only after that yes. -->
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="rangeTpl" data-owner-load="js/prim3-range-core.js?v=578e683088fd js/prim3-range.js?v=578e683088fd js/pip.js?v=578e683088fd js/site-editor.js?v=578e683088fd">
    <img class="owner-gate__mark" src="assets/img/prim3-lockup-512.png" alt="PRIM3" width="62" height="44">
    <h1>Owner only</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="rangeTpl">
  <header class="range-topbar">
    <a class="range-home" href="prim3.html">PRIM3 LMS</a>
    <div class="range-brand">
      <img src="assets/img/prim3-tab.png" alt="" width="54" height="54">
      <div><strong>PRIM3</strong><span>Training Range 01</span></div>
    </div>
    <span id="rangeSyncStatus" class="range-sync" data-kind="neutral">Connecting</span>
  </header>

  <main id="rangeGate" class="range-gate">
    <div class="range-gate-card">
      <img src="assets/img/prim3-tab.png" alt="" width="96" height="96">
      <p class="range-kicker">MISSION GATE</p>
      <h1 id="rangeGateTitle">Loading Training Range 01</h1>
      <p id="rangeGateCopy">Checking M Account and Principles progress.</p>
      <a id="rangeGateAction" class="range-primary-link" href="account.html" hidden>Open M Account</a>
    </div>
  </main>

  <main id="rangeShell" class="range-shell" hidden>
    <section id="rangeBriefing" class="range-briefing">
      <div class="range-hero">
        <div>
          <p class="range-kicker">M · MISSIONS</p>
          <h2>Training Range 01<br><span>Risk and Controls</span></h2>
          <p>This simulator applies Module M01 after instruction. Technical truth is selected before deployment and remains fixed for the entire attempt.</p>
        </div>
        <div class="range-contract">
          <span>PRINCIPLES REQUIRED</span>
          <span>DETERMINISTIC VERIFICATION</span>
          <span>NO STORY CONSEQUENCES</span>
        </div>
      </div>

      <section class="range-readiness" aria-labelledby="readinessTitle">
        <div class="range-section-head">
          <p class="range-kicker">MISSION READINESS PROFILE</p>
          <h2 id="readinessTitle">Your preparation for this attempt</h2>
          <p id="readinessNote"></p>
        </div>
        <div class="range-readiness-grid">
          <article><small>Principles readiness</small><b id="readinessValue">0%</b></article>
          <article><small>Technical challenge</small><b id="technicalValue">FOUNDATION</b></article>
          <article><small>Scaffolding</small><b id="scaffoldingValue">HIGH</b></article>
          <article><small>Preparation credits</small><b id="creditValue">0</b></article>
        </div>
      </section>

      <section class="range-loadout">
        <div class="range-section-head">
          <p class="range-kicker">FAIRNESS FLOOR</p>
          <h2>Required tools stay available.</h2>
          <p>Low mastery can increase support. It never removes a tool required to solve the mission fairly.</p>
        </div>
        <ul id="toolList" class="range-tool-list"></ul>
      </section>

      <section class="range-prep">
        <div class="range-section-head">
          <p class="range-kicker">PREPARATION CREDITS</p>
          <h2>Spend earned preparation before deployment.</h2>
          <p id="prepHelp"></p>
        </div>
        <div id="prepList" class="range-prep-list"></div>
      </section>

      <section class="range-mission-card">
        <div>
          <p class="range-kicker">COMPILED VARIANT <span id="briefVariant"></span></p>
          <h2 id="briefTitle"></h2>
          <p id="briefCopy"></p>
        </div>
        <aside id="rangeHistory" class="range-history" hidden></aside>
        <button id="launchRange" class="range-primary" type="button">Deploy Training Range 01</button>
      </section>
    </section>

    <section id="rangeMission" class="range-mission" hidden>
      <header class="range-mission-head">
        <div>
          <p class="range-kicker">ACTIVE MISSION · <span id="variantValue"></span></p>
          <h2 id="missionTitle"></h2>
          <p id="missionBrief"></p>
        </div>
        <div class="range-clock-grid" aria-label="Mission state">
          <article><small>Window</small><b id="windowValue">8</b></article>
          <article><small>Mission state</small><b id="missionState">STABLE</b></article>
          <article><small>Evidence trace</small><b id="traceValue">0 of 4</b></article>
        </div>
      </header>

      <div class="range-runtime-layout">
        <aside class="range-runtime-tools">
          <p class="range-kicker">ACTIVE TOOLS</p>
          <div><b>Evidence Viewer</b><span>Observe and compare sources.</span></div>
          <div><b>Risk Register</b><span>Classify threat, vulnerability, likelihood, impact, and objective.</span></div>
          <div><b>Control Catalog</b><span>Select and validate a proportional control.</span></div>
          <a href="prim3.html">Open Principles reference</a>
        </aside>
        <section class="range-runtime-main">
          <p id="rangeMessage" class="range-message" role="status" hidden></p>
          <div id="rangeStageBody"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="range-footer">
    <strong>PRIM3</strong>
    <span>Principles · Rhythm · Immersion · Missions</span>
  </footer>
  </template>

  <script src="js/mcc-auth.js?v=578e683088fd"></script>
  <script src="js/tabbar.js?v=578e683088fd"></script>
  <script type="module" src="js/owner-only.mjs?v=578e683088fd"></script>
</body>
</html>
