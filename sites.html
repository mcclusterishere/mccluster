<body class="songpage">

  <main class="st">
    <!-- No hook, no scarcity, no essay. The page opens on the count and
         the first card, because somebody who came here to buy a website
         has already been sold; making them read first is making them
         wait. What used to stand here — "three builds, then never again"
         and the seat ledger under it — was a limited-time frame on an
         offer that is not limited, and it is gone rather than moved. -->

    <!-- THE CONVERSATION, WHEN THERE IS ONE TO HAVE.

         Buying a website is not picking a SKU. Nobody knows whether they
         need four pages or nine, and the card cannot ask. So the front
         door is a conversation that can quote the price, check whether
         the address is free, and take the money in the same thread — and
         the cards move behind a link for the people who would rather
         read than talk.

         THIS BLOCK IS NOT ALWAYS THE FRONT DOOR. js/chatfirst.js asks
         the live function whether it can actually answer before promoting
         it. A conversation in front of a deployment with no knowledge
         base is worse than the cards were, so until that answer comes
         back yes, the cards stay exactly where they are and this stays
         hidden. Nothing to configure: the old deployment does not know
         the question. -->
    <section class="talk" id="talk" hidden aria-label="Talk to the desk">
      <p class="buys__k">Ask for what you need</p>
      <div class="buys__rule"></div>
      <div class="talk__mount" data-desk-inline></div>
      <div class="talk__chips" id="talkChips" role="group" aria-label="Things people ask"></div>
      <p class="talk__alt">
        Rather read than talk?
        <button type="button" id="talkBrowse" class="talk__link">Look through all four &rarr;</button>
      </p>
    </section>

    <!-- FOUR CARDS. One price, one sentence, one button each. The count
         line above them is counted, not typed: add a way to pay and the
         sentence moves with it. Every figure comes from data/offers.json;
         nothing is priced in this markup and nothing ever should be. -->
    <section class="buys" id="offerBuy" aria-label="What you can buy"></section>

    <!-- WHO IT WAS BUILT FOR. Kept because a real site somebody can open
         is worth more than any sentence about the work, and rewritten
         because these used to be numbered seats in a countdown. They are
         examples now. Nobody is being told to hurry. -->
    <section class="madefor" aria-label="Built with">
      <p class="buys__k">Built with</p>
      <div class="buys__rule"></div>
      <div class="madefor__row" id="madeForRow"></div>
    </section>
  </main>

  <script>
  /* THE EXAMPLES.
     data/sites.json still carries a seat ledger — seats, taken, taken_by —
     because it is the record of who got a free build. What it no longer
     does is drive a countdown on this page: no "one seat left", no "02 of
     03", no urgency built out of a number. Each entry is a client, a line
     about what was built, and a link to the thing itself. */
  (function () {
    "use strict";
    var row = document.getElementById("madeForRow");
    if (!row) return;
    var esc = function (x) { var d = document.createElement("i"); d.textContent = x == null ? "" : x; return d.innerHTML; };

    fetch("data/sites.json?v=__STAMP__").then(function (r) { return r.json(); }).then(function (d) {
      var shown = (d.showcase || []).filter(function (s) { return s && s.slug && s.name; });
      if (!shown.length) { row.closest(".madefor").hidden = true; return; }
      row.innerHTML = shown.map(function (s) {
        return '<a class="madefor__one" href="demo.html?s=' + esc(encodeURIComponent(s.slug)) + '">' +
          "<b>" + esc(s.name) + "</b>" +
          (s.kind ? "<i>" + esc(s.kind) + "</i>" : "") +
          (s.line ? "<small>" + esc(s.line) + "</small>" : "") +
          '<span class="madefor__see">See it <em aria-hidden="true">&#8594;</em></span></a>';
      }).join("");
    }).catch(function () { var m = row.closest(".madefor"); if (m) m.hidden = true; });
  })();
  </script>
