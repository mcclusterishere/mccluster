# Fail-safe mirror of workers/mccluster/wrangler.toml.
# There is ONE Worker: mccluster. Cloudflare Git integration should still use
# workers/mccluster as its Root directory, but an accidental repo-root deploy
# must execute the same entrypoint and cron rather than the legacy core-only path.

name = "mccluster"
main = "workers/mccluster/src/entry.js"
compatibility_date = "2026-09-02"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = false

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
ALLOWED_ORIGINS = "https://matthew.mccluster.org,https://mccluster.org,http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500"
MCCLUSTER_SUPABASE_PROJECT_REF = "zmnhbrjyhxzhkxmhkexs"
PUBLIC_ORIGIN = "https://matthew.mccluster.org"
APEX_ORIGIN = "https://mccluster.org"
ALLOW_DEMO_IDENTITIES = "false"
PUBLIC_APP_URL = "https://matthew.mccluster.org"
META_GRAPH_API_VERSION = "v26.0"

# The internal spatial console at /internal/seek-first ships as a text module. Without
# this rule an accidental repo-root deploy fails to bundle the Worker at all,
# which is exactly the case this fail-safe file exists to survive.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "HereTenantAgent"
class_name = "HereTenantAgent"

[exports.HereTenantAgent]
type = "durable-object"
storage = "sqlite"
