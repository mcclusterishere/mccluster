# Cloudflare Git integration looks at the repository ROOT.
# There is ONE Worker. Its name is mccluster.
# Do not create or deploy a Worker named mccluster-core.
# Dashboard Root directory should be workers/mccluster so this file is not the one Wrangler uses in CI.

name = "mccluster"
main = "workers/mccluster/src/index.js"
compatibility_date = "2026-09-02"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://matthew.mccluster.org,https://mccluster.org,http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500"
MCCLUSTER_SUPABASE_PROJECT_REF = "zmnhbrjyhxzhkxmhkexs"
PUBLIC_ORIGIN = "https://matthew.mccluster.org"
APEX_ORIGIN = "https://mccluster.org"
ALLOW_DEMO_IDENTITIES = "false"

[[durable_objects.bindings]]
name = "HereTenantAgent"
class_name = "HereTenantAgent"

[exports.HereTenantAgent]
type = "durable-object"
storage = "sqlite"
