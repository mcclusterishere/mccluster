<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A playable PRIM3 courtyard study with tactical movement and optional coordinate practice.">
  <title>PRIM3 courtyard study · McCluster</title>
  <script src="js/shell-boot.js?v=578e683088fd"></script>
  <link rel="stylesheet" href="css/style.css?v=578e683088fd">
  <script src="js/theme.js?v=578e683088fd"></script>
  <style>
    body.prim3-courtyard-host { margin:0; padding:0; min-width:0; }
    .p3-study-host, .p3-study-host * { box-sizing:border-box; }
    .p3-study-host {
      width:100%; max-width:1440px; margin:0 auto; min-width:0;
      padding:calc(72px + env(safe-area-inset-top)) 0 calc(112px + env(safe-area-inset-bottom));
      display:grid; grid-template-columns:minmax(0,1fr); gap:12px;
    }
    .p3-study-heading { padding:0 12px; min-width:0; }
    .p3-study-heading h1 { margin:4px 0 6px; font-size:clamp(22px,4vw,32px); line-height:1.15; }
    .p3-study-heading p { margin:0; font-size:16px; line-height:1.5; max-width:60ch; }
    .p3-study-links { display:flex; flex-wrap:wrap; gap:4px 16px; margin-bottom:8px; }
    .p3-study-links a { display:inline-flex; align-items:center; min-height:44px; font-size:16px; line-height:1.3; text-underline-offset:3px; }
    .p3-study-frame {
      display:block; width:100%; min-width:0; height:850px; min-height:600px;
      border:0; background:#0e1719; color-scheme:dark;
    }
    .p3-study-skip {
      position:absolute; left:12px; top:8px; z-index:10000; padding:12px 16px;
      background:#fff; color:#111; transform:translateY(-180%);
    }
    .p3-study-skip:focus { transform:none; }
    @media (min-width:700px) {
      .p3-study-host { gap:16px; }
      .p3-study-heading { padding:0 24px; }
    }
    @media (min-width:1100px) {
      .p3-study-host { padding-left:20px; padding-right:20px; }
      .p3-study-heading { padding:0 8px; }
    }
  </style>
</head>
<body class="prim3-courtyard-host">
  <a class="p3-study-skip" href="#courtyard-frame">Skip to courtyard</a>
  <!-- Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the study's
       frame is created only after that yes (owner, 2026-11-03: "keep it on my private account"). -->
  <section class="owner-gate" aria-live="polite" data-owner-gate data-owner-template="cyTpl">
    <h1>Owner only</h1>
    <p data-owner-msg>Checking access with the server…</p>
  </section>
  <template id="cyTpl">
  <main class="p3-study-host">
    <header class="p3-study-heading">
      <nav class="p3-study-links" aria-label="Courtyard study">
        <a href="prim3.html">Back to PRIM3</a>
        <a href="demos/prim3-courtyard/index.html">Open the study on its own</a>
      </nav>
      <h1>Courtyard study</h1>
      <p>Choose an operative, preview a route, and reach the relay. Coordinate practice is optional.</p>
    </header>
    <iframe
      id="courtyard-frame"
      class="p3-study-frame"
      title="PRIM3 playable tactical courtyard study"
      src="demos/prim3-courtyard/index.html"
      allow="fullscreen"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
  </template>
  <script>
    // This trusted, same-origin demo has no account bridge or duplicate site navigation.
    // Fit the frame to its content so the host remains the scrolling surface.
    // runs once js/owner-only.mjs has put the study's markup in place
    addEventListener('mcc:owner-open', function () {
      'use strict';
      var frame = document.getElementById('courtyard-frame');
      var observer = null;
      var pending = 0;
      function fit() {
        pending = 0;
        try {
          var doc = frame.contentDocument;
          var game = doc && doc.getElementById('prim3-game');
          if (!game) return;
          var next = Math.max(600, Math.ceil(game.getBoundingClientRect().height));
          if (Math.abs(frame.getBoundingClientRect().height - next) > 1) frame.style.height = next + 'px';
        } catch (error) {
          // Normal iframe scrolling remains available if the demo is later hosted elsewhere.
        }
      }
      function schedule() {
        if (!pending) pending = window.requestAnimationFrame(fit);
      }
      frame.addEventListener('load', function () {
        if (observer) observer.disconnect();
        try {
          var doc = frame.contentDocument;
          var game = doc && doc.getElementById('prim3-game');
          if (game && 'ResizeObserver' in window) {
            observer = new ResizeObserver(schedule);
            observer.observe(game);
          }
        } catch (error) {}
        schedule();
      });
      window.addEventListener('resize', schedule);
      window.addEventListener('pagehide', function () {
        if (observer) observer.disconnect();
        if (pending) window.cancelAnimationFrame(pending);
      });
    }, { once: true });
  </script>
  <script type="module" src="js/owner-only.mjs?v=578e683088fd"></script>
  <script src="js/mcc-auth.js?v=578e683088fd"></script>
  <script src="js/tabbar.js?v=578e683088fd"></script>
</body>
</html>
