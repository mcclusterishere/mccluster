<section data-owner-gate data-owner-template="hexTpl" data-owner-load="js/prim3-tactics/hex-ui.mjs"><h1>PRIM3 · Hex Relay</h1><p data-owner-msg>Checking access…</p></section>
<template id="hexTpl"><main><header><div><p class="eyebrow">PRIM3 / TRANSIT · EXPERIMENTAL HEX MODE</p><h1>Secure the relay.</h1></div><a href="prim3-transit.html">Square game</a></header>
<p id="training-intro">Lead Entry, Recon and Technical through the yard. <a href="?lab=network&amp;view=2d">Open local network training</a> · <a href="prim3-shared-fate.html">Shared Fate client mission</a>. Technical connects the relay twice; then extract all three. Every turn costs time. This training slice does not change story progress.</p>
<div class="toolbar"><strong id="status"></strong><button id="end">End turn</button><button id="restart">Restart drill</button><button id="view">Switch to 3D</button><button id="focus">Focus squad</button></div>
<div class="layout"><section aria-label="Tactical battlefield"><div id="scene" hidden></div><div id="map"></div><p class="legend">Blue outline: one AP · Amber: dash, two AP · Red: squad · Blue figure: opposition · R: relay · X: extraction</p><p id="graphics" role="status"></p></section>
<aside><div id="squad" aria-label="Select operative"></div><h2 id="actor"></h2><p id="stats"></p><p id="objective"></p><div id="actions" class="toolbar"><button data-action="overwatch">Overwatch</button><button data-action="hunker">Hunker</button><button data-action="reload">Reload</button><button data-action="relay">Connect relay · 1 AP</button><button data-action="extract">Extract</button></div><section id="network-lab" hidden><h2>TR02 · Network workbench</h2><p>Local synthetic training operation. No network traffic, hosted compute or competency credit. Configure the device, then independently verify its service.</p><pre id="lab-evidence"></pre><label>Subnet prefix <input id="lab-prefix" type="number" min="24" max="30" value="28"></label><label>Gateway <input id="lab-gateway" value="10.44.8.1" autocomplete="off"></label><label>Reserved Mbps <input id="lab-bandwidth" type="number" min="1" max="30" value="12"></label><button id="lab-prepare">Preview configuration</button><div id="lab-actions"><button data-lab-action="observe">Recon: inspect · 1 AP</button><button data-lab-action="hold">Entry: hold access · 1 AP</button><button data-lab-action="verify">Technical: verify · 1 AP</button><button data-lab-action="resetLab">Technical: restore device · 1 AP</button><button data-lab-action="hint">Hint · 1 AP</button></div><button id="lab-export">Export local evidence</button><details><summary>Device state, probes and separate results</summary><pre id="lab-result"></pre></details><a href="?lab=network&amp;variant=transfer&amp;view=2d">Changed-address transfer (Restart to start fresh)</a></section><h2>Visible targets</h2><div id="targets"></div><section id="orders" aria-label="Current order"><strong id="order-unit"></strong><p id="preview" aria-live="polite">Select a hex to preview a route.</p><button id="confirm" disabled>Confirm order</button><button id="cancel">Cancel</button><p id="message" role="status"></p></section><details><summary>How to play</summary><p>Select an operative, then a reachable hex. Review metres and AP before confirming. Firing costs one AP under the current PRIM3 rules. Overwatch reacts to enemy movement; reload uses one AP. Low cover protects only from its facing direction. Opaque high obstacles block sight. Use Recon and Entry to protect Technical. Connect twice near R, then move each operative to X and extract. Losing an operative or running out of time fails this drill.</p><p>Keyboard: Tab through controls and hexes, Enter to select; Escape cancels. The 2D map is fully playable. 3D: drag to pan, wheel/pinch to zoom.</p></details><details><summary>Recent events</summary><ol id="events"></ol></details></aside></div></main></template>
