<html lang="en"><head><script src="js/shell-boot.js?v=__STAMP__"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Earth · McCluster</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Widgets/widgets.css" integrity="sha384-ghEeMdcWWzRv/BPeUcX835vcKDGrxvROXisl/Btpv3GeekBUXTSPVcFJpI1Tcrgp" crossorigin="anonymous">
<style>html,body,#earth{width:100%;height:100%;margin:0;overflow:hidden;background:#070c16} .notice{position:absolute;left:12px;bottom:12px;color:#d5deec;font:12px system-ui;pointer-events:none} .cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animation,.cesium-viewer-timeline{display:none!important} .osm-credit{position:absolute;z-index:4;right:8px;bottom:8px;font:10px/1.4 system-ui;color:#d5deec;background:#070c1699;padding:2px 6px;border-radius:6px;text-decoration:none} .guest-main{position:absolute;inset:0;margin:0} .guest-title{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0} .guest-door[hidden]{display:none}.guest-door{position:absolute;z-index:4;right:12px;top:12px;background:#111b2be8;border:1px solid #64748b;border-radius:999px;padding:10px 16px;color:white;font:700 13px system-ui;text-decoration:none} </style></head>
<body data-no-appbar><main class="guest-main"><h1 class="guest-title">Explore Earth</h1><div id="earth" role="region" aria-label="Interactive Earth. Drag to rotate, pinch to zoom."></div><a class="guest-door" href="account.html" target="_top">Sign in to unlock data →</a><div id="notice" class="notice">Drag to explore Earth · Sign in to see activity</div><a class="osm-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></main>
<script>window.CESIUM_BASE_URL="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/";</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Cesium.js" integrity="sha384-W0LzTQiWiURlw8LASwpRL4/0B+MXygEt8/AY25JrJMhqldeMm3EhD6XY+1K0LglH" crossorigin="anonymous"></script>
<script>
(function(){var notice=document.getElementById('notice');var parentEntry=new URLSearchParams(location.search).get('entry')==='parent';if(parentEntry){document.querySelector('.guest-door').hidden=true;notice.textContent='Drag to explore Earth';}if(!window.Cesium){notice.textContent='Earth preview unavailable';return;}
try{var viewer=new Cesium.Viewer('earth',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,infoBox:false,selectionIndicator:false,fullscreenButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}))});
/* Cesium's credit logo arrives without alt; give it its title as text. */var altFix=function(){viewer.container.querySelectorAll('img:not([alt])').forEach(function(i){i.alt=i.title||'';});};new MutationObserver(altFix).observe(viewer.container,{childList:true,subtree:true});altFix();
viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-20,14,19000000)});
viewer.scene.globe.enableLighting=true;
viewer.scene.screenSpaceCameraController.enableTilt=false;
viewer.scene.screenSpaceCameraController.minimumZoomDistance=1900000;
viewer.scene.screenSpaceCameraController.maximumZoomDistance=38000000;
}catch(err){notice.textContent='Earth preview unavailable';console.warn('Guest globe initialization failed',err);}
})();
</script><script src="js/tabbar.js"></script></body></html>
