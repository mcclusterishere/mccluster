<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="equity-uprise-build" content="__STAMP__"><title>Equity Uprise — Working Building Stack</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101214;color:#fff;font-family:Inter,system-ui,sans-serif}#app{position:fixed;inset:0}.hud{position:fixed;z-index:5;left:12px;top:12px;max-width:min(660px,calc(100vw - 24px));background:#0b0d10df;border:1px solid #444;border-radius:14px;padding:12px}.hud h1{font-size:14px;margin:0 0 4px}.hud p{font-size:11px;color:#ccc;margin:0 0 8px}.c{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid #555;border-radius:999px;background:#232629;color:#fff;padding:6px 9px;font:700 10px system-ui}button.active{background:#851a1d}.s{position:fixed;right:12px;bottom:12px;background:#0b0d10df;border:1px solid #444;border-radius:10px;padding:8px 10px;font-size:10px}</style></head><body><div id="app"></div><div class="hud"><h1>EQUITY UPRISE · WORKING BUILDING · B1 → ROOF</h1><p>The full building is stacked now. F1 + F2 are detailed inserts; F3–F7 remain chassis until their floor-by-floor passes.</p><div class="c"><button data-f="stack" class="active">Stack</button><button data-f="0">B1</button><button data-f="1">1</button><button data-f="2">2</button><button data-f="3">3</button><button data-f="4">4</button><button data-f="5">5</button><button data-f="6">6</button><button data-f="7">Roof</button><button id="wire">Wireframe</button></div></div><div class="s" id="status">Loading working stack…</div>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const FT=.3048,ft=v=>v*FT,app=document.getElementById('app'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x101214);scene.fog=new THREE.Fog(0x101214,ft(100),ft(240));
const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,ft(360)),ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.outputColorSpace=THREE.SRGBColorSpace;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.0;app.appendChild(ren.domElement);const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.maxDistance=ft(260);ctl.minDistance=ft(15);
scene.add(new THREE.HemisphereLight(0xf2eee6,0x111315,1.8));const dl=new THREE.DirectionalLight(0xfff1df,2.5);dl.position.set(ft(90),ft(150),ft(20));scene.add(dl);
const loader=new GLTFLoader();let base,f1,f2,wire=false,loaded=0;
function done(){loaded++;if(loaded===3){status.textContent='Working stack loaded · detailed F1 + F2 · chassis F3–F7';focus('stack')}}
loader.load('/equity-uprise-preview/equity-uprise-building-core-v2.glb?v=__STAMP__',g=>{base=g.scene;scene.add(base);base.traverse(o=>{if(!o.isMesh)return;const n=o.name||'';if(/^L[12]_(program|circle|support|slab|north_wall|south_|west_wall|east_wall)/.test(n))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-01-core-v2.glb?v=__STAMP__',g=>{f1=g.scene;scene.add(f1);f1.traverse(o=>{if(o.isMesh&&/^(stair_|passenger_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-02-core-v2.glb?v=__STAMP__',g=>{f2=g.scene;f2.position.y=ft(13.5);scene.add(f2);f2.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
const elev={0:-13.5,1:0,2:13.5,3:27,4:40.5,5:54,6:67.5,7:81};
function focus(k){document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===String(k)));if(k==='stack'){cam.position.set(ft(130),ft(110),ft(145));ctl.target.set(ft(36),ft(38),ft(-36))}else{const z=elev[+k];cam.position.set(ft(95),ft(z+22),ft(58));ctl.target.set(ft(36),ft(z+5),ft(-36))}ctl.update()}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>focus(b.dataset.f));document.getElementById('wire').onclick=e=>{wire=!wire;scene.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if('wireframe'in m){m.wireframe=wire;m.needsUpdate=true}})}});e.target.textContent=wire?'Solid':'Wireframe'};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});ren.setAnimationLoop(()=>{ctl.update();ren.render(scene,cam)});
</script></body></html>
