<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101214;color:#fff;font-family:Inter,system-ui,sans-serif}#app{position:fixed;inset:0}.hud{position:fixed;z-index:5;left:12px;top:12px;max-width:min(660px,calc(100vw - 24px));background:#0b0d10df;border:1px solid #444;border-radius:14px;padding:12px}.hud h1{font-size:14px;margin:0 0 4px}.hud p{font-size:11px;color:#ccc;margin:0 0 8px}.c{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid #555;border-radius:999px;background:#232629;color:#fff;padding:6px 9px;font:700 10px system-ui}button.active{background:#851a1d}.s{position:fixed;right:12px;bottom:12px;background:#0b0d10df;border:1px solid #444;border-radius:10px;padding:8px 10px;font-size:10px}</style></head><body><div id="app"></div><div class="hud"><h1>EQUITY UPRISE · WORKING BUILDING · B1 → ROOF</h1><p>The full building is stacked now. Tap a floor number to isolate that level; Stack restores the whole building. F1–F7 are detailed; both protected stairs physically reach the roof.</p><div class="c"><button data-f="stack" class="active">Stack</button><button data-f="0">B1</button><button data-f="1">1</button><button data-f="2">2</button><button data-f="3">3</button><button data-f="4">4</button><button data-f="5">5</button><button data-f="6">6</button><button data-f="7">Roof</button><button id="wire">Wireframe</button></div></div><div class="s" id="status">Loading working stack…</div>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const FT=.3048,ft=v=>v*FT,app=document.getElementById('app'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x101214);scene.fog=new THREE.Fog(0x101214,ft(100),ft(240));
const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,ft(360)),ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.outputColorSpace=THREE.SRGBColorSpace;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.0;app.appendChild(ren.domElement);const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.maxDistance=ft(260);ctl.minDistance=ft(15);
scene.add(new THREE.HemisphereLight(0xf2eee6,0x111315,1.8));const dl=new THREE.DirectionalLight(0xfff1df,2.5);dl.position.set(ft(90),ft(150),ft(20));scene.add(dl);
const loader=new GLTFLoader();let base,f1,f2,f3,f4,f5,f6,f7,wire=false,loaded=0;
function makeReliable(root){
 root.traverse(o=>{if(o.isMesh){o.frustumCulled=false;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.side=THREE.DoubleSide;m.needsUpdate=true})}});
}
function frameStack(){
 const box=new THREE.Box3().setFromObject(scene),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);
 const span=Math.max(size.x,size.z,size.y);cam.position.set(center.x+span*.7,center.y+span*.48,center.z+span*.85);ctl.target.copy(center);cam.far=Math.max(ft(420),span*8);cam.updateProjectionMatrix();ctl.update();
}
const requestedFloor=new URLSearchParams(location.search).get('floor');
function setF7StackDupVisibility(show){
 if(!f7)return;
 f7.traverse(o=>{if(!o.isMesh)return;const n=o.name||'';if(/^F7-(?:STAIR-[AB]-(?:TRANSITION|HEADHOUSE)|PASSENGER-OVERRUN|FREIGHT-OVERRUN)/.test(n))o.visible=show});
}
function done(){loaded++;if(loaded===8){status.textContent='Working stack loaded · detailed F1–F7 · protected stairs B1→roof';setF7StackDupVisibility(false);if(requestedFloor&&/^[0-7]$/.test(requestedFloor))focus(requestedFloor);else frameStack()}}
loader.load('/equity-uprise-preview/equity-uprise-building-core-v2.glb?v=__STAMP__',g=>{base=g.scene;base.rotation.x=-Math.PI/2;base.updateMatrixWorld(true);scene.add(base);makeReliable(base);base.traverse(o=>{if(!o.isMesh)return;const n=o.name||'';if(/^L[123456]_(program|circle|support|slab|north_wall|south_|west_wall|east_wall)/.test(n)||/^L7_(program|circle|support|slab|parapet|zone)/.test(n))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-01-core-v2.glb?v=__STAMP__',g=>{f1=g.scene;f1.rotation.x=-Math.PI/2;f1.updateMatrixWorld(true);scene.add(f1);makeReliable(f1);f1.traverse(o=>{if(o.isMesh&&/^(stair_|passenger_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-02-core-v2.glb?v=__STAMP__',g=>{f2=g.scene;f2.rotation.x=-Math.PI/2;f2.position.y=ft(13.5);f2.updateMatrixWorld(true);scene.add(f2);makeReliable(f2);f2.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-03-core-v2.glb?v=__STAMP__',g=>{f3=g.scene;f3.rotation.x=-Math.PI/2;f3.position.y=ft(27);f3.updateMatrixWorld(true);scene.add(f3);makeReliable(f3);f3.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-04-core-v2.glb?v=__STAMP__',g=>{f4=g.scene;f4.rotation.x=-Math.PI/2;f4.position.y=ft(40.5);f4.updateMatrixWorld(true);scene.add(f4);makeReliable(f4);f4.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-05-core-v2.glb?v=__STAMP__',g=>{f5=g.scene;f5.rotation.x=-Math.PI/2;f5.position.y=ft(54);f5.updateMatrixWorld(true);scene.add(f5);makeReliable(f5);f5.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-06-core-v2.glb?v=__STAMP__',g=>{f6=g.scene;f6.rotation.x=-Math.PI/2;f6.position.y=ft(67.5);f6.updateMatrixWorld(true);scene.add(f6);makeReliable(f6);f6.traverse(o=>{if(o.isMesh&&/^(stair_|pass_|freight_|mep)/i.test(o.name||''))o.visible=false});done()});
loader.load('/equity-uprise-preview/equity-uprise-floor-07-core-v2.glb?v=__STAMP__',g=>{f7=g.scene;f7.rotation.x=-Math.PI/2;f7.position.y=ft(81);f7.updateMatrixWorld(true);scene.add(f7);makeReliable(f7);done()});
const elev={0:-13.5,1:0,2:13.5,3:27,4:40.5,5:54,6:67.5,7:81};
const detailed={1:()=>f1,2:()=>f2,3:()=>f3,4:()=>f4,5:()=>f5,6:()=>f6,7:()=>f7};
function frameObject(root,pad=1.35){
  root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root),size=new THREE.Vector3(),center=new THREE.Vector3();
  box.getSize(size);box.getCenter(center);
  const span=Math.max(size.x,size.z,size.y);
  cam.position.set(center.x+span*.72,center.y+Math.max(size.y*.85,ft(16)),center.z+span*.82);
  ctl.target.copy(center);cam.near=.02;cam.far=Math.max(ft(420),span*8);cam.updateProjectionMatrix();ctl.update();
}
function restoreBaseStackVisibility(){
  base.visible=true;
  base.traverse(o=>{
    if(!o.isMesh)return;
    const n=o.name||'';
    o.visible=!(/^L[123456]_(program|circle|support|slab|north_wall|south_|west_wall|east_wall)/.test(n)||/^L7_(program|circle|support|slab|parapet|zone)/.test(n));
  });
}
function isolateBaseLevel(level){
  base.visible=true;
  const tag=level===0?'B1':('L'+level+'_');
  base.traverse(o=>{
    if(!o.isMesh)return;
    const n=o.name||'';
    const isSite=/^(site_|tunnel_|B1_)/.test(n);
    const isLevel=level===0?isSite:n.startsWith(tag);
    o.visible=isLevel;
  });
}
function focus(k){
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===String(k)));
  const roots=[f1,f2,f3,f4,f5,f6,f7].filter(Boolean);
  if(k==='stack'){
    roots.forEach(r=>r.visible=true);
    restoreBaseStackVisibility();
    setF7StackDupVisibility(false);
    status.textContent='Stack view · detailed F1–F7 · protected stairs B1→roof';
    frameStack();return;
  }
  const level=+k;
  roots.forEach(r=>r.visible=false);
  if(detailed[level]&&detailed[level]()){
    base.visible=false;
    const root=detailed[level]();root.visible=true;
    if(level===7)setF7StackDupVisibility(true);
    status.textContent=level===7?'Isolated Level 7 · detailed roof + protected stair arrivals':'Isolated Floor '+level+' · detailed model only';
    frameObject(root);return;
  }
  isolateBaseLevel(level);
  status.textContent=level===0?'Isolated B1 chassis':'Isolated Floor '+level+' chassis';
  frameObject(base);
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>focus(b.dataset.f));
document.getElementById('wire').onclick=e=>{wire=!wire;scene.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if('wireframe'in m){m.wireframe=wire;m.needsUpdate=true}})}});e.target.textContent=wire?'Solid':'Wireframe'};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});ren.setAnimationLoop(()=>{ctl.update();ren.render(scene,cam)});
