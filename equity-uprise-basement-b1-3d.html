import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const FT=.3048,ft=v=>v*FT,app=document.getElementById('app'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1114);scene.fog=new THREE.Fog(0x0c1114,ft(70),ft(160));const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.02,ft(240));const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.08;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;app.appendChild(r.domElement);const ctl=new OrbitControls(camera,r.domElement);ctl.enableDamping=true;ctl.minDistance=ft(4);ctl.maxDistance=ft(150);scene.add(new THREE.HemisphereLight(0xc7d1d6,0x111315,1.25));const key=new THREE.DirectionalLight(0xffe7c7,1.6);key.position.set(ft(18),ft(26),ft(-18));key.castShadow=true;scene.add(key);for(const [x,z,i] of [[18,-28,8],[40,-34,9],[34,-58,10],[60,-18,7]]){const p=new THREE.PointLight(0xffdfb2,i,ft(30),2);p.position.set(ft(x),ft(9),ft(z));scene.add(p)}let model,wire=false,ceiling=true;function frameLoadedModel(){model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);const span=Math.max(size.x,size.z);camera.position.set(center.x+span*.62,Math.max(center.y+size.y*.9,ft(19)),center.z+span*.72);ctl.target.copy(center);camera.far=Math.max(ft(280),span*8);camera.updateProjectionMatrix();ctl.update()}function setCeiling(show){ceiling=show;model?.traverse(o=>{if(o.isMesh&&(o.name||'').startsWith('B1-CEILING-01'))o.visible=show});document.getElementById('ceiling').textContent=show?'Hide Ceiling':'Show Ceiling'}new GLTFLoader().load('/equity-uprise-preview/equity-uprise-basement-b1-core-v2.glb?v=__STAMP__',g=>{model=g.scene;model.rotation.x=-Math.PI/2;scene.add(model);let n=0;model.traverse(o=>{if(o.isMesh){n++;o.castShadow=o.receiveShadow=true;o.frustumCulled=false;const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.side=THREE.DoubleSide;m.needsUpdate=true})}});frameLoadedModel();status.textContent=n+' meshes · 67/67 inventory records · detailed B1 · both stairs rise to Floor 1'},undefined,e=>{console.error(e);status.textContent='Model load failed: '+(e?.message||e)});const V={mechanical:{p:[34,8,8],t:[16,4.5,16]},electrical:{p:[62,8,4],t:[42,4.2,12]},lab:{p:[58,8,31],t:[35,4,45]},ops:{p:[58,8,47],t:[34,4,59]},lock:{p:[54,8,61],t:[34,4,68]},core:{p:[47,10,52],t:[60,5,57]}};function go(k){const v=V[k];camera.position.set(ft(v.p[0]),ft(v.p[1]),ft(-v.p[2]));ctl.target.set(ft(v.t[0]),ft(v.t[1]),ft(-v.t[2]));ctl.update()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));document.getElementById('frame').onclick=()=>model&&frameLoadedModel();document.getElementById('ceiling').onclick=()=>setCeiling(!ceiling);document.getElementById('wire').onclick=e=>{wire=!wire;model?.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if('wireframe'in m){m.wireframe=wire;m.needsUpdate=true}})}});e.target.textContent=wire?'Solid':'Wireframe'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});r.setAnimationLoop(()=>{ctl.update();r.render(scene,camera)});</script>  <script src="js/site-editor.js?v=__STAMP__" defer></script>
