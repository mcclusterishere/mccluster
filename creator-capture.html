<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Record and drafts · Creator Workspace</title><link rel="stylesheet" href="css/style.css?v=43820c7ef593"><style>body{background:#101013;color:#f7f7f7;font-family:system-ui,sans-serif}main{max-width:850px;margin:0 auto;padding:5rem 1.25rem 9rem}h1{font-size:clamp(2rem,7vw,4rem)}.panel{padding:1.25rem;border:1px solid #555;border-radius:14px;margin:1rem 0;background:#1b1b20}a,button{color:inherit}button,.action{display:inline-block;padding:.8rem 1rem;background:#333;border:1px solid #888;border-radius:8px;cursor:pointer;margin:.35rem}.muted{color:#b8b8bf}input,textarea{font:inherit;max-width:100%}textarea{width:100%;min-height:100px;background:#24242a;color:white;padding:1rem}video{width:100%;max-height:420px} [hidden]{display:none!important}</style></head><body><main><p><a href="mnet.html?view=profile">← Member workspace</a></p><h1>Creator capture</h1><p class="muted">Record on your phone, upload media, or prepare a draft. Drafts stay on this device until you choose to publish through a connected creator workflow.</p><section id="workspace" hidden><div class="panel"><h2>Open camera or choose media</h2><label class="action" for="camera">Camera</label><input id="camera" type="file" accept="image/*,video/*" capture="environment" hidden><label class="action" for="upload">Upload media</label><input id="upload" type="file" accept="image/*,video/*" hidden><p id="selected" role="status">No media selected.</p><video id="preview" controls hidden></video><img id="photo" alt="Selected image preview" style="max-width:100%" hidden></div><div class="panel"><h2>Draft editor</h2><textarea id="caption" maxlength="3000" placeholder="Caption, idea, or script"></textarea><button id="save" type="button">Save local draft</button><p id="status" role="status"></p><h3>Drafts on this device</h3><div id="drafts"></div></div></section><script>/* Local text-only drafts; media must be reselected when returning. */(function(){var key="mcc_creator_capture_drafts_v1",file=null,url=null;function load(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return []}}function render(){var host=document.getElementById("drafts");host.replaceChildren();load().forEach(function(d,i){var row=document.createElement("p"),b=document.createElement("button");b.textContent="Edit";b.onclick=function(){document.getElementById("caption").value=d.text};row.textContent=d.text.slice(0,100)+" · "+new Date(d.date).toLocaleDateString()+" ";row.appendChild(b);host.appendChild(row)})}function chosen(e){file=e.target.files&&e.target.files[0];document.getElementById("selected").textContent=file?file.name:"No media selected";if(url)URL.revokeObjectURL(url);url=file?URL.createObjectURL(file):null;var video=document.getElementById("preview"),img=document.getElementById("photo");video.hidden=true;img.hidden=true;if(file&&file.type.startsWith("video/")){video.src=url;video.hidden=false}else if(file&&file.type.startsWith("image/")){img.src=url;img.hidden=false}}document.getElementById("camera").onchange=chosen;document.getElementById("upload").onchange=chosen;document.getElementById("save").onclick=function(){var text=document.getElementById("caption").value.trim();if(!text)return;var drafts=load();drafts.unshift({text:text,date:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(drafts.slice(0,30)));document.getElementById("status").textContent="Text draft saved on this device. Media is not uploaded.";render()};render()})();</script><p class="muted" id="gate" role="status">Checking your session…</p></main><script src="js/mcc-auth.js?v=43820c7ef593"></script><script src="js/tabbar.js?v=43820c7ef593"></script><script>window.addEventListener("mcc:auth-state",function(e){var ok=e.detail&&e.detail.signed_in&&e.detail.verified;document.getElementById("workspace").hidden=!ok;document.getElementById("gate").textContent=ok?"": "Sign in to use this workspace.";});</script></body></html>
