# Supabase project config for the McCluster platform.
#
# Every deployed or source-controlled function in the reconciliation surface
# declares its gateway mode explicitly so a deploy cannot silently weaken or
# strengthen authentication. verify_jwt=false is allowed only for public
# intake/webhook/OAuth bootstrap surfaces whose function body implements the
# required custom boundary.

project_id = "zmnhbrjyhxzhkxmhkexs"

# ---------------- Legacy public/self-authenticated surfaces ----------------
[functions.checkout]
verify_jwt = false

[functions.inbox]
verify_jwt = false

[functions.eu-converse]
verify_jwt = false

[functions.shake-order]
verify_jwt = false

[functions.domain-check]
verify_jwt = false

[functions.pay-now]
verify_jwt = false

[functions.intake]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

# Superseded marketplace functions remain JWT-gated until their deployment is
# replaced by the retirement tombstones in this repository.
[functions.backend-sub]
verify_jwt = true

[functions.connect-onboard]
verify_jwt = true

[functions.org-connect-onboard]
verify_jwt = true

[functions.connect-org]
verify_jwt = true

# ---------------- Context / operations ----------------
[functions.context-ingest]
verify_jwt = true

[functions.context-query]
verify_jwt = true

[functions.context-decision]
verify_jwt = true

# context-core is server-to-server and uses constant-time compared
# MCCLUSTER_CONTEXT_TOKEN inside the function.
[functions.context-core]
verify_jwt = false

[functions.ops-chat]
verify_jwt = true

[functions.outreach]
verify_jwt = true

[functions.outreach-webhook]
verify_jwt = false

[functions.social]
verify_jwt = true

[functions.gev-proxy]
verify_jwt = true

# One-shot OAuth client bootstrap must run before an OAuth client exists; it
# fails closed unless M_OAUTH_BOOTSTRAP_NONCE is configured and supplied.
[functions.m-oauth-bootstrap]
verify_jwt = false

# ---------------- Payments / provider callbacks ----------------
[functions.stripe-webhook]
verify_jwt = false

# ---------------- Equity Uprise Policy OS ----------------
[functions.eu-intake]
verify_jwt = false

[functions.eu-calendar]
verify_jwt = false

[functions.eu-google-workspace]
verify_jwt = false

# Internal worker authenticates with its dedicated request-auth contract.
[functions.eu-worker]
verify_jwt = false

[functions.eu-external-worker]
verify_jwt = false

[functions.eu-ddex-worker]
verify_jwt = false

[functions.eu-monitor]
verify_jwt = false

[functions.eu-orcid-oauth]
verify_jwt = false

[functions.eu-crossref-callback]
verify_jwt = false

[functions.eu-workspace]
verify_jwt = true

[functions.eu-publish]
verify_jwt = true

[functions.eu-government]
verify_jwt = true

[functions.eu-music]
verify_jwt = true

[functions.eu-derivatives]
verify_jwt = true

[functions.eu-status]
verify_jwt = true

[functions.eu-control]
verify_jwt = true

# ---------------- Level 3 Media ----------------
[functions.l3-login]
verify_jwt = false

[functions.l3-subscribe]
verify_jwt = true

[functions.l3-portal]
verify_jwt = true

[functions.l3-connect-onboard]
verify_jwt = true

[functions.l3-checkout]
verify_jwt = false

# Public delivery bootstrap/consume endpoint. It verifies Stripe payment once,
# then requires the one-time short-lived entitlement token contract.
[functions.l3-download]
verify_jwt = false

[functions.l3-refund]
verify_jwt = true

[functions.l3-connect-dashboard]
verify_jwt = true

# ---------------- M Network ----------------
[functions.mnet-track]
verify_jwt = false

[functions.mnet-activity]
verify_jwt = true
