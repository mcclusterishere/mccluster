# Supabase project config for the McCluster platform.
#
# Every function present in this reconciliation surface declares its gateway
# mode explicitly so a deploy cannot silently change public/webhook or
# authenticated control-plane behavior.

project_id = "zmnhbrjyhxzhkxmhkexs"

# Existing public/self-authenticated platform surfaces.
[functions.checkout]
verify_jwt = false

[functions.inbox]
verify_jwt = false

[functions.eu-converse]
verify_jwt = false

[functions.shake-order]
verify_jwt = false

[functions.domain-check]
verify_jwt = false

# Shared platform functions.
[functions.backend-sub]
verify_jwt = false

[functions.connect-onboard]
verify_jwt = false

# Private cross-model context plane. All three verify the caller again inside
# the function and enforce organization membership before touching ai_context.
[functions.context-ingest]
verify_jwt = true

[functions.context-query]
verify_jwt = true

[functions.context-decision]
verify_jwt = true

[functions.intake]
verify_jwt = false

[functions.m-oauth-bootstrap]
verify_jwt = true

[functions.ops-chat]
verify_jwt = true

[functions.outreach]
verify_jwt = true

[functions.outreach-webhook]
verify_jwt = false

[functions.pay-now]
verify_jwt = false

[functions.social]
verify_jwt = true

[functions.unsubscribe]
verify_jwt = false

# ---------------- Equity Uprise Policy OS ----------------
# Public intake and booking surfaces validate what anonymous callers may do.
[functions.eu-intake]
verify_jwt = false

[functions.eu-calendar]
verify_jwt = false

# Provider callbacks, OAuth callbacks, cron workers and monitors authenticate
# with provider signatures, one-time state or dedicated internal secrets.
[functions.eu-google-workspace]
verify_jwt = false

[functions.eu-worker]
verify_jwt = false

[functions.eu-external-worker]
verify_jwt = false

[functions.eu-ddex-worker]
verify_jwt = false

[functions.eu-monitor]
verify_jwt = false

[functions.eu-orcid-oauth]
verify_jwt = false

[functions.eu-crossref-callback]
verify_jwt = false

# Staff/fellow control surfaces require a Supabase user JWT at the gateway and
# repeat capability/resource authorization inside each function.
[functions.eu-workspace]
verify_jwt = true

[functions.eu-publish]
verify_jwt = true

[functions.eu-government]
verify_jwt = true

[functions.eu-music]
verify_jwt = true

[functions.eu-derivatives]
verify_jwt = true

[functions.eu-status]
verify_jwt = true

[functions.eu-control]
verify_jwt = true
