# Supabase project config, for the CLI and for CI.
#
# THE ONLY THING IN HERE THAT REALLY MATTERS IS verify_jwt.
#
# `supabase functions deploy` defaults verify_jwt to TRUE. Every function
# in this repo is reached by somebody who is not signed in — a Stripe
# webhook, a storefront checkout, a chat widget on a public page, a visitor
# typing a domain name — so deploying any of them with the default would
# answer 401 to the entire internet and look like an outage with no error
# in the logs. Each one is named here with the setting it actually runs on,
# so a deploy cannot quietly flip it.
#
# Functions NOT listed here do not live in this repo (pay-now,
# stripe-webhook, unsubscribe, intake, outreach, social, ops-chat,
# connect-onboard, backend-sub). A deploy from here never touches them.

project_id = "zmnhbrjyhxzhkxmhkexs"

# Server-priced Stripe/Square checkout. Called from pay.html by anyone.
[functions.checkout]
verify_jwt = false

# The chat widget's brain. Also the webhook target for every social
# channel, which is why it authenticates callers itself — see callerFor()
# in supabase/functions/inbox/index.ts — rather than leaning on the
# gateway. Staff routes check inbox_staff; webhook routes check the
# channel's own signature.
[functions.inbox]
verify_jwt = false

# Equity Uprise conversation. Public by design.
[functions.eu-converse]
verify_jwt = false

# Shake shop ordering. Shelved but deployed; left as it runs.
[functions.shake-order]
verify_jwt = false

# Domain availability. The person typing in the box has not signed in and
# is not going to before they know whether the name is free.
[functions.domain-check]
verify_jwt = false
