# Supabase project config, for the CLI and for CI.
# Every Edge Function declares its gateway auth mode explicitly. Public/webhook
# functions authenticate internally; staff-only functions use gateway JWT plus
# their own authorization checks.

project_id = "zmnhbrjyhxzhkxmhkexs"

[functions.checkout]
verify_jwt = false

[functions.inbox]
verify_jwt = false

[functions.eu-converse]
verify_jwt = false

[functions.shake-order]
verify_jwt = false

[functions.domain-check]
verify_jwt = false

# ---------------- Equity Uprise Policy OS ----------------
# Public intake and public booking availability/request surface. The functions
# restrict what anonymous callers can do and never expose privileged data.
[functions.eu-intake]
verify_jwt = false

[functions.eu-calendar]
verify_jwt = false

# Pub/Sub / cron / OAuth callback / internal workers authenticate using provider
# signatures, one-time OAuth state, or dedicated internal secrets.
[functions.eu-google-workspace]
verify_jwt = false

[functions.eu-worker]
verify_jwt = false

[functions.eu-external-worker]
verify_jwt = false

[functions.eu-ddex-worker]
verify_jwt = false

[functions.eu-monitor]
verify_jwt = false

[functions.eu-orcid-oauth]
verify_jwt = false

# Staff/fellow control surfaces require a real Supabase user JWT at the gateway
# and repeat resource/capability checks inside the function.
[functions.eu-workspace]
verify_jwt = true

[functions.eu-publish]
verify_jwt = true

[functions.eu-government]
verify_jwt = true

[functions.eu-music]
verify_jwt = true

[functions.eu-derivatives]
verify_jwt = true

[functions.eu-status]
verify_jwt = true

[functions.eu-control]
verify_jwt = true
