<!doctype html>
<html lang="en" data-look="day">
<head><script src="js/shell-boot.js?v=578e683088fd"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>World · Owner</title>
  <meta name="description" content="Owner-only mission world and world builder for the PRIM3 tactics game.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e9edef">
  <meta name="color-scheme" content="light">
  <!-- the shared bottom bar's styles (every page carrying js/tabbar.js links it); this page's own rules follow and win -->
  <link rel="stylesheet" href="css/style.css?v=578e683088fd">
  <style>
    /* The tactics game's Day look (prim3-transit.html :root[data-look="day"]): light panels, teal squad, red threats,
       amber objectives. Text tones are darker steps of the same hues so small type stays readable on the light ground. */
    :root{
      --bg:#e9edef;--panel:rgba(250,251,251,.94);--panel2:rgba(241,244,245,.96);--line:rgba(20,30,36,.14);--line2:rgba(20,30,36,.26);
      --ink:#16202a;--dim:rgba(22,32,42,.66);--squad:#0fa9ba;--squad-ink:#0a7380;--squad-soft:rgba(15,169,186,.16);
      --threat:#d81f2a;--amber:#d98a0a;--amber-ink:#1b1206;--amber-text:#8a5400;--sea:#cfdfe8;
      --r:10px;--font:600 15px/1.3 "Rajdhani","Barlow Condensed",system-ui,-apple-system,"Segoe UI",sans-serif
    }
    /* css/style.css opts pages into cross-document view transitions; the game pages this opens do not, and Chrome aborts
       (and reports) a transition the new page has not opted into, so this page leaves it off */
    @view-transition{navigation:none}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink)}
    body{font:var(--font);letter-spacing:.02em;min-height:100svh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit;color:inherit}
    input,select,textarea{font-size:max(16px,1rem);font-weight:500;letter-spacing:0}
    a{color:var(--squad-ink)}
    [hidden]{display:none!important}
    /* the top keeps clear of the shared bar's fixed Profile chip (44px at 12px from the top right) */
    .pw{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:calc(64px + env(safe-area-inset-top)) 16px 16px;max-width:1440px;margin:0 auto}
    .pw-lockup{display:block;height:44px;width:auto}
    /* gate */
    .pw-gate{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:8px;margin-top:12vh;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:460px}
    .pw-gate h1{margin:0;font-size:24px;letter-spacing:.14em;text-transform:uppercase}
    .pw-gate p{margin:0;color:var(--dim);font-weight:500}
    /* top */
    .pw-top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
    .pw-title{min-width:0;display:grid;line-height:1.1}
    .pw-title h1{margin:0;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
    .pw-title small{color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .pw-modes{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .pw-seg{min-height:44px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);cursor:pointer;letter-spacing:.12em;text-transform:uppercase}
    .pw-seg[aria-pressed="true"]{border-color:var(--squad);color:var(--squad-ink);box-shadow:inset 0 0 0 1px var(--squad);background:var(--squad-soft)}
    .pw-filter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
    .pw-chip{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);cursor:pointer;letter-spacing:.08em}
    .pw-chip[aria-pressed="true"]{border-color:var(--squad);color:var(--squad-ink);background:var(--squad-soft)}
    .pw-chip small{color:var(--dim);margin-left:4px}
    .pw-banner{margin:0;padding:8px 12px;border:1px solid var(--amber);border-radius:8px;background:rgba(217,138,10,.08);color:var(--amber-text);font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .pw-body{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
    /* globe */
    .pw-globe{position:relative;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(120% 90% at 50% 40%,#f7fafb,#dfe8ec);overflow:hidden;aspect-ratio:1;max-height:72svh;width:100%;touch-action:none}
    .pw-globe-stage{position:absolute;inset:0;z-index:0}
    .pw-globe-stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
    .pw-cam{position:absolute;z-index:2;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
    .pw-ibtn{min-width:44px;min-height:44px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:18px}
    .pw-hint{position:absolute;z-index:2;pointer-events:none;left:8px;top:8px;max-width:min(240px,60%);margin:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);font-size:13px;font-weight:500}
    .pw-noglobe{position:absolute;z-index:1;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--dim)}
    /* card */
    .pw-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;display:grid;gap:8px;min-width:0}
    .pw-eye{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    .pw-eye b{color:var(--amber-text)}
    .pw-card h2{margin:0;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
    .pw-card h3{margin:0;font-size:19px;letter-spacing:.08em;text-transform:uppercase}
    .pw-sub{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    .pw-sub b{color:var(--amber-text)}
    .pw-agents,.pw-mission,.pw-news{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
    .pw-agent-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
    .pw-agent{padding:8px 10px;border:1px solid var(--squad);border-radius:8px;background:var(--squad-soft);font-size:17px}
    .pw-agent small{display:block;color:var(--dim);font-weight:500;font-size:14px}
    .pw-feat{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--amber);border-radius:4px;color:var(--amber-text);font-size:12px;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
    .pw-news{border-top-style:dashed}
    .pw-desk{display:grid;gap:6px;min-width:0;padding-bottom:10px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
    .pw-desk-brief{margin:0;padding:8px 10px;border-left:3px solid var(--squad);background:var(--squad-soft);border-radius:0 8px 8px 0;font-size:16px;line-height:1.4}
    .pw-desk-brief small{display:block;margin-top:4px;color:var(--dim);font-size:13px;font-weight:500}
    .pw-desk-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:min(46vh,420px);overflow:auto;overscroll-behavior:contain}
    .pw-desk-item{display:grid;gap:2px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
    .pw-desk-item small{color:var(--dim);font-size:13px}
    .pw-desk-item small a{color:inherit}
    .pw-desk-item span{font-size:15px;line-height:1.35}
    .pw-who{margin:0;font-size:16px}
    .pw-who small{display:block;color:var(--dim);font-weight:500;font-size:14px}
    .pw-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
    .pw-meta li{padding:3px 8px;border:1px solid var(--line2);border-radius:4px;font-size:13px;font-weight:600}
    .pw-meta .is-draft{border-color:var(--amber);color:var(--amber-text)}
    .pw-brief{margin:0;font-weight:500;font-size:16px;line-height:1.45}
    .pw-obj{margin:0;padding:8px 10px;border-left:3px solid var(--amber);background:rgba(217,138,10,.07);font-size:15px}
    .pw-obj small{display:block;color:var(--amber-text);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .pw-note{margin:0;color:var(--dim);font-size:14px;font-weight:500}
    .pw-src summary{min-height:44px;display:flex;align-items:center;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
    .pw-src ul{margin:0;padding-left:1.1rem;display:grid;gap:3px;font-size:14px;font-weight:500;overflow-wrap:anywhere}
    .pw-src code{font-size:13px}
    .pw-deploy{min-height:52px;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#ffc35e,#e2972a);color:var(--amber-ink);text-decoration:none;font-size:18px;letter-spacing:.16em;text-transform:uppercase}
    .pw-row{display:flex;flex-wrap:wrap;gap:8px}
    .pw-btn{min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);cursor:pointer;letter-spacing:.08em;text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
    .pw-btn--go{border-color:var(--squad);color:var(--squad-ink)}
    .pw-btn--warn{border-color:var(--threat);color:var(--threat)}
    .pw-btn:disabled{opacity:.45;cursor:default}
    .pw-empty{margin:0;color:var(--dim);font-weight:500}
    /* list */
    .pw-list{display:grid;gap:12px}
    .pw-list h2{margin:4px 0 0;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
    .pw-items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
    .pw-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
    .pw-item button{all:unset;cursor:pointer;min-height:44px;display:grid;align-content:center;min-width:0}
    .pw-item button:focus-visible{outline:3px solid var(--squad-ink);outline-offset:2px;border-radius:4px}
    .pw-item b{font-size:16px;letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
    .pw-item small{color:var(--dim);font-weight:500;font-size:14px}
    .pw-item .is-feat{color:var(--amber-text)}
    /* builder */
    .pw-edit{display:grid;gap:10px}
    .pw-store{margin:0;padding:8px 10px;border:1px dashed var(--line2);border-radius:8px;color:var(--dim);font-weight:500;font-size:14px}
    .pw-form{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
    .pw-field{display:grid;gap:4px;min-width:0}
    .pw-field > span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
    .pw-field input,.pw-field select,.pw-field textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff}
    .pw-field textarea{min-height:96px;resize:vertical;line-height:1.4}
    .pw-field.is-bad input,.pw-field.is-bad select,.pw-field.is-bad textarea{border-color:var(--threat)}
    .pw-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .pw-check{display:flex;align-items:center;gap:8px;min-height:44px}
    .pw-check input{width:22px;height:22px}
    .pw-checks{margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
    .pw-checks.is-ok{border-color:var(--squad);color:var(--squad-ink)}
    .pw-checks.is-bad{border-color:var(--threat)}
    .pw-checks ul{margin:6px 0 0;padding-left:1.1rem;color:var(--ink);font-weight:500;font-size:14px;display:grid;gap:2px}
    .pw-status{margin:0;min-height:1.3em;color:var(--dim);font-weight:500}
    .pw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media (min-width:700px){
      .pw-top{grid-template-columns:auto minmax(0,1fr) minmax(0,360px)}
      .pw-modes{grid-column:auto}
      .pw-items{grid-template-columns:repeat(2,minmax(0,1fr))}
      .pw-form .pw-span2{grid-column:1 / -1}
      .pw-form{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (min-width:1024px){
      .pw-body{grid-template-columns:minmax(0,1fr) minmax(0,420px)}
      .pw-globe{max-height:calc(100svh - 230px);position:sticky;top:calc(64px + env(safe-area-inset-top))}
      .pw-items{grid-template-columns:repeat(3,minmax(0,1fr))}
      .pw-body.is-list{grid-template-columns:minmax(0,1fr)}
    }
  </style>
</head>
<body>
  <main class="pw" id="pw">
    <!-- Nothing but this panel exists until the server says this is the house owner (js/owner-only.mjs); the app's
         modules and the mission file load only after that yes. -->
    <section class="pw-gate owner-gate" id="pwGate" aria-live="polite" data-owner-gate data-owner-template="pwTpl" data-owner-load="js/prim3-world/news-desk.mjs js/prim3-world/app.mjs">
      <img class="pw-lockup" src="assets/img/prim3-lockup-512.png" alt="PRIM3" width="62" height="44">
      <h1>Owner only</h1>
      <p id="pwGateMsg" data-owner-msg>Checking access with the server…</p>
    </section>
    <template id="pwTpl"><p><a href="prim3-city-tactics.html">City tactics simulation · shared square/hex streets</a></p><div id="pwApp" hidden></div></template>
  </main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script type="module" src="js/owner-only.mjs?v=578e683088fd"></script>
  <script src="js/tabbar.js?v=578e683088fd"></script>
</body>
</html>
